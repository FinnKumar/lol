};

function wireEvents() {
  const finnBtn = $('finnBtn');
  finnBtn.addEventListener('pointerdown', ev => {
    if (ev.button !== undefined && ev.button > 0) return;
    onFinnPress(ev);
  });
  finnBtn.addEventListener('click', ev => { if (ev.detail === 0) onFinnPress(ev); });
  finnBtn.addEventListener('contextmenu', ev => ev.preventDefault());

  const onAct = ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el.dataset, el);
  };
  $('tabBody').addEventListener('click', ev => {
    if (ev.target.closest('#arena')) { onArenaClick(ev); return; }
    onAct(ev);
  });
  $('tabs').addEventListener('click', onAct);

  $('tabBody').addEventListener('change', ev => {
    const nameEl = ev.target.closest('[data-name]');
    if (nameEl) {
      S.playerName = (nameEl.value || '').trim().slice(0, 16) || 'You';
      T.boardCache = {};
      ui.dirty = true;
      return;
    }
    const el = ev.target.closest('[data-set]');
    if (!el) return;
    const key = el.getAttribute('data-set');
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') v = Math.max(1, Math.floor(+el.value) || 1);
    else if (key === 'autosave') v = +el.value;
    else v = el.value;
    S.settings[key] = v;
    if (key === 'notation') ui.dirty = true;
  });

  $('tabBody').addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'codeInput') ACTIONS.redeem();
  });

  $('modalRoot').addEventListener('click', ev => {
    const btn = ev.target.closest('[data-ma]');
    if (btn) {
      const a = ui.modalActions[+btn.getAttribute('data-ma')];
      closeModal();
      if (a && a.fn) a.fn();
      return;
    }
    if (ev.target.classList.contains('modal-back')) closeModal();
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

  $('btnSound').addEventListener('click', () => { S.settings.sound = !S.settings.sound; sfx.unlock(); if (S.settings.sound) sfx.buy(); ui.dirty = ui.tab === 'settings'; });
  $('btnFx').addEventListener('click', () => { S.settings.particles = !S.settings.particles; ui.dirty = ui.tab === 'settings'; });
  $('btnSave').addEventListener('click', () => ACTIONS.savenow());

  window.addEventListener('beforeunload', () => saveGame());
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
}

function wireBus() {
  bus.on('goldenSpawn', g => { addGoldenEl(g); if (S.settings.goldenAlert) sfx.goldenSpawn(); });
  bus.on('goldenEnd', (g, clicked) => {
    const el = ui.goldenEls[g.uid];
    if (el) { el.remove(); delete ui.goldenEls[g.uid]; }
    if (clicked) sfx.golden();
  });
  bus.on('goldenClick', res => toast(res.name, res.text, 'gold'));
  bus.on('achievement', a => { toast('Achievement: ' + a.name, a.desc, 'gold'); sfx.achievement(); ui.dirty = ui.dirty || ui.tab === 'quests'; });
  bus.on('toast', t => toast(t.title, t.text, t.tone));
  bus.on('questReady', q => { toast('Quest complete', questText(q), 'good'); sfx.win(); });
  bus.on('questClaimed', q => toast('Reward claimed', questRewardText(q.reward), 'good'));
  bus.on('prestige', p => {
    sfx.prestige();
    fx.burstCenter(40);
    const nm = { rebirth: 'Reborn!', transcend: 'Transcended!', ascend: 'Ascended!' }[p.layer];
    const unit = { rebirth: 'Rebirth Tokens', transcend: 'Shards', ascend: 'Crowns' }[p.layer];
    toast(nm, '+' + fmtInt(p.gain) + ' ' + unit, 'gold');
    ui.dirty = true;
    ui.skinSig = '';
  });
  bus.on('hatch', (results, egg) => {
    const best = results.reduce((a, b) => (RARITY_ORDER.indexOf(b.def.rarity) > RARITY_ORDER.indexOf(a.def.rarity) ? b : a), results[0]);
    const high = RARITY_ORDER.indexOf(best.def.rarity) >= 4;
    if (high) { sfx.rare(); fx.burstCenter(36); } else sfx.hatch();
    if (results.length === 1) {
      toast(best.def.emoji + ' ' + best.def.name, RARITIES[best.def.rarity].name + ' | ' + petEffectText(best.pet), high ? 'gold' : 'good');
    } else {
      const counts = {};
      results.forEach(r => { counts[r.def.id] = (counts[r.def.id] || 0) + 1; });
      const body = '<div class="owned-list" style="justify-content:center">' + Object.keys(counts).map(id => {
        const d = PET_BY_ID[id];
        return '<span class="owned-chip r-' + d.rarity + '" style="border-width:3px">' + d.emoji + ' ' + esc(d.name) + ' x' + counts[id] + '</span>';
      }).join('') + '</div>';
      showModal('Hatched ' + results.length + ' pets!', body, [{ label: 'Nice', cls: 'btn-sun' }]);
    }
    ui.dirty = true;
  });
  bus.on('offline', r => showOfflineModal(r));
  bus.on('kumarUnlock', k => {
    toast('New Kumar: ' + k.name, k.boost, 'gold');
    sfx.rare();
    fx.burstCenter(40);
    ui.dirty = true;
  });
  bus.on('kumarSelect', () => { ui.skinSig = ''; ui.dirty = true; });
  bus.on('research', n => {
    const el = $('qsRp');
    if (el) { const r = el.getBoundingClientRect(); fx.floatText(r.left + r.width / 2, r.top, '+' + n + ' RP', 'small'); }
    sfx.tick();
  });
  bus.on('rankUp', (rank, passed) => {
    toast('Rank up! You are #' + rank, passed ? 'You passed ' + passed + '.' : '', 'gold');
    sfx.win();
    ui.dirty = ui.dirty || ui.tab === 'board';
  });
  bus.on('missionClaimed', r => toast(r.mission.name + ' complete', r.kumar.name + ' brought back ' + r.text + '.', 'gold'));
}

function showOfflineModal(r) {
  showModal('Welcome back!', '<p>You were away for <b>' + fmtTime(r.seconds) + '</b>.</p>'
    + '<p>Your Kumars worked at ' + Math.round(r.eff * 100) + '% efficiency' + (r.capped ? ' (capped at ' + fmtTime(r.used) + ')' : '') + ' and earned <b>' + fmt(r.gain) + ' Finn Kumar</b>' + (r.rp > 0 ? ' and <b>' + r.rp + ' research points</b>' : '') + '.</p>',
  [{ label: 'Collect', cls: 'btn-sun' }]);
}

/* =====================================================================
   FINN KUMAR INCREMENTAL - boot
   ===================================================================== */
(function boot() {
  const saved = readSave();
  const offline = initGame(saved);
  fx.init();
  wireEvents();
  wireBus();

  ui.skinSig = '';
  updateStage();
  renderNav();
  renderTab();

  /* the arena delegate lives on tabBody; make sure Finn art is present immediately */
  if (offline && offline.gain > 0) showOfflineModal(offline);
  if (!saved) {
    toast('Welcome to Finn Kumar Incremental', 'Click Finn to earn Finn Kumar. Buy generators to earn it while you are away.', 'gold');
  }

  /* simulation runs 10 times a second */
  setInterval(function () {
    try { tick(); } catch (err) { console.error('tick failed', err); }
  }, 100);

  /* the screen refreshes a little slower than the simulation */
  setInterval(function () {
    try {
      updateStage();
      updateTabs();
    } catch (err) {
      console.error('render failed', err);
    }
  }, 150);

  /* periodic checks that do not need to run every frame */
  setInterval(function () {
    try { recalc(); } catch (err) { console.error(err); }
  }, 1000);
})();

</script>
</body>
</html>
