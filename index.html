<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finn Kumar Incremental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout concept: chunky cartoon sticker-sheet. A sticky Finn stage on the left, tabbed shop on the right.
   Thick ink outlines, hard offset shadows, saturated cobalt ground. One committed look, so a single theme. */
:root {
  --ink: #17133b;
  --ink-soft: #2a2466;
  --ground: #3b2ee0;
  --ground-deep: #2a1fb4;
  --paper: #f5f3ff;
  --paper-2: #e6e2ff;
  --paper-3: #d3ccff;
  --muted: #6a63a8;
  --sun: #ffd43b;
  --sun-deep: #e8a900;
  --pink: #ff5c9d;
  --mint: #25d9a2;
  --sky: #4cc9ff;
  --orange: #ff9a3c;
  --danger: #ff4d5e;
  --line: 3px solid var(--ink);
  --shadow: 5px 5px 0 var(--ink);
  --shadow-sm: 3px 3px 0 var(--ink);
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: "Lilita One", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-common: #9aa3c7;
  --r-uncommon: #3ccf7a;
  --r-rare: #3d9bff;
  --r-epic: #b05cff;
  --r-legendary: #ffb21e;
  --r-mythic: #ff4f86;
  --r-secret: #17133b;
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body { height: auto; }

body {
  margin: 0;
  background-color: var(--ground);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.10) 0, rgba(255, 255, 255, 0) 38%),
    radial-gradient(var(--ground-deep) 2px, transparent 2.5px);
  background-size: auto, 26px 26px;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--ink);
  z-index: 30;
}

button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, .finn-btn:focus-visible {
  outline: 3px solid var(--sun);
  outline-offset: 2px;
}

.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-weight: 500; }
.hidden { display: none !important; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.num { font-variant-numeric: tabular-nums; }

.star-tag { color: var(--sun-deep); font-weight: 800; letter-spacing: 1px; text-shadow: 0 0 0 var(--ink); }

/* ---------- Evolution bar under the Kumar ---------- */
.evo-box { width: 100%; max-width: 330px; margin: 8px auto 2px; }
.evo-top { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 15px; color: var(--ink); margin-bottom: 4px; }
.evo-bar { height: 20px; }
.evo-fill { background: linear-gradient(90deg, #25d9a2, #ffd43b, #ff5c9d); transition: width .12s linear; }
.evo-txt { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); margin-top: 3px; font-family: var(--font-mono); }
.evo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; margin-top: 12px; }
.evo-card { background: var(--paper); border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.evo-card.lead { background: #fff6cf; }
.evo-card-top { display: flex; align-items: center; gap: 10px; }
.evo-ic { font-size: 30px; }
.evo-card-name { font-family: var(--font-display); font-size: 18px; }
.evo-card-tier { font-size: 12px; font-weight: 800; color: var(--muted); }
.evo-card-boost { font-size: 12px; font-weight: 800; }
.star-tag { color: var(--sun-deep); font-weight: 800; letter-spacing: 1px; }

/* ---------- Mega Tree ---------- */
.mt-head { background: linear-gradient(135deg, #fff0f7, #fff8d6); }
.mt-branches { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 10px; margin: 6px 0; }
.mt-branch { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 92px; padding: 8px 10px; background: var(--paper); border: var(--line); border-radius: 14px; box-shadow: var(--shadow-sm); cursor: pointer; font-family: var(--font-display); color: var(--ink); transition: transform .1s; }
.mt-branch:hover { transform: translateY(-2px); }
.mt-branch.active { background: var(--bc); box-shadow: 5px 5px 0 var(--ink); transform: translateY(-3px); }
.mt-b-ic { font-size: 24px; }
.mt-b-name { font-size: 14px; }
.mt-b-count { font-size: 11px; font-family: var(--font-mono); font-weight: 800; opacity: .75; }
.mt-panel { border-top: 8px solid var(--bc); }
.mt-title { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.mt-title-ic { width: 52px; height: 52px; display: grid; place-items: center; font-size: 30px; background: var(--bc); border: var(--line); border-radius: 50%; box-shadow: var(--shadow-sm); }
.mt-lane { margin-top: 14px; }
.mt-lane-name { font-family: var(--font-display); font-size: 15px; margin-bottom: 6px; color: var(--ink-soft); letter-spacing: .5px; text-transform: uppercase; }
.mt-track { display: flex; gap: 22px; overflow-x: auto; padding: 8px 6px 14px; position: relative; }
.mt-node { position: relative; flex: 0 0 auto; width: 112px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 10px 6px 8px; background: #e7e4f7; border: var(--line); border-radius: 16px; box-shadow: var(--shadow-sm); cursor: pointer; text-align: center; color: var(--ink); font-family: var(--font-body); transition: transform .1s; }
.mt-node:not(:last-child)::after { content: ''; position: absolute; top: 50%; left: 100%; width: 22px; height: 6px; margin-top: -3px; background: var(--ink); opacity: .25; border-radius: 3px; }
.mt-node.owned:not(:last-child)::after { background: var(--bc); opacity: 1; border: 2px solid var(--ink); height: 10px; margin-top: -5px; box-sizing: border-box; }
.mt-ic { font-size: 28px; line-height: 1; }
.mt-nm { font-family: var(--font-display); font-size: 13px; }
.mt-fx { font-size: 11px; font-weight: 700; line-height: 1.15; min-height: 26px; color: var(--ink-soft); }
.mt-quip { font-size: 10px; line-height: 1.15; font-weight: 800; color: var(--muted); min-height: 22px; padding: 2px 3px 0; }
.up-quip { font-size: 11px; line-height: 1.2; font-weight: 800; color: var(--muted); margin-top: 2px; font-style: italic; }
.mt-cost { font-family: var(--font-mono); font-size: 12px; font-weight: 800; background: var(--paper); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 8px; }
.mt-node.locked { opacity: .55; filter: grayscale(.8); cursor: not-allowed; }
.mt-node.avail { background: #fff; }
.mt-node.afford { background: #fffbe0; animation: mtPulse 1.4s ease-in-out infinite; }
.mt-node.afford:hover { transform: translateY(-3px) scale(1.03); }
.mt-node.owned { background: var(--bc); box-shadow: 3px 3px 0 var(--ink), 0 0 14px var(--bc); }
.mt-node.owned .mt-cost { background: var(--ink); color: #fff; }
@keyframes mtPulse { 0%, 100% { box-shadow: 3px 3px 0 var(--ink), 0 0 0 rgba(255,212,59,0); } 50% { box-shadow: 3px 3px 0 var(--ink), 0 0 16px rgba(255,212,59,.95); } }
.mt-totals { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.mt-total { display: flex; justify-content: space-between; gap: 8px; padding: 8px 12px; background: var(--paper-3); border: 2px solid var(--ink); border-radius: 12px; font-weight: 800; font-size: 13px; }
.rename-row { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
.rename-row .input { flex: 1; min-width: 0; }

/* ---------- Prestige overview ---------- */
.pl-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.pl-card { background: var(--paper); border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.pl-card.rebirth { border-top: 8px solid #ff5c9d; } .pl-card.transcend { border-top: 8px solid #4cc9ff; }
.pl-card.ascend { border-top: 8px solid #ffd43b; } .pl-card.mega { border-top: 8px solid #8d7bff; }
.pl-card.locked { opacity: .7; filter: grayscale(.6); }
.pl-head { display: flex; align-items: center; gap: 8px; }
.pl-ic { font-size: 26px; } .pl-name { font-family: var(--font-display); font-size: 20px; }
.pl-desc { margin: 0; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
.pl-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }
.pl-hint { text-align: center; font-size: 12px; font-weight: 800; color: var(--muted); margin: 10px 0 0; }
.pl-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: var(--paper); border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 10px; }
.pl-bar-title { font-family: var(--font-display); font-size: 20px; }
.layer-body { max-height: calc(100vh - 290px); min-height: 260px; overflow: auto; padding: 2px 4px 8px; }
.mega-info { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.mega-note { font-size: 12px; font-weight: 700; color: var(--ink-soft); }
.layer-body .mt-track { flex-wrap: wrap; gap: 10px; overflow: visible; padding: 6px 2px; }
.layer-body .mt-node { width: 98px; padding: 8px 4px 6px; } .layer-body .mt-node::after { display: none !important; }
.layer-body .mt-ic { font-size: 22px; } .layer-body .mt-fx { min-height: 22px; font-size: 10px; }
@media (max-width: 700px) { .pl-grid { grid-template-columns: 1fr; } }

.mt-badge { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-family: var(--font-display); font-size: 9px; letter-spacing: 1px; background: var(--ink); color: #ffd43b; padding: 1px 7px; border-radius: 99px; white-space: nowrap; }
.mt-badge.major { background: #ff5c9d; color: #fff; }
.mt-node.major { border-color: #ff5c9d; }
.mt-node.key { width: 128px !important; border-width: 4px; background: linear-gradient(160deg, #fff4c4, #ffe38a); }
.mt-node.key .mt-ic { font-size: 32px; } .mt-node.key .mt-nm { font-size: 15px; } .mt-node.key .mt-fx { font-size: 11px; font-weight: 800; color: var(--ink); }
.mt-node.key.locked { background: #e7e4f7; }
.mt-node.key.owned { background: linear-gradient(160deg, var(--bc), #fff3a6); box-shadow: 3px 3px 0 var(--ink), 0 0 22px var(--bc); }
.mt-node.key:not(.owned):not(.locked) { animation: mtKey 1.8s ease-in-out infinite; }
@keyframes mtKey { 0%, 100% { box-shadow: 3px 3px 0 var(--ink), 0 0 0 rgba(255,150,40,0); } 50% { box-shadow: 3px 3px 0 var(--ink), 0 0 20px rgba(255,150,40,.9); } }
.layer-body .mt-node.key { width: 112px !important; }

/* ---------- Kumar quests + World 2 ---------- */
.kq-box { margin-top: 6px; padding: 8px; background: var(--paper-3); border: 2px solid var(--ink); border-radius: 12px; }
.kq-top { display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
.kq-text { font-size: 12px; font-weight: 800; margin: 4px 0; color: var(--ink-soft); }
.bt-hud { position: sticky; top: 0; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 12px; background: var(--paper); border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); margin-bottom: 10px; }
.bt-me { flex: 1 1 220px; min-width: 200px; display: flex; flex-direction: column; gap: 3px; }
.bt-who { font-family: var(--font-display); font-size: 16px; }
.bt-hpfill { background: linear-gradient(90deg, #ff5c7a, #25d9a2); }
.bt-num { font-family: var(--font-mono); font-size: 12px; font-weight: 800; text-align: center; color: var(--ink-soft); }
.bt-pill { padding: 6px 12px; background: var(--paper-3); border: 2px solid var(--ink); border-radius: 999px; font-weight: 800; font-size: 13px; }
.bt-pill.gold { background: #fff0a8; }
.bt-arena { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px; background: linear-gradient(180deg, #e8e4ff, #fff); border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.bt-arena.boss { background: linear-gradient(180deg, #ffd6e0, #fff); border-color: #ff5c7a; }
.bt-mon { width: 140px; height: 140px; border-radius: 50%; border: var(--line); background: #fff; box-shadow: 5px 5px 0 var(--ink); cursor: pointer; transition: transform .08s; }
.bt-mon:active { transform: scale(.92) rotate(-4deg); }
.bt-mon-ic { font-size: 76px; line-height: 1; }
.bt-arena.boss .bt-mon { width: 170px; height: 170px; } .bt-arena.boss .bt-mon-ic { font-size: 96px; }
.bt-mon-name { font-family: var(--font-display); font-size: 22px; }
.bt-monbar { width: min(420px, 100%); height: 22px; } .bt-monfill { background: linear-gradient(90deg, #ff5c7a, #ffd43b); }
.bt-log { font-size: 13px; font-weight: 800; color: var(--ink-soft); min-height: 18px; }
.bt-controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin: 12px 0; }
.bt-dots { display: grid; grid-template-columns: repeat(25, 1fr); gap: 4px; max-width: 560px; margin: 0 auto; }
.bt-dot { height: 12px; border-radius: 4px; background: #d8d3f5; border: 2px solid var(--ink); } .bt-dot.done { background: #25d9a2; } .bt-dot.boss { border-color: #ff5c7a; }
.bt-dot.cur { background: #ffd43b; transform: scale(1.25); }
.bt-lock { text-align: center; } .bt-lock-ic { font-size: 48px; }

/* ---------- App shell ---------- */
.app {
  max-width: 1320px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--ink);
  color: var(--paper);
  border-bottom: 4px solid var(--sun);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
}

.brand {
  font-family: var(--font-display);
  font-size: 22px;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--sun);
  text-transform: uppercase;
}
.brand small {
  display: block;
  font-family: var(--font-body);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--paper-3);
  margin-top: 3px;
}

.bank { text-align: center; min-width: 0; }
.bank-num {
  font-family: var(--font-display);
  font-size: clamp(26px, 4.2vw, 44px);
  line-height: 1;
  color: var(--paper);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.bank-label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sun); margin-top: 2px; }
.bank-rate { font-family: var(--font-mono); font-size: 13px; color: var(--mint); margin-top: 2px; }

.top-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 2px solid var(--paper-3);
  background: var(--ink-soft);
  color: var(--paper);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform 0.08s ease, background 0.12s ease;
}
.icon-btn:hover { background: var(--ground); }
.icon-btn:active { transform: translateY(2px); }
.icon-btn.off { opacity: 0.55; text-decoration: line-through; }

/* ---------- News ticker ---------- */
.ticker {
  margin-top: 14px;
  background: var(--sun);
  border: var(--line);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 38px;
}
.ticker-tag {
  flex: none;
  background: var(--ink);
  color: var(--sun);
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.1em;
  padding: 3px 8px;
  border-radius: 6px;
}
.ticker-text { min-width: 0; font-size: 14px; animation: tickIn 0.5s ease both; }
@keyframes tickIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Main layout ---------- */
.layout {
  margin-top: 18px;
  display: grid;
  grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.panel {
  background: var(--paper);
  border: var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  min-width: 0;
}
.panel-title {
  font-family: var(--font-display);
  font-size: 20px;
  margin: 0 0 8px;
  letter-spacing: 0.01em;
}
.panel-sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

/* ---------- Stage (left) ---------- */
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.finn-stage {
  position: relative;
  background: var(--paper);
  border: var(--line);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 14px 14px 16px;
  text-align: center;
  overflow: hidden;
}
.finn-stage::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-conic-gradient(from 0deg at 50% 46%, var(--aura-a, rgba(255, 212, 59, 0.22)) 0deg 10deg, transparent 10deg 20deg);
  opacity: var(--aura-o, 0.55);
  animation: spinSlow 60s linear infinite;
  pointer-events: none;
}
@keyframes spinSlow { to { transform: rotate(360deg); } }

.finn-wrap {
  position: relative;
  width: min(100%, 270px);
  aspect-ratio: 1 / 1;
  margin: 4px auto 0;
}
.finn-btn {
  position: relative;
  width: 100%;
  height: 100%;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 50%;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.07s ease;
}
.finn-btn:active, .finn-btn.squish { transform: scale(0.93, 0.89); }
.finn-btn svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: none; }
.finn-btn.hype svg { animation: wobble 0.5s ease-in-out infinite alternate; }
@keyframes wobble { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

.finn-name {
  position: relative;
  margin-top: 8px;
  font-family: var(--font-display);
  font-size: 22px;
  line-height: 1.1;
}
.finn-title { position: relative; font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

.click-info { position: relative; display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--paper-2);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}
.pill.sun { background: var(--sun); }
.pill.mint { background: var(--mint); }
.pill.pink { background: var(--pink); color: #fff; }
.pill.sky { background: var(--sky); }

.combo { position: relative; margin-top: 12px; }
.combo-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.combo-bar { height: 16px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper-3); overflow: hidden; }
.combo-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--mint), var(--sun), var(--pink));
  border-right: 2px solid var(--ink);
  transition: width 0.08s linear;
}

.buffs { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.buff-chip {
  position: relative;
  background: var(--pink);
  color: #fff;
  border: 2px solid var(--ink);
  border-radius: 10px;
  padding: 3px 9px 3px 9px;
  font-size: 12px;
  box-shadow: 2px 2px 0 var(--ink);
  animation: pop 0.25s ease both;
}
.buff-chip.sunny { background: var(--sun); color: var(--ink); }
.buff-chip.cool { background: var(--sky); color: var(--ink); }
.buff-chip .t { font-family: var(--font-mono); margin-left: 6px; font-weight: 500; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }

.quick-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qs {
  background: var(--paper-2);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 6px 10px;
  min-width: 0;
}
.qs span { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.qs b { font-family: var(--font-display); font-weight: 400; font-size: 18px; overflow-wrap: anywhere; }

/* ---------- Buttons ---------- */
.btn {
  appearance: none;
  border: var(--line);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 16px;
  letter-spacing: 0.02em;
  border-radius: 12px;
  padding: 7px 14px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.07s ease, box-shadow 0.07s ease, filter 0.12s ease;
}
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: 1px 1px 0 var(--ink); }
.btn-sun { background: var(--sun); }
.btn-mint { background: var(--mint); }
.btn-pink { background: var(--pink); color: #fff; }
.btn-sky { background: var(--sky); }
.btn-ink { background: var(--ink); color: var(--sun); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { font-size: 13px; padding: 4px 10px; border-width: 2px; border-radius: 9px; box-shadow: 2px 2px 0 var(--ink); }
.btn-block { width: 100%; }

/* ---------- Tabs ---------- */
.content { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 4px 8px 2px;
  scrollbar-width: thin;
}
.tab-btn {
  flex: none;
  appearance: none;
  border: var(--line);
  background: var(--paper-2);
  font-family: var(--font-display);
  font-size: 16px;
  padding: 7px 14px;
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  position: relative;
  transition: transform 0.07s ease;
}
.tab-btn:hover { background: var(--paper); }
.tab-btn.active { background: var(--sun); transform: translateY(-2px); }
.tab-badge {
  position: absolute;
  top: -9px;
  right: -7px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--pink);
  color: #fff;
  border: 2px solid var(--ink);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 800;
  display: grid;
  place-items: center;
}
.tab-body { min-width: 0; display: flex; flex-direction: column; gap: 14px; }

/* ---------- Shop / generators ---------- */
.mode-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mode-btn {
  appearance: none;
  border: 2px solid var(--ink);
  background: var(--paper-2);
  border-radius: 9px;
  padding: 3px 12px;
  font-family: var(--font-display);
  font-size: 15px;
  cursor: pointer;
}
.mode-btn.active { background: var(--ink); color: var(--sun); }

.gen-list { display: flex; flex-direction: column; gap: 10px; }
.gen-row {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  background: var(--paper-2);
  border: var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
  transition: background 0.12s ease;
}
.gen-row.afford { background: #fff; }
.gen-row.locked { opacity: 0.7; filter: grayscale(0.7); }
.gen-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  border: 2px solid var(--ink);
  background: var(--paper-3);
  display: grid;
  place-items: center;
  font-size: 28px;
  position: relative;
}
.gen-count {
  position: absolute;
  right: -8px;
  bottom: -8px;
  background: var(--ink);
  color: var(--sun);
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 12px;
  padding: 1px 7px;
  min-width: 24px;
  text-align: center;
}
.gen-name { font-family: var(--font-display); font-size: 18px; line-height: 1.1; }
.gen-desc { font-size: 12px; color: var(--muted); margin-top: 1px; }
.gen-meta { font-family: var(--font-mono); font-size: 12px; margin-top: 3px; color: var(--ink-soft); overflow-wrap: anywhere; }
.gen-bar { margin-top: 6px; height: 8px; background: var(--paper-3); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.gen-bar-fill { height: 100%; width: 0; background: var(--mint); }
.gen-buy { min-width: 112px; text-align: center; }
.gen-buy small { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; margin-top: 2px; }

/* ---------- Upgrades ---------- */
.up-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.up-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  background: var(--paper-2);
  border: var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.07s ease;
  min-width: 0;
}
.up-card.afford { background: #fff; }
.up-card:hover.afford { transform: translateY(-2px); }
.up-card:active.afford { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.up-head { display: flex; align-items: center; gap: 8px; }
.up-icon { font-size: 22px; }
.up-name { font-family: var(--font-display); font-size: 16px; line-height: 1.1; }
.up-desc { font-size: 12.5px; color: var(--ink-soft); }
.up-cost { margin-top: auto; font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.up-tag { position: absolute; top: 8px; right: 8px; font-size: 10px; }
.owned-list { display: flex; flex-wrap: wrap; gap: 6px; }
.owned-chip { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12px; }

/* ---------- Pets ---------- */
.egg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.egg-card {
  background: var(--paper-2);
  border: var(--line);
  border-radius: 16px;
  padding: 12px;
  box-shadow: var(--shadow-sm);
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.egg-icon { font-size: 54px; line-height: 1; filter: drop-shadow(3px 3px 0 var(--ink)); }
.egg-name { font-family: var(--font-display); font-size: 18px; }
.egg-cost { font-family: var(--font-mono); font-size: 12px; }
.egg-odds { font-size: 11px; color: var(--muted); }
.egg-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.egg-card.shake .egg-icon { animation: shake 0.45s ease; }
@keyframes shake {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(-14deg) scale(1.1); }
  40% { transform: rotate(12deg) scale(1.1); }
  60% { transform: rotate(-8deg); }
  80% { transform: rotate(6deg); }
}

.slots { display: flex; gap: 8px; flex-wrap: wrap; }
.slot {
  width: 74px;
  height: 84px;
  border: 3px dashed var(--ink-soft);
  border-radius: 14px;
  display: grid;
  place-items: center;
  text-align: center;
  background: var(--paper-2);
  font-size: 11px;
  color: var(--muted);
}
.slot.filled { border-style: solid; border-color: var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
.slot.filled:hover { background: var(--paper-3); }

.pet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.pet {
  position: relative;
  background: #fff;
  border: 3px solid var(--r-common);
  border-radius: 14px;
  padding: 6px 4px 5px;
  text-align: center;
  cursor: pointer;
  appearance: none;
  box-shadow: 2px 2px 0 var(--ink);
  transition: transform 0.07s ease;
}
.pet:hover { transform: translateY(-2px); }
.pet.equipped { background: var(--sun); }
.pet-emoji { font-size: 30px; line-height: 1.1; }
.pet-name { font-size: 10.5px; line-height: 1.1; min-height: 23px; display: block; }
.pet-pow { font-family: var(--font-mono); font-size: 10px; font-weight: 500; display: block; }
.pet-lvl {
  position: absolute;
  top: -8px;
  left: -6px;
  background: var(--ink);
  color: var(--sun);
  font-family: var(--font-display);
  font-size: 11px;
  border-radius: 8px;
  padding: 0 6px;
}
.r-common { border-color: var(--r-common); }
.r-uncommon { border-color: var(--r-uncommon); }
.r-rare { border-color: var(--r-rare); }
.r-epic { border-color: var(--r-epic); }
.r-legendary { border-color: var(--r-legendary); box-shadow: 2px 2px 0 var(--ink), 0 0 12px rgba(255, 178, 30, 0.8); }
.r-mythic { border-color: var(--r-mythic); box-shadow: 2px 2px 0 var(--ink), 0 0 14px rgba(255, 79, 134, 0.85); }
.r-secret { border-color: var(--r-secret); box-shadow: 2px 2px 0 var(--ink), 0 0 16px rgba(23, 19, 59, 0.9); animation: secretGlow 2s ease-in-out infinite alternate; }
@keyframes secretGlow { from { background: #fff; } to { background: var(--paper-3); } }
.rt-common { color: var(--r-common); }
.rt-uncommon { color: var(--r-uncommon); }
.rt-rare { color: var(--r-rare); }
.rt-epic { color: var(--r-epic); }
.rt-legendary { color: #d98e00; }
.rt-mythic { color: var(--r-mythic); }
.rt-secret { color: var(--ink); }

.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.dex-item {
  border: 2px solid var(--ink);
  background: #fff;
  border-radius: 10px;
  text-align: center;
  padding: 4px 2px;
  font-size: 22px;
}
.dex-item.unknown { background: var(--paper-3); filter: grayscale(1) brightness(0.45); }

/* ---------- Prestige ---------- */
.pcard { display: flex; flex-direction: column; gap: 10px; }
.pcard-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pcard-title { font-family: var(--font-display); font-size: 24px; margin: 0; }
.pcard-desc { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.pcard-gain { font-family: var(--font-display); font-size: 28px; }
.pcard.locked { opacity: 0.65; }
.progress { height: 18px; background: var(--paper-3); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--sun); border-right: 2px solid var(--ink); }
.progress-text { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.shop-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  appearance: none;
  background: var(--paper-2);
  border: 3px solid var(--ink);
  border-radius: 14px;
  padding: 9px 12px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  min-width: 0;
}
.shop-item.afford { background: #fff; }
.shop-item.maxed { background: var(--mint); cursor: default; }
.shop-item:active.afford { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.shop-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.shop-name { font-family: var(--font-display); font-size: 16px; line-height: 1.1; }
.shop-lvl { font-family: var(--font-mono); font-size: 12px; font-weight: 500; white-space: nowrap; }
.shop-desc { font-size: 12.5px; color: var(--ink-soft); }
.shop-cost { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }

.tree { display: flex; flex-direction: column; gap: 14px; }
.branch-title { font-family: var(--font-display); font-size: 16px; margin: 0 0 6px; }
.branch-row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.node {
  position: relative;
  flex: 1 1 180px;
  max-width: 260px;
  appearance: none;
  text-align: left;
  background: var(--paper-2);
  border: 3px solid var(--ink);
  border-radius: 14px;
  padding: 8px 10px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}
.node::after {
  content: "";
  position: absolute;
  right: -11px;
  top: 50%;
  width: 11px;
  height: 4px;
  background: var(--ink);
  transform: translateY(-50%);
}
.node:last-child::after { display: none; }
.node.owned { background: var(--mint); cursor: default; }
.node.avail.afford { background: #fff; }
.node.locked { opacity: 0.55; cursor: not-allowed; }
.node-name { font-family: var(--font-display); font-size: 15px; line-height: 1.1; }
.node-desc { font-size: 12px; margin: 2px 0; color: var(--ink-soft); }
.node-cost { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }

/* ---------- Quests & achievements ---------- */
.quest-list { display: flex; flex-direction: column; gap: 10px; }
.quest {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 8px 12px;
  align-items: center;
  background: var(--paper-2);
  border: var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
}
.quest.done { background: var(--mint); }
.quest-title { font-family: var(--font-display); font-size: 17px; line-height: 1.15; }
.quest-reward { font-size: 12px; color: var(--ink-soft); }
.quest .progress { grid-column: 1 / -1; height: 14px; }

.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.ach {
  display: flex;
  gap: 8px;
  align-items: center;
  background: var(--paper-3);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 6px 8px;
  opacity: 0.6;
  min-width: 0;
}
.ach.got { background: var(--sun); opacity: 1; }
.ach-badge { font-size: 22px; flex: none; }
.ach-name { font-family: var(--font-display); font-size: 14px; line-height: 1.1; }
.ach-desc { font-size: 11px; color: var(--ink-soft); line-height: 1.2; }

/* ---------- Mini games ---------- */
.fun-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.wheel-wrap { position: relative; width: min(100%, 260px); margin: 6px auto; aspect-ratio: 1 / 1; }
.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 4px solid var(--ink);
  box-shadow: var(--shadow-sm);
  transition: transform 4.2s cubic-bezier(0.12, 0.7, 0.1, 1);
  position: relative;
  overflow: hidden;
}
.wheel-label {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 46%;
  transform-origin: 0 0;
  font-family: var(--font-display);
  font-size: 11px;
  text-align: right;
  color: var(--ink);
  padding-right: 6px;
  line-height: 1;
  pointer-events: none;
}
.wheel-hub {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 52px;
  height: 52px;
  margin: -26px 0 0 -26px;
  background: var(--ink);
  border: 3px solid var(--sun);
  border-radius: 50%;
}
.wheel-pointer {
  position: absolute;
  left: 50%;
  top: -10px;
  margin-left: -13px;
  width: 0;
  height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-top: 26px solid var(--danger);
  filter: drop-shadow(0 2px 0 var(--ink));
  z-index: 3;
}

.arena {
  position: relative;
  height: 280px;
  background: repeating-linear-gradient(45deg, var(--paper-2) 0 14px, var(--paper-3) 14px 28px);
  border: var(--line);
  border-radius: 14px;
  overflow: hidden;
  touch-action: manipulation;
}
.target {
  position: absolute;
  width: 54px;
  height: 54px;
  margin: -27px 0 0 -27px;
  border-radius: 50%;
  border: 3px solid var(--ink);
  background: var(--sun);
  font-size: 26px;
  display: grid;
  place-items: center;
  cursor: pointer;
  padding: 0;
  animation: pop 0.18s ease both;
}
.target.gold { background: var(--pink); }
.target.bomb { background: var(--ink); }
.arena-hud { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 17px; margin-bottom: 6px; }

.slot-machine { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
.reel {
  width: 76px;
  height: 90px;
  border: var(--line);
  border-radius: 14px;
  background: #fff;
  display: grid;
  place-items: center;
  font-size: 44px;
  box-shadow: var(--shadow-sm);
}
.reel.spin { animation: reelSpin 0.12s linear infinite; }
@keyframes reelSpin { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
.bet-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
.result-line { text-align: center; min-height: 22px; font-family: var(--font-display); font-size: 16px; }

/* ---------- Stats & settings ---------- */
.stats-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.stats-table td { padding: 5px 4px; border-bottom: 2px dashed var(--paper-3); vertical-align: top; }
.stats-table td:last-child { text-align: right; font-family: var(--font-mono); font-weight: 500; overflow-wrap: anywhere; }
.stats-scroll { overflow-x: auto; }

.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 0;
  border-bottom: 2px dashed var(--paper-3);
  flex-wrap: wrap;
}
.setting-row:last-child { border-bottom: 0; }
.setting-name { font-family: var(--font-display); font-size: 16px; }
.setting-desc { font-size: 12px; color: var(--muted); }
.switch {
  appearance: none;
  position: relative;
  width: 54px;
  height: 30px;
  border-radius: 999px;
  border: 3px solid var(--ink);
  background: var(--paper-3);
  cursor: pointer;
  transition: background 0.15s ease;
  flex: none;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--ink);
  transition: transform 0.15s ease;
}
.switch:checked { background: var(--mint); }
.switch:checked::after { transform: translateX(24px); }
.select, .input, .textarea {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 14px;
  border: 3px solid var(--ink);
  border-radius: 10px;
  background: #fff;
  color: var(--ink);
  padding: 5px 10px;
  max-width: 100%;
}
.textarea { width: 100%; min-height: 84px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; resize: vertical; }
.input-sm { width: 110px; }

/* ---------- Modal / toast / fx ---------- */
.modal-back {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(23, 19, 59, 0.72);
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px 16px;
  animation: fadeIn 0.15s ease both;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(100%, 480px);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--paper);
  border: var(--line);
  border-radius: 20px;
  box-shadow: 8px 8px 0 var(--ink);
  padding: 18px;
  animation: pop 0.2s ease both;
}
.modal h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0 0 8px; }
.modal p { margin: 0 0 10px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; margin-top: 14px; }
.modal ul { margin: 0 0 10px; padding-left: 20px; }

.toasts {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  right: max(12px, env(safe-area-inset-right, 0px));
  z-index: 90;
  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(320px, calc(100vw - 24px));
  pointer-events: none;
}
.toast {
  background: var(--paper);
  border: var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  padding: 8px 12px;
  font-size: 13.5px;
  animation: toastIn 0.25s ease both;
}
.toast b { font-family: var(--font-display); font-weight: 400; font-size: 15px; display: block; }
.toast.good { background: var(--mint); }
.toast.gold { background: var(--sun); }
.toast.bad { background: var(--danger); color: #fff; }
.toast.out { animation: toastOut 0.3s ease both; }
@keyframes toastIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateX(40px); opacity: 0; } }

.fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.float-num {
  position: absolute;
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--sun);
  -webkit-text-stroke: 1px var(--ink);
  paint-order: stroke fill;
  text-shadow: 2px 2px 0 var(--ink);
  white-space: nowrap;
  animation: floatUp 1.1s ease-out both;
}
.float-num.crit { font-size: 32px; color: var(--pink); }
.float-num.small { font-size: 16px; color: #fff; }
@keyframes floatUp {
  from { transform: translate(-50%, 0) scale(0.7); opacity: 1; }

}
.confetti {

  height: 14px;
  border: 2px solid var(--ink);

}
@keyframes confettiFall {

}

.golden {
  position: fixed;
  z-index: 60;
  width: 78px;
  height: 78px;
  margin: -39px 0 0 -39px;

  background: radial-gradient(circle at 35% 30%, #fff6b8, var(--sun) 55%, var(--sun-deep));

}

@keyframes goldenBob { from { transform: translateY(-6px) rotate(-6deg); } to { transform: translateY(6px) rotate(6deg); } }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .stage { position: static; }
  .finn-wrap { width: min(100%, 200px); }

}

}

@media (prefers-reduced-motion: reduce) {

/* ---------- Finn avatar blink + misc ---------- */

}
.panel > .panel-title:first-child { margin-top: 0; }

.shop-item:disabled { opacity: 0.5; cursor: not-allowed; }

.pet-grid .pet, .slots .slot { font-family: var(--font-body); color: var(--ink); }
.target.gold, .target.bomb { font-size: 24px; }
.hint-line { color: var(--muted); font-size: 12px; }

/* ---------- Divine rarity (code pet) ---------- */
.r-divine { border-color: #ff2fa0; background: linear-gradient(135deg, #fff3b0, #ffd0ec, #c9f4ff); box-shadow: 2px 2px 0 var(--ink), 0 0 18px rgba(255, 47, 160, 0.9); animation: divineGlow 1.4s ease-in-out infinite alternate; }
.pet.r-divine.equipped { background: linear-gradient(135deg, #fff3b0, #ffd0ec, #c9f4ff); }
.rt-divine { color: #e0148c; }
@keyframes divineGlow { from { box-shadow: 2px 2px 0 var(--ink), 0 0 10px rgba(255, 47, 160, 0.7); } to { box-shadow: 2px 2px 0 var(--ink), 0 0 26px rgba(255, 212, 59, 1); } }

/* ---------- Kumar eggs, missions, board ---------- */

.lb { display: flex; flex-direction: column; gap: 6px; }

}

.lb-rank { font-family: var(--font-display); font-size: 17px; text-align: center; }
.lb-name { font-family: var(--font-display); font-size: 16px; min-width: 0; overflow-wrap: anywhere; }

@media (max-width: 900px) {

}

}
/* ---------- Worlds tab ---------- */
.wl-list { display: grid; gap: 12px; margin-top: 10px; }
.wl-card { position: relative; display: flex; gap: 14px; align-items: center; padding: 14px; background: var(--paper); border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.wl-card.w2 { background: linear-gradient(135deg, #ffe9a8, #ffb3c7); }
.wl-card.soon { background: repeating-linear-gradient(45deg, #e6e2ff, #e6e2ff 12px, #d3ccff 12px, #d3ccff 24px); opacity: .85; }
.wl-ic { font-size: 46px; line-height: 1; }
.wl-body { flex: 1; min-width: 0; }
.wl-name { font-family: var(--font-display); font-size: 22px; }

/* ---------- World 2 full screen ---------- */
.ws { position: fixed; inset: 0; z-index: 70; display: none; background: radial-gradient(ellipse at 50% 25%, #5a46ff 0%, #2a1fb4 55%, #120c55 100%); overflow: hidden; }
.ws.open { display: block; animation: wsIn .4s cubic-bezier(.2, 1.2, .3, 1) both; }
@keyframes wsIn { from { opacity: 0; transform: scale(1.12); } to { opacity: 1; transform: none; } }
.ws-inner { display: flex; flex-direction: column; gap: 8px; height: 100%; max-width: 920px; margin: 0 auto; padding: 10px; box-sizing: border-box; }
.ws-top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ws-chip { font-family: var(--font-display); font-size: 17px; padding: 6px 14px; border: var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); cursor: pointer; box-shadow: 3px 3px 0 var(--ink); transition: transform .1s; }
.ws-chip:hover { transform: translateY(-2px); } .ws-chip:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
.ws-chip.on { background: var(--sun); cursor: default; }
.ws-chip.soon { background: repeating-linear-gradient(45deg, #d3ccff, #d3ccff 8px, #e6e2ff 8px, #e6e2ff 16px); }
.ws-chip.wiggle { animation: wsWiggle .45s; }
@keyframes wsWiggle { 0%, 100% { transform: none; } 20% { transform: translateX(-7px) rotate(-3deg); } 40% { transform: translateX(7px) rotate(3deg); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.ws-hud { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 12px; background: var(--paper); border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow-sm); }
.ws-hud.hurt { animation: wsWiggle .3s; }
.ws-pill-pop { animation: wsPillPop .25s; } @keyframes wsPillPop { 50% { transform: scale(1.3); background: #ffd43b; } }

/* health bars */
.ws-bar { position: relative; height: 24px; background: #2b2570; border: 3px solid var(--ink); border-radius: 999px; overflow: hidden; box-sizing: border-box; }
.ws-ghost, .ws-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; }
.ws-ghost { background: #fff3a0; transition: width .7s ease .3s; }
.ws-fill { background: linear-gradient(90deg, #ff5c7a, #ffd43b); transition: width .14s ease-out; }
.ws-fill.pl { background: linear-gradient(90deg, #17c28b, #7dffd0); }
.ws-fill::after { content: ""; position: absolute; left: 6px; right: 6px; top: 3px; height: 4px; border-radius: 4px; background: rgba(255, 255, 255, .55); }
.ws-bar.intro .ws-fill { transition: width .7s cubic-bezier(.2, .9, .3, 1); }
.ws-bar.intro .ws-ghost { opacity: 0; transition: none; }
.ws-bar.flash { animation: wsBarFlash .12s steps(1) 4, wsBarShake .5s; }
@keyframes wsBarFlash { 50% { filter: brightness(3) saturate(0); } }
@keyframes wsBarShake { 0%, 100% { transform: none; } 20% { transform: translate(-4px, 2px) scaleY(1.2); } 40% { transform: translate(4px, -2px) scaleY(1.3); } 60% { transform: translate(-3px, 1px) scaleY(1.15); } 80% { transform: translate(3px, 0); } }
.ws-shard { position: absolute; box-sizing: border-box; border: 2px solid var(--ink); border-radius: 4px; pointer-events: none; will-change: transform; }

/* arena */
.ws-arena { position: relative; flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; border: var(--line); border-radius: var(--radius); box-shadow: var(--shadow); background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.18) 0 2px, transparent 3px) 0 0/90px 90px, radial-gradient(circle at 70% 60%, rgba(255,255,255,.12) 0 2px, transparent 3px) 0 0/70px 70px, linear-gradient(180deg, hsl(var(--h) 60% 30%), hsl(var(--h) 55% 12%)); }
.ws-arena::after { content: ""; position: absolute; left: -10%; right: -10%; bottom: -30%; height: 55%; border-radius: 50%; background: radial-gradient(ellipse at 50% 20%, hsl(var(--h) 45% 38%), hsl(var(--h) 45% 16%)); z-index: 0; }
.ws-arena.boss { box-shadow: var(--shadow), inset 0 0 70px rgba(255, 60, 90, .55); animation: wsBossPulse 1.6s ease-in-out infinite; }
@keyframes wsBossPulse { 50% { box-shadow: var(--shadow), inset 0 0 110px rgba(255, 60, 90, .85); } }
.ws-arena.shake { animation: wsShake .22s; } .ws-arena.shake2 { animation: wsShake2 .4s; }
@keyframes wsShake { 0%, 100% { transform: none; } 25% { transform: translate(-5px, 3px); } 50% { transform: translate(5px, -3px); } 75% { transform: translate(-3px, -2px); } }
@keyframes wsShake2 { 0%, 100% { transform: none; } 10% { transform: translate(-14px, 8px) rotate(-.6deg); } 30% { transform: translate(14px, -8px) rotate(.6deg); } 50% { transform: translate(-10px, -6px); } 70% { transform: translate(8px, 6px); } 90% { transform: translate(-4px, 2px); } }
.ws-stage { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; transition: opacity .25s, transform .5s cubic-bezier(.2, 1.5, .4, 1); }
.ws-arena.waiting .ws-stage { opacity: 0; transform: scale(.4) translateY(40px); transition: none; }
.ws-mon-name { font-family: var(--font-display); font-size: clamp(20px, 4vmin, 28px); color: #fff; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); }
.ws-monbar { width: min(440px, 86%); height: 28px; }
.ws-num { color: #fff !important; text-shadow: 0 2px 0 var(--ink); }
.ws-mon { position: relative; width: clamp(150px, 34vmin, 270px); height: clamp(150px, 34vmin, 270px); background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none; }
.ws-mon-ic { display: block; font-size: clamp(90px, 23vmin, 180px); line-height: 1; filter: drop-shadow(0 10px 0 rgba(0, 0, 0, .35)); animation: wsBob 1.4s ease-in-out infinite; pointer-events: none; }
.ws-arena.boss .ws-mon { width: clamp(180px, 42vmin, 330px); height: clamp(180px, 42vmin, 330px); } .ws-arena.boss .ws-mon-ic { font-size: clamp(110px, 29vmin, 220px); }
.ws-arena.boss .ws-mon::before { content: ""; position: absolute; inset: 8%; border-radius: 50%; background: radial-gradient(circle, rgba(255, 70, 100, .65), transparent 70%); animation: wsAura 1s ease-in-out infinite; }
@keyframes wsAura { 50% { transform: scale(1.25); opacity: .6; } }
@keyframes wsBob { 0%, 100% { transform: translateY(0) scale(1, 1); } 50% { transform: translateY(-8px) scale(1.03, .97); } }
.ws-mon.hit { animation: wsHit .22s ease-out; } .ws-mon.hitc { animation: wsHitC .34s ease-out; } .ws-mon.lunge { animation: wsLunge .3s ease-out; }
@keyframes wsHit { 0% { transform: scale(1.18, .8) rotate(var(--rot, -6deg)); filter: brightness(2.4) saturate(0); } 40% { transform: scale(.9, 1.1) rotate(calc(var(--rot, -6deg) * -.6)); } 100% { transform: none; filter: none; } }
@keyframes wsHitC { 0% { transform: scale(1.35, .65) rotate(var(--rot, -8deg)) translateX(var(--kb, 20px)); filter: brightness(3) saturate(0) drop-shadow(0 0 20px #ffd43b); } 35% { transform: scale(.82, 1.2) rotate(calc(var(--rot, -8deg) * -.8)); } 70% { transform: scale(1.08, .95); } 100% { transform: none; filter: none; } }
@keyframes wsLunge { 0% { transform: none; } 35% { transform: translateY(46px) scale(1.25); } 100% { transform: none; } }
.ws-log { min-height: 18px; font-size: 13px; font-weight: 800; color: #fff; text-shadow: 0 2px 0 var(--ink); text-align: center; padding: 0 10px; }
.ws-combo { position: absolute; z-index: 3; right: 14px; top: 12px; font-family: var(--font-display); font-size: 34px; color: #ffd43b; -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); opacity: 0; transform-origin: right center; pointer-events: none; text-align: right; line-height: 1; }
.ws-combo small { display: block; font-size: 15px; color: #fff; }
.ws-combo.on { opacity: 1; } .ws-combo.pop { animation: wsComboPop .15s; } @keyframes wsComboPop { 50% { transform: scale(1.35) rotate(-4deg); } }
.ws-banner { position: absolute; z-index: 4; left: 0; right: 0; top: 38%; text-align: center; font-family: var(--font-display); font-size: clamp(36px, 9vmin, 72px); color: #fff; background: rgba(255, 40, 80, .88); -webkit-text-stroke: 2px var(--ink); paint-order: stroke fill; letter-spacing: 3px; padding: 6px 0; transform: translateX(-110%); pointer-events: none; }
.ws-banner.go { animation: wsBanner 1.1s ease-out both; }
@keyframes wsBanner { 0% { transform: translateX(-110%) skewX(-12deg); } 25%, 70% { transform: translateX(0) skewX(-12deg); } 100% { transform: translateX(110%) skewX(-12deg); } }
.ws-flash, .ws-vig { position: absolute; inset: 0; pointer-events: none; z-index: 8; opacity: 0; }
.ws-flash { background: #fff; } .ws-vig { box-shadow: inset 0 0 120px 30px rgba(255, 30, 60, .85); }

/* bottom controls */

.ws-atk { font-family: var(--font-display); font-size: clamp(24px, 5vmin, 34px); padding: 10px 34px; min-width: min(300px, 60vw); color: #fff; background: linear-gradient(180deg, #ff7aa8, #ff3d7f); border: var(--line); border-radius: 18px; box-shadow: 0 6px 0 var(--ink); cursor: pointer; -webkit-text-stroke: 1px var(--ink); paint-order: stroke fill; text-shadow: 0 3px 0 var(--ink); touch-action: manipulation; animation: wsAtkPulse 1.2s ease-in-out infinite; user-select: none; }
.ws-atk:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--ink); animation: none; }
@keyframes wsAtkPulse { 50% { transform: scale(1.04); } }
.ws-bottom .bt-dots { width: 100%; }

/* effects */

.ws-dmg { position: absolute; font-family: var(--font-display); color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 4px 0 var(--ink); white-space: nowrap; text-align: center; line-height: 1; will-change: transform, opacity; }

.ws-dmg.c { font-size: 62px; color: #ffd43b; text-shadow: 0 4px 0 #c2410c, 0 0 24px rgba(255, 160, 0, .9); } .ws-dmg.c small { display: block; font-size: 22px; color: #ff9a3c; letter-spacing: 2px; }
.ws-dmg.coin { font-size: 40px; color: #ffd43b; } .ws-dmg.big { font-size: clamp(44px, 10vmin, 80px); color: #ff5c7a; }

@media (max-width: 560px) { .ws-chip { font-size: 15px; padding: 5px 10px; } .ws-dmg.n { font-size: 30px; } .ws-dmg.c { font-size: 50px; } }

.ws-player { position: absolute; z-index: 2; left: 10px; bottom: 10px; width: clamp(120px, 21vmin, 190px); display: flex; flex-direction: column; align-items: center; gap: 3px; }

.ws-player.hurt .ws-pl-egg { animation: wsWiggle .3s; filter: drop-shadow(0 6px 0 rgba(0,0,0,.3)) brightness(1.6) hue-rotate(-30deg); }
.ws-pl-name { font-family: var(--font-display); font-size: 13px; color: #fff; text-shadow: 0 2px 0 var(--ink); }

.ws-panelhost { position: absolute; inset: 0; z-index: 30; display: none; }
.ws-panelhost.on { display: block; }

@keyframes wpFade { from { opacity: 0; } }
.wp-card { width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--paper); border: var(--line); border-radius: 20px; box-shadow: 6px 6px 0 var(--ink); padding: 12px; box-sizing: border-box; animation: wpPop .28s cubic-bezier(.2, 1.4, .4, 1); }

.wp-body { overflow-y: auto; flex: 1; min-height: 0; padding-right: 4px; }
.up-list { display: grid; gap: 8px; }
.up-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: #fff; border: 2px solid var(--ink); border-radius: 14px; }

.up-row.maxed { background: #fff6c8; }
