function mtQuip(n) {
  const lines = {
    prod: ["The numbers are doing cartwheels.", "More output. Fewer excuses.", "Your machines have discovered espresso.", "The factory is now legally a rocket.", "Somewhere, a calculator is sweating."],
    click: ["Finger gym: absolutely shredded.", "The mouse has entered its villain era.", "Tap like the rent is due.", "Your fingertips have main-character energy.", "Warning: nearby screens may feel this."],
    luck: ["The universe owes you one.", "Fortune is now your unpaid intern.", "The odds just blinked first.", "Suspiciously lucky. We love that.", "A four-leaf clover filed your paperwork."],
    pets: ["Your pets demand a tiny medal.", "More treats. Bigger chaos.", "The cuddle economy is booming.", "A fluffy committee approved this.", "Your egg budget says thank you."],
    eco: ["Frugality, but make it legendary.", "The spreadsheet is doing a happy dance.", "Time is money. You just bought both.", "A bargain so good it feels illegal.", "Your wallet just unclenched."],
    prestige: ["A fresh start with extra sparkle.", "The reset button fears you.", "Your legacy just got a glow-up.", "The universe stamped this APPROVED.", "Royalty called. They want your notes."],
    mega: ["Cosmic nonsense, premium edition.", "The stars are clapping politely.", "Reality has filed a support ticket.", "You are now overqualified for space.", "A tiny nova just fist-bumped you."],
    evo: ["Evolution said: 'watch this'.", "New form, same excellent vibes.", "Your DNA has patch notes.", "Nature is speed-running.", "The glow-up is scientifically loud."]
  };
  const pool = lines[n.branch] || lines.mega;
  const index = (n.i * 3 + n.lane * 2 + (n.kind === "key" ? 1 : 0)) % pool.length;
  if (n.kind === "key") return "ULTIMATE MOVE: " + pool[(index + 2) % pool.length];
  if (n.kind === "major") return "BIG UPGRADE ENERGY — " + pool[(index + 1) % pool.length];
  return pool[index];
}

/* Every upgrade scales in growing steps: level 1 = pct, level 2 = 4x pct, level 3 = 10x pct, level 4 = 20x pct ...
   (20% -> 80% -> 200% -> 400% -> 700% -> 1120% ...).  value(L) = pct * L(L+1)(L+2)/6 */

const BT_SUPS = [

/* each coin upgrade finishes around a target stage: its last level costs ~30 kills worth of coins there */
const BT_UP_END = { atk: 45, hp: 45, coin: 40, aspd: 35, crit: 30, critd: 35, drop: 30, rarity: 40, jackpot: 35, wprod: 50, wclick: 50, wevo: 45 };
BT_UPS.forEach(u => { u.grow = Math.pow(20 * Math.pow(10, BT_UP_END[u.id] - 1) * 30 / u.base, 1 / u.max); });
const BT_UP_BY_ID = {}; BT_UPS.forEach(u => { BT_UP_BY_ID[u.id] = u; });
const BT_SUP_BY_ID = {}; BT_SUPS.forEach(u => { BT_SUP_BY_ID[u.id] = u; });

function btUpLv(id) { return (S.bt2 && S.bt2.ups[id]) | 0; }
function btSupLv(id) { return (S.bt2 && S.bt2.sups[id]) | 0; }
function btUpFx(id) { const d = BT_UP_BY_ID[id]; return d ? d.pct / 100 * btTet(btUpLv(id)) : 0; }
function btSupFx(id) { const d = BT_SUP_BY_ID[id]; return d ? d.pct / 100 * btTet(btSupLv(id)) : 0; }
function btUpCost(def, lv) { return def.base * Math.pow(def.grow, lv); }
function btSupCost(def, lv) { return Math.ceil(def.base * Math.pow(def.grow, lv)); }

/* ---------- player stats ---------- */
function btSoulMult() { return 1 + 0.01 * (S.bt2 ? S.bt2.soulsTotal : 0); }
function btTrainLv(k) { return S.battle[k]; }
function btEqSum(key) {
  let s = 0; const eq = S.bt2.eq;
  for (let i = 0; i < eq.length; i++) { if (!eq[i]) continue; const it = btItem(eq[i]); if (it) s += it[key]; }
  return s;
}
function btKumar() { return Math.sqrt(btMult()); }
function btTier() { return S.bt2 ? Math.min(S.bt2.rebirths, 60) : 0; }
function btDiff() { return Math.pow(BT_TIER_STEP, btTier()); }   /* every Rebirth: monsters get tougher */
function btDmg() { return 6 * Math.pow(BT_TRAIN_D, btTrainLv('tD')) * btKumar() * (1 + btEqSum('a')) * (1 + btUpFx('atk')) * (1 + btSupFx('sdmg')) * btSoulMult(); }
function btHp()  { return 50 * Math.pow(BT_TRAIN_D, btTrainLv('tH')) * btKumar() * (1 + btEqSum('h')) * (1 + btUpFx('hp')) * (1 + btSupFx('shp')) * btSoulMult(); }
function btCost(l) { return 15 * Math.pow(BT_TRAIN_R, l); }
const BT_TIER_STEP = 4;
function btCoinMult() { return (1 + btUpFx('coin')) * (1 + btSupFx('scoin')) * (1 + 0.01 * S.bt2.soulsTotal); }
function btCritChance() { return Math.min(0.9, 0.15 + btUpFx('crit')); }
function btCritMult() { return 2.5 + btUpFx('critd'); }
function btAtkInterval() { return 1 / (1 + btUpFx('aspd')); }
function btDropChance() { return Math.min(0.9, 0.10 + btUpFx('drop') + btSupFx('sdrop')); }
function btLuckF() { return 1 + btUpFx('rarity') + btSupFx('sluck'); }
function btRarProbs() {
  const F = btLuckF(), w = BT_RAR.map((r, i) => r.w * Math.pow(F, i)), s = w.reduce((a, b) => a + b, 0);
  return w.map(x => x / s);
}
/* boosts for World 1 */
function btWorldProd() { if (!S.bt2) return 1; return (1 + btUpFx('wprod')) * (1 + btSupFx('swprod')) * (1 + 0.05 * S.bt2.soulsTotal); }
function btWorldClick() { if (!S.bt2) return 1; return (1 + btUpFx('wclick')) * (1 + btSupFx('swclick')) * (1 + 0.05 * S.bt2.soulsTotal); }
function btWorldEvo() { if (!S.bt2) return 1; return 1 + btUpFx('wevo') + btSupFx('swevo'); }

/* ---------- monsters: every stage has 10x the health of the one before ---------- */
function btMon(st) {
  const boss = st % 10 === 0;
  return { icon: BT_ICONS[st - 1], name: BT_NAMES[st - 1], boss: boss,
    hp: 40 * Math.pow(10, st - 1) * (boss ? 5 : 1) * btDiff(),
    atk: 3 * Math.pow(6, st - 1) * (boss ? 1.6 : 1) * btDiff(),
    coins: 20 * Math.pow(10, st - 1) * (boss ? 4 : 1) * Math.sqrt(btDiff()), speed: boss ? 1.2 : 1.4 };
}

/* ---------- equipment ---------- */
function btItem(id) { const a = S.bt2.items; for (let i = 0; i < a.length; i++) if (a[i].id === id) return a[i]; return null; }
function btIsEq(id) { return S.bt2.eq.indexOf(id) >= 0; }
function btBagCount() { return S.bt2.items.length - S.bt2.eq.filter(x => x).length; }
function btScore(it) { return it.a + it.h; }
function btMakeItem(rar, st) {
  const sl = randInt(0, BT_SLOTS.length - 1), sd = BT_SLOTS[sl];
  const base = BT_ITEM_BASE * BT_RAR[rar].mult * Math.pow(BT_ITEM_G, st - 1);
  return { id: S.bt2.uid++, slot: sl, rar: rar, st: st, a: base * sd.a * rand(0.9, 1.1), h: base * sd.h * rand(0.9, 1.1),
    n: BT_RAR[rar].pre + ' ' + sd.nouns[randInt(0, sd.nouns.length - 1)] };
}
function btAddItem(it) {
  const B2 = S.bt2;
  if (btBagCount() < BT_BAG) { B2.items.push(it); if (!B2.eq[it.slot]) B2.eq[it.slot] = it.id; return 'added'; }
  let worst = null;
  B2.items.forEach(x => { if (!btIsEq(x.id) && (!worst || btScore(x) < btScore(worst))) worst = x; });
  if (worst && btScore(it) > btScore(worst)) { B2.items.splice(B2.items.indexOf(worst), 1); B2.items.push(it); return 'replaced'; }
  return 'lost';
}
function btRollDrop(stage) {
  if (Math.random() >= btDropChance()) return null;
  const p = btRarProbs(); let r = Math.random(), i = 0;
  for (; i < p.length - 1; i++) { if (r < p[i]) break; r -= p[i]; }
  return btMakeItem(i, stage);
}
function btEquip(id) { const it = btItem(id); if (!it || btIsEq(id)) return false; S.bt2.eq[it.slot] = id; return true; }
function btUnequip(id) {
  const i = S.bt2.eq.indexOf(id); if (i < 0) return false;
  if (btBagCount() >= BT_BAG) return false;
  S.bt2.eq[i] = 0; return true;
}
function btEquipBest() {
  let n = 0;
  for (let s = 0; s < BT_SLOTS.length; s++) {
    let best = null;
    S.bt2.items.forEach(it => { if (it.slot === s && (!best || btScore(it) > btScore(best))) best = it; });
    if (best && S.bt2.eq[s] !== best.id) { S.bt2.eq[s] = best.id; n++; }
  }
  return n;
}
function btDeleteUnequipped(maxRar) {   /* maxRar null = every unequipped item, 0 = only whites */
  const before = S.bt2.items.length;
  S.bt2.items = S.bt2.items.filter(it => btIsEq(it.id) || (maxRar != null && it.rar > maxRar));
  return before - S.bt2.items.length;
}
function btDeleteItem(id) {
  if (btIsEq(id)) return false;
  const i = S.bt2.items.findIndex(x => x.id === id); if (i < 0) return false;
  S.bt2.items.splice(i, 1); return true;
}

/* ---------- upgrades ---------- */
function btBuyUp(id, soul) {
  const def = soul ? BT_SUP_BY_ID[id] : BT_UP_BY_ID[id]; if (!def) return false;
  const lv = soul ? btSupLv(id) : btUpLv(id); if (lv >= def.max) return false;
  if (soul) { const c = btSupCost(def, lv); if (S.bt2.souls < c) return false; S.bt2.souls -= c; S.bt2.sups[id] = lv + 1; }
  else { const c = btUpCost(def, lv); if (S.battle.coins < c) return false; S.battle.coins -= c; S.bt2.ups[id] = lv + 1; }
  recalc();
  return true;
}
function btBuyMax(list, soul) {
  let n = 0, guard = 0;
  while (guard++ < 2000) {
    let best = null, bc = Infinity;
    list.forEach(def => {
      const lv = soul ? btSupLv(def.id) : btUpLv(def.id); if (lv >= def.max) return;
      const c = soul ? btSupCost(def, lv) : btUpCost(def, lv);
      if (c <= (soul ? S.bt2.souls : S.battle.coins) && c < bc) { bc = c; best = def; }
    });
    if (!best || !btBuyUp(best.id, soul)) break;
    n++;
  }
  return n;
}
function btAffordCount() {
  let n = 0;
  BT_UPS.forEach(d => { const l = btUpLv(d.id); if (l < d.max && S.battle.coins >= btUpCost(d, l)) n++; });
  BT_SUPS.forEach(d => { const l = btSupLv(d.id); if (l < d.max && S.bt2.souls >= btSupCost(d, l)) n++; });
  return n;
}

/* ---------- rebirth ---------- */
function btSoulGain() {
  const b = S.battle.rb;
  if (b < BT_REBIRTH_MIN) return 0;
  return Math.floor(2 * Math.pow(b - BT_REBIRTH_MIN + 1, 1.5) * (1 + 0.25 * S.bt2.rebirths));
}
function btGearSouls() { let n = 0; S.bt2.items.forEach(it => { n += [1, 2, 5, 15, 40][it.rar]; }); return n; }
function btRebirth() {
  const g = btSoulGain(); if (g < 1) return 0;
  const B = S.battle, B2 = S.bt2;
  const extra = btGearSouls();   /* all gear is melted into souls */
  B2.items = []; B2.eq = [0, 0, 0, 0, 0, 0];
  B2.souls += g + extra; B2.soulsTotal += g + extra; B2.rebirths++;
  B.rb = 0; B.sk = 0; B.cur = 1; B.coins = 0; B.tD = 0; B.tH = 0;
  BT_UPS.forEach(d => { if (d.tab === 'battle') delete B2.ups[d.id]; });
  T.bt = null; btEnsure();
  recalc();
  ui.dirty = true; ui.btDirty = true;
  return g + extra;
}

  drop: () => (btDropChance() * 100).toFixed(1) + '%', luck: () => 'x' + btLuckF().toFixed(2),

};

function wsPatch() {
  if (!WS.open) return;
  const sig = S.battle.cur + '|' + S.battle.rb + '|' + S.kumar + '|' + (S.battle.cleared ? 1 : 0) + '|' + S.skin;
  if (sig !== WS.sig || ui.btDirty) { WS.sig = sig; ui.btDirty = false; wsRender(); }
  patchLive(WS.inner);
  WS.inner.querySelectorAll('[data-wlive]').forEach(el => { const t = WS_LIVE[el.getAttribute('data-wlive')](); if (el.textContent !== t) el.textContent = t; });
  const arena = $('wsArena'), bar = $('wsMonBar');
  if (!arena || !bar) return;
  const waiting = (T.btWait || 0) > 0;
  arena.classList.toggle('waiting', waiting);
  if (waiting) {
    bar.dataset.hold = '1';
    bar.querySelectorAll('.ws-fill,.ws-ghost').forEach(e => { e.style.width = '0%'; });
  } else if (bar.dataset.hold) {
    delete bar.dataset.hold;
    bar.classList.add('intro');
    patchLive(WS.inner);
    setTimeout(() => bar.classList.remove('intro'), 800);
    const bn = $('wsBanner'); if (bn) bn.classList.add('go');
  } else if (bar.classList.contains('intro')) {
    patchLive(WS.inner);
  }
  const c = $('wsCombo');
  if (c) c.classList.toggle('on', (T.btCombo || 0) >= 2 && performance.now() - (T.btComboAt || 0) < 1300);
  const ub = $('wsUpBadge'), n = btAffordCount(); if (ub) ub.textContent = n > 0 ? n : '';
  if (ub) ub.style.display = n > 0 ? '' : 'none';
  const rb = $('wsRbBadge'), g = btSoulGain(); if (rb) { rb.textContent = g > 0 ? '+' + fmt(g) : ''; rb.style.display = g > 0 ? '' : 'none'; }
  wsPanelPatch();
}

/* ---------- panels: Upgrades / Equipment / Rebirth ---------- */
function wsPanelOpen(name) { WP.open = name; WP.sel = 0; wsPanelRender(); sfx.buy(); }
function wsPanelClose() { if (!WP.open) return; WP.open = null; wsPanelRender(); }
function wpHead(title) { return '<div class="wp-head"><div class="wp-title">' + title + '</div><button class="btn btn-sm btn-danger wp-close" type="button" data-wact="panelx">\u2715</button></div>'; }
function wsPanelSig() {
  if (WP.open === 'eq') return 'eq|' + S.bt2.items.length + '|' + S.bt2.eq.join(',') + '|' + WP.sel + '|' + btDropChance().toFixed(3) + '|' + btLuckF().toFixed(3);
  if (WP.open === 'rb') return 'rb|' + btSoulGain() + '|' + S.battle.rb + '|' + S.bt2.soulsTotal;
  return WP.open;
}
function wsPanelRender() {
  const host = $('wsPanelHost'); if (!host) return;
  if (!WP.open) { host.innerHTML = ''; host.classList.remove('on'); return; }
  const old = host.querySelector('.wp-body'), st = old ? old.scrollTop : 0;
  const body = WP.open === 'up' ? wpUp() : WP.open === 'eq' ? wpEq() : wpRb();
  host.innerHTML = '<div class="wp-back" data-wact="panelx"><div class="wp-card">' + body + '</div></div>';
  host.classList.add('on');
  const nb = host.querySelector('.wp-body'); if (nb) nb.scrollTop = st;
  WP.sig = wsPanelSig();
}
function wsPanelPatch() {
  if (!WP.open) return;
  if (WP.open !== 'up') { if (wsPanelSig() !== WP.sig) wsPanelRender(); return; }
  const host = $('wsPanelHost'), soul = WP.upTab === 'soul';
  const cur = soul ? S.bt2.souls : S.battle.coins;
  const cn = host.querySelector('[data-pcur]'); if (cn) cn.textContent = fmt(cur);
  host.querySelectorAll('[data-up]').forEach(r => {
    const c = parseFloat(r.getAttribute('data-cost')), ok = c <= cur && r.getAttribute('data-max') !== '1';
    r.classList.toggle('afford', ok);
    const b = r.querySelector('button'); if (b) b.disabled = !ok;
  });
}

function wpUp() {
  const t = WP.upTab, soul = t === 'soul';

  let h = wpHead('\u2b06 Upgrades') + '<div class="wp-tabs">';
  tabs.forEach(x => { h += '<button class="wp-tab' + (t === x[0] ? ' on' : '') + '" type="button" data-wact="uptab" data-t="' + x[0] + '">' + x[1] + '</button>'; });
  h += '</div><div class="wp-cur">' + (soul ? '\u2728 <b data-pcur="1">' + fmt(S.bt2.souls) + '</b> souls' : '\ud83e\ude99 <b data-pcur="1">' + fmt(S.battle.coins) + '</b> coins')
    + '<span class="wp-note">' + (t === 'battle' ? 'Battle upgrades reset on Rebirth.' : t === 'soul' ? 'Soul upgrades are permanent.' : 'These stay after Rebirth.') + '</span>'
    + '<button class="btn btn-sm btn-mint" type="button" data-wact="buymax">Buy max</button></div>';
  const list = soul ? BT_SUPS : BT_UPS.filter(u => u.tab === t);
  h += '<div class="wp-body"><div class="up-list">';
  list.forEach(d => {
    const lv = soul ? btSupLv(d.id) : btUpLv(d.id), mx = lv >= d.max;
    const cost = mx ? 0 : soul ? btSupCost(d, lv) : btUpCost(d, lv), cur = soul ? S.bt2.souls : S.battle.coins;
    h += '<div class="up-row' + (mx ? ' maxed' : '') + (!mx && cost <= cur ? ' afford' : '') + '" data-up="' + d.id + '" data-cost="' + cost + '" data-max="' + (mx ? 1 : 0) + '">'
      + '<div class="up-ic">' + d.ic + '</div><div class="up-main"><div class="up-name">' + d.name + ' <span class="up-lv">Lv ' + lv + ' / ' + d.max + '</span></div>'
      + '<div class="up-desc">' + esc(d.fx(lv)) + (mx ? '' : ' <span class="up-next">\u2192 ' + esc(d.fx(lv + 1)) + '</span>') + '</div>'
       + '<div class="up-quip">' + esc(btUpgradeQuip(d, soul)) + '</div>'
      + '<div class="up-bar"><div style="width:' + (lv / d.max * 100).toFixed(1) + '%"></div></div></div>'
      + '<button class="btn btn-sun up-buy" type="button" data-wact="buyup" data-id="' + d.id + '"' + (soul ? ' data-soul="1"' : '') + (mx || cost > cur ? ' disabled' : '') + '>' + (mx ? 'MAX' : (soul ? '\u2728 ' : '\ud83e\ude99 ') + fmt(cost)) + '</button></div>';
  });
  return h + '</div></div>';
}

  h += '<div class="wp-body"><div class="eq-sub">Equipped</div><div class="eq-slots">';
  BT_SLOTS.forEach((sl, i) => {
    const it = B2.eq[i] ? btItem(B2.eq[i]) : null;
    h += '<div class="eq-slot">' + (it ? wpItemHtml(it, WP.sel === it.id ? ' sel' : '') : '<div class="eq-cell empty">' + sl.ic + '</div>') + '<div class="eq-slot-name">' + sl.name + '</div></div>';
  });
  h += '</div>';

  const sel = WP.sel ? btItem(WP.sel) : null;
  if (sel) {
    const r = BT_RAR[sel.rar], isEq = btIsEq(sel.id), cmp = !isEq && B2.eq[sel.slot] ? btItem(B2.eq[sel.slot]) : null;

      + '<div class="eq-d-stats"><span>\u2694 +' + fmt(sel.a * 100) + '% attack</span><span>\u2764 +' + fmt(sel.h * 100) + '% health</span>'
      + (cmp ? '<span class="' + (d >= 0 ? 'up' : 'down') + '">' + (d >= 0 ? '\u25b2 better' : '\u25bc worse') + ' than equipped</span>' : '') + '</div>'
      + '<div class="eq-d-btns">' + (isEq ? '<button class="btn btn-sm" type="button" data-wact="equnequip" data-id="' + sel.id + '">Unequip</button>'
        : '<button class="btn btn-sm btn-mint" type="button" data-wact="eqequip" data-id="' + sel.id + '">Equip</button><button class="btn btn-sm btn-danger" type="button" data-wact="eqdel" data-id="' + sel.id + '">Delete</button>') + '</div></div>';
  } else h += '<div class="eq-detail empty">Tap an item to see its stats.</div>';
  h += '<div class="eq-sub">Bag</div><div class="eq-tools"><button class="btn btn-sm btn-mint" type="button" data-wact="eqbest">\u2b50 Equip best</button>'
    + '<button class="btn btn-sm" type="button" data-wact="eqdelwhite">Delete whites</button>'
    + '<button class="btn btn-sm btn-danger" type="button" data-wact="eqdelall">\ud83d\uddd1 Delete unequipped</button></div><div class="eq-grid">';
  const bag = B2.items.filter(it => !btIsEq(it.id)).sort((a, b) => b.rar - a.rar || btScore(b) - btScore(a));
  for (let i = 0; i < BT_BAG; i++) h += bag[i] ? wpItemHtml(bag[i], WP.sel === bag[i].id ? ' sel' : '') : '<div class="eq-cell empty"></div>';
  h += '</div>';
  const p = btRarProbs(), dc = btDropChance();

  return h + '</div><div class="wp-note">Drop chance ' + (dc * 100).toFixed(1) + '% per kill. Gear dropped at higher stages is much stronger. A full bag replaces your worst item if the new one is better.</div></div>';

/* a dropped item pops out of the monster and flies to the Equipment button */
function wsDrop(it, res, cx, cy) {
  if (!WS.open) return;
  const L = WS.fxl, r = BT_RAR[it.rar], sl = BT_SLOTS[it.slot];
  const big = it.rar >= 2;
  const card = document.createElement('div');
  card.className = 'ws-itemfly rar-' + it.rar;
  card.innerHTML = sl.ic;
  card.style.left = cx + 'px'; card.style.top = cy + 'px';
  L.appendChild(card);
  const tgt = $('wsEqBtn'), rt = tgt ? wsRect(tgt) : { x: cx, y: cy + 300, w: 0, h: 0 };
  const tx = rt.x + rt.w / 2 - cx, ty = rt.y + rt.h / 2 - cy;
  card.animate([
    { transform: 'translate(-50%,-50%) scale(.2) rotate(-30deg)', opacity: 0 },
    { transform: 'translate(-50%,-50%) translate(0,-60px) scale(' + (big ? 1.9 : 1.4) + ') rotate(0deg)', opacity: 1, offset: 0.25 },
    { transform: 'translate(-50%,-50%) translate(0,-60px) scale(' + (big ? 1.9 : 1.4) + ') rotate(0deg)', opacity: 1, offset: 0.6 },
    { transform: 'translate(-50%,-50%) translate(' + tx + 'px,' + ty + 'px) scale(.4) rotate(360deg)', opacity: 1 }
  ], { duration: big ? 1500 : 1100, easing: 'cubic-bezier(.3,.7,.3,1)', fill: 'forwards' }).onfinish = () => { card.remove(); wsPulse('wsEqBtn'); };
  const lbl = document.createElement('div');
  lbl.className = 'ws-dmg item'; lbl.style.color = r.col === '#2a2540' ? '#fff' : r.col;
  lbl.innerHTML = '<small>' + r.name.toUpperCase() + ' DROP!</small>' + esc(it.n);
  lbl.style.left = cx + 'px'; lbl.style.top = (cy - 120) + 'px';
  L.appendChild(lbl);
  lbl.animate([{ transform: 'translate(-50%,-50%) scale(.2)', opacity: 0 }, { transform: 'translate(-50%,-50%) scale(1.2)', opacity: 1, offset: 0.2 },
    { transform: 'translate(-50%,-70%) scale(1)', opacity: 1, offset: 0.8 }, { transform: 'translate(-50%,-110%) scale(.9)', opacity: 0 }],
    { duration: big ? 1900 : 1400, fill: 'forwards' }).onfinish = () => lbl.remove();
  if (big) {
    wsRing(cx, cy - 60, r.col, 220, 800);
    wsBits(cx, cy - 60, it.rar >= 3 ? 34 : 20, { colors: [r.col, '#fff', '#ffd43b'], dist: 260, grav: 140, min: 6, max: 13, round: false, t0: 700, t1: 1200 });
    wsFlash('wsFlash', it.rar >= 4 ? 0.8 : 0.4, it.rar >= 3 ? 600 : 350); wsShake(it.rar >= 3);
    sfx.golden();
  } else if (it.rar === 1) { wsBits(cx, cy - 40, 10, { colors: [r.col, '#fff'], dist: 120, min: 5, max: 9 }); sfx.buy(); }
  if (res === 'lost') wsNum(cx, cy + 40, 'Bag full! Item lost', 'p');
  else if (res === 'replaced') wsNum(cx, cy + 40, 'Bag full: replaced worst', 'a');
}

/* shatter a health bar into flying pieces ("disappear" animation) */
function wsShatter(barEl, oldFrac, opts) {
  opts = opts || {};
  const L = WS.fxl; if (!barEl || !L) return;
  const r = wsRect(barEl);
  const clone = barEl.cloneNode(true);
  clone.removeAttribute('id'); clone.classList.remove('intro');
  clone.querySelectorAll('[data-bar]').forEach(e => e.removeAttribute('data-bar'));
  clone.style.cssText += ';position:absolute;left:' + r.x + 'px;top:' + r.y + 'px;width:' + r.w + 'px;height:' + r.h + 'px;margin:0;';
  L.appendChild(clone);
  const fill = clone.querySelector('.ws-fill'), ghost = clone.querySelector('.ws-ghost');
  fill.style.width = (oldFrac * 100) + '%'; ghost.style.width = (oldFrac * 100) + '%';
  ghost.style.transition = 'none'; ghost.style.opacity = '1';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    fill.style.transition = 'width .12s ease-out'; fill.style.width = '0%';          /* 1: the last chunk of health is knocked out */
    ghost.style.transition = 'width .3s ease .08s'; ghost.style.width = '0%';         /* 2: the pale chip drains away */
  }));
  setTimeout(() => clone.classList.add('flash'), 260);                                 /* 3: blink + shake */
  setTimeout(() => {                                                                   /* 4: shatter */
    clone.remove();
    if (!wsParticles()) return;
    const N = 16, pw = r.w / N;
    for (let i = 0; i < N; i++) {
      const p = document.createElement('div');
      p.className = 'ws-shard';
      const hot = i / N < oldFrac;
      p.style.cssText += ';left:' + (r.x + i * pw) + 'px;top:' + r.y + 'px;width:' + (pw + 1) + 'px;height:' + r.h + 'px;background:' + (opts.color && hot ? opts.color : hot ? 'linear-gradient(90deg,#ff5c7a,#ffd43b)' : '#2b2570') + ';';
      L.appendChild(p);
      const dx = (i - N / 2 + 0.5) * rand(12, 26), up = rand(40, 130), rot = rand(-540, 540);
      p.animate([
        { transform: 'translate(0,0) rotate(0) scale(1)', opacity: 1 },
        { transform: 'translate(' + dx * 0.55 + 'px,' + (-up) + 'px) rotate(' + rot * 0.5 + 'deg) scale(1.15)', opacity: 1, offset: 0.35 },
        { transform: 'translate(' + dx + 'px,' + rand(120, 300) + 'px) rotate(' + rot + 'deg) scale(.3)', opacity: 0 }
      ], { duration: rand(650, 950), easing: 'cubic-bezier(.2,.7,.5,1)', fill: 'forwards' }).onfinish = () => p.remove();
    }
    wsBits(r.x + r.w * Math.max(0.1, oldFrac * 0.5), r.y + r.h / 2, 12, { colors: ['#ff5c7a', '#ffd43b', '#fff'], dist: 90, min: 5, max: 10, grav: 80 });
  }, 560);
}

    { transform: 'translate(-50%,-50%) scale(.9,1.3) rotate(8deg)', filter: 'brightness(3) saturate(0)', opacity: 1, offset: 0.3 },
    { transform: 'translate(-50%,-80%) scale(1.8) rotate(240deg)', filter: 'brightness(4) saturate(0)', opacity: 0 }
  ], { duration: 520, easing: 'ease-in', fill: 'forwards' }).onfinish = () => corpse.remove();
  setTimeout(() => {
    wsRing(cx, cy, '#fff', rm.w * 0.9, 600);

    wsBits(cx, cy, boss ? 22 : 12, { emoji: m.icon, dist: rm.w * 1.1, grav: 220, min: 10, max: 15, t0: 650, t1: 1000 });
    wsBits(cx, cy, boss ? 36 : 22, { colors: ['#ffd43b', '#ff5c9d', '#25d9a2', '#4cc9ff', '#ff9a3c', '#b05cff'], dist: rm.w * 1.5, grav: 200, min: 6, max: 13, round: false, t0: 700, t1: 1100 });
  }, 120);
  wsFlash('wsFlash', boss ? 0.9 : 0.55, boss ? 500 : 300);
  wsShake(true);
  /* rewards */

  setTimeout(() => {
    wsNum(cx, cy - rm.h * 0.15, '+' + fmt(earn), 'coin');

        { transform: 'translate(calc(-50% + ' + ox + 'px),calc(-50% + ' + oy + 'px)) scale(1.1) rotate(180deg)', opacity: 1, offset: 0.35 },
        { transform: 'translate(calc(-50% + ' + (tx - cx) + 'px),calc(-50% + ' + (ty - cy) + 'px)) scale(.5) rotate(540deg)', opacity: 1 }
      ], { duration: 800 + i * 40, delay: i * 35, easing: 'cubic-bezier(.4,0,.3,1)', fill: 'forwards' }).onfinish = () => { c.remove(); if (i === coinN - 1) wsPulse('wsCoins'); };

      + '<span class="t"></span></span>').join('');
  }
  const now = Date.now();
  box.querySelectorAll('.buff-chip').forEach(el => {
    const b = S.buffs.find(x => x.id === el.getAttribute('data-bid'));
    if (b) el.lastChild.textContent = Math.max(0, Math.ceil((b.until - now) / 1000)) + 's';
  });

  /* ticker */
  if (now >= ui.newsAt) {
    ui.newsAt = now + 9000;
    let i;

    ui.newsLast = i;

    el.style.animation = 'none';

    el.style.animation = '';

function onFinnPress(ev) {

function wireEvents() {
  const finnBtn = $('finnBtn');
  finnBtn.addEventListener('pointerdown', ev => {
    if (ev.button !== undefined && ev.button > 0) return;
    onFinnPress(ev);
  });
  finnBtn.addEventListener('click', ev => { if (ev.detail === 0) onFinnPress(ev); });
  finnBtn.addEventListener('contextmenu', ev => ev.preventDefault());

  const onAct = ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el.dataset, el);
  };
  $('tabBody').addEventListener('click', ev => {
    if (ev.target.closest('#arena')) { onArenaClick(ev); return; }
    onAct(ev);
  });
  $('tabs').addEventListener('click', onAct);

  $('tabBody').addEventListener('change', ev => {
    const nameEl = ev.target.closest('[data-name]');
    if (nameEl) {
      S.playerName = (nameEl.value || '').trim().slice(0, 16) || 'You';
      T.boardCache = {};
      ui.dirty = true;
      return;
    }
    const el = ev.target.closest('[data-set]');
    if (!el) return;
    const key = el.getAttribute('data-set');
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') v = Math.max(1, Math.floor(+el.value) || 1);
    else if (key === 'autosave') v = +el.value;
    else v = el.value;
    S.settings[key] = v;
    if (key === 'notation') ui.dirty = true;
  });

  $('tabBody').addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'codeInput') ACTIONS.redeem();
  });

  $('modalRoot').addEventListener('click', ev => {
    const btn = ev.target.closest('[data-ma]');
    if (btn) {
      const a = ui.modalActions[+btn.getAttribute('data-ma')];
      closeModal();
      if (a && a.fn) a.fn();
      return;
    }
    if (ev.target.classList.contains('modal-back')) closeModal();
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

  $('btnSound').addEventListener('click', () => { S.settings.sound = !S.settings.sound; sfx.unlock(); if (S.settings.sound) sfx.buy(); ui.dirty = ui.tab === 'settings'; });
  $('btnFx').addEventListener('click', () => { S.settings.particles = !S.settings.particles; ui.dirty = ui.tab === 'settings'; });
  $('btnSave').addEventListener('click', () => ACTIONS.savenow());

  window.addEventListener('beforeunload', () => saveGame());
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
}

    sfx.prestige();
    fx.burstCenter(60);

    ui.dirty = true;
    ui.skinSig = '';
  });
  bus.on('prestige', p => {
    if (T.autoQuiet) { ui.dirty = true; return; }
    sfx.prestige();
    fx.burstCenter(40);
    const nm = { rebirth: 'Reborn!', transcend: 'Transcended!', ascend: 'Ascended!' }[p.layer];
    const unit = { rebirth: 'Rebirth Tokens', transcend: 'Shards', ascend: 'Crowns' }[p.layer];
    toast(nm, '+' + fmtInt(p.gain) + ' ' + unit, 'gold');
    ui.dirty = true;
    ui.skinSig = '';
  });
  bus.on('hatch', (results, egg) => {
    const best = results.reduce((a, b) => (RARITY_ORDER.indexOf(b.def.rarity) > RARITY_ORDER.indexOf(a.def.rarity) ? b : a), results[0]);
    const high = RARITY_ORDER.indexOf(best.def.rarity) >= 4;
    if (high) { sfx.rare(); fx.burstCenter(36); } else sfx.hatch();
    if (results.length === 1) {
      toast(best.def.emoji + ' ' + best.def.name, RARITIES[best.def.rarity].name + ' | ' + petEffectText(best.pet), high ? 'gold' : 'good');
    } else {
      const counts = {};
      results.forEach(r => { counts[r.def.id] = (counts[r.def.id] || 0) + 1; });
      const body = '<div class="owned-list" style="justify-content:center">' + Object.keys(counts).map(id => {
        const d = PET_BY_ID[id];
        return '<span class="owned-chip r-' + d.rarity + '" style="border-width:3px">' + d.emoji + ' ' + esc(d.name) + ' x' + counts[id] + '</span>';
      }).join('') + '</div>';
      showModal('Hatched ' + results.length + ' pets!', body, [{ label: 'Nice', cls: 'btn-sun' }]);
    }
    ui.dirty = true;
  });
  bus.on('offline', r => showOfflineModal(r));
  bus.on('kumarUnlock', k => {
    toast('New Kumar: ' + k.name, k.boost, 'gold');
    sfx.rare();
    fx.burstCenter(40);
    ui.dirty = true;
  });
  bus.on('kumarSelect', () => { ui.skinSig = ''; ui.dirty = true; });
  bus.on('research', n => {
    const el = $('qsRp');
    if (el) { const r = el.getBoundingClientRect(); fx.floatText(r.left + r.width / 2, r.top, '+' + n + ' RP', 'small'); }
    sfx.tick();
  });
  bus.on('rankUp', (rank, passed) => {
    toast('Rank up! You are #' + rank, passed ? 'You passed ' + passed + '.' : '', 'gold');
    sfx.win();
    ui.dirty = ui.dirty || ui.tab === 'board';
  });
  bus.on('missionClaimed', r => toast(r.mission.name + ' complete', r.kumar.name + ' brought back ' + r.text + '.', 'gold'));
}

function showOfflineModal(r) {
  showModal('Welcome back!', '<p>You were away for <b>' + fmtTime(r.seconds) + '</b>.</p>'
    + '<p>Your Kumars worked at ' + Math.round(r.eff * 100) + '% efficiency' + (r.capped ? ' (capped at ' + fmtTime(r.used) + ')' : '') + ' and earned <b>' + fmt(r.gain) + ' Finn Kumar</b>' + (r.rp > 0 ? ' and <b>' + r.rp + ' research points</b>' : '') + '.</p>',
  [{ label: 'Collect', cls: 'btn-sun' }]);
}

/* =====================================================================
   FINN KUMAR INCREMENTAL - boot
   ===================================================================== */
(function boot() {
  const saved = readSave();
  const offline = initGame(saved);
  fx.init();
  wireEvents();
  wireBus();

  ui.skinSig = '';
  updateStage();
  renderNav();
  renderTab();

  /* the arena delegate lives on tabBody; make sure Finn art is present immediately */
  if (offline && offline.gain > 0) showOfflineModal(offline);
  if (!saved) {
    toast('Welcome to Finn Kumar Incremental', 'Click Finn to earn Finn Kumar. Buy generators to earn it while you are away.', 'gold');
  }

  /* simulation runs 10 times a second */
  setInterval(function () {
    try { tick(); } catch (err) { console.error('tick failed', err); }
  }, 100);

  /* the screen refreshes a little slower than the simulation */
  setInterval(function () {
    try {
      updateStage();
      updateTabs();
      wsPatch();
    } catch (err) {
      console.error('render failed', err);
    }
  }, 150);

  /* periodic checks that do not need to run every frame */
  setInterval(function () {
    try { recalc(); } catch (err) { console.error(err); }
  }, 1000);
})();

<script>
/* =====================================================================

/* ---------- helpers ---------- */
function step(name, fn) { try { fn(); } catch (err) { console.error('[finn-patch:' + name + ']', err); } }

function wrap(name, make) {
  const orig = window[name];
  if (typeof orig !== 'function') { console.warn('[finn-patch] missing function ' + name); return null; }
  window[name] = make(orig);
  return orig;
}

const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function safeNum(x) { return typeof x === 'number' && isFinite(x) ? x : 0; }
function cleanName(s) { return String(s || '').replace(/[\u0000-\u001f<>&"'`\\]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16); }
function maxGen() { return Math.max.apply(null, GENS.map(g => S.gens[g.id] || 0)); }

function getPid() {
  let id = '';
  try { id = localStorage.getItem('fk-player-id') || ''; } catch (e) { /* ignore */ }
  if (!/^[A-Za-z0-9_-]{8,40}$/.test(id)) {
    id = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'p' + Math.random().toString(36).slice(2) + Date.now().toString(36);
    id = id.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 40);
    try { localStorage.setItem('fk-player-id', id); } catch (e) { /* ignore */ }
  }
  return id;
}

function ensureFields(st) {
  GENS.forEach(g => { if (typeof st.gens[g.id] !== 'number' || st.gens[g.id] < 0) st.gens[g.id] = 0; });
  if (!isPlainObject(st.titlesOwned)) st.titlesOwned = {};
  if (typeof st.titleSel !== 'string') st.titleSel = '';
  if (!isPlainObject(st.daily)) st.daily = { last: 0, streak: 0 };
  st.daily.last = safeNum(st.daily.last);
  st.daily.streak = safeNum(st.daily.streak);
  if (typeof st.pid !== 'string' || !/^[A-Za-z0-9_-]{8,40}$/.test(st.pid)) st.pid = getPid();

/* =====================================================================
   1. BUG FIXES
   ===================================================================== */
step('fixes', () => {
  /* Importing a hand-edited save could poison Object.prototype through "__proto__". */
  window.mergeState = function safeMerge(base, saved) {
    for (const key in saved) {
      if (!hasOwn(saved, key) || key === '__proto__' || key === 'constructor' || key === 'prototype') continue;
      const sv = saved[key];
      if (isPlainObject(sv) && hasOwn(base, key) && isPlainObject(base[key])) window.mergeState(base[key], sv);
      else if (sv !== undefined && sv !== null) base[key] = sv;
    }
    return base;
  };

  /* Typing "constructor" or "toString" used to count as a redeemed code. */
  window.redeemCode = function (raw) {
    const code = String(raw || '').trim().toLowerCase();
    if (!code) return { ok: false, msg: 'Type a code first.' };
    if (!hasOwn(CODES, code)) return { ok: false, msg: 'That code is not valid.' };
    if (hasOwn(S.codes, code)) return { ok: false, msg: 'You already used that code.' };
    const def = CODES[code];
    S.codes[code] = Date.now();
    recalc();
    def.apply();
    recalc();
    saveGame();
    return { ok: true, title: def.title, msg: def.msg };
  };

  /* Corrupt or edited saves could leave NaN in counters and break the UI. */
  wrap('stateFromSaved', orig => function (obj) {
    const st = orig(obj);
    ['counters', 'stats'].forEach(k => {
      for (const key in st[k]) if (typeof st[k][key] !== 'number' || !isFinite(st[k][key])) st[k][key] = 0;
    });
    const now = Date.now();
    if (!(st.playtime >= 0) || !isFinite(st.playtime)) st.playtime = 0;
    ['created', 'lastSave', 'runStart'].forEach(k => { if (typeof st[k] !== 'number' || !isFinite(st[k]) || st[k] > now) st[k] = now; });
    ['wheelNext', 'catcherNext'].forEach(k => { if (typeof st[k] !== 'number' || !isFinite(st[k])) st[k] = 0; });
    ensureFields(st);
    try { localStorage.setItem('fk-player-id', st.pid); } catch (e) { /* ignore */ }
    return st;

      case 'ralph': e.prod = 3 * sc; break;

      case 'sam': e.click = 30 * sc; e.prod = 3 * sc; e.crit = 0.08 * sc; e.combo = 0.4 * sc; break;
      case 'adam': e.prod = 5 * sc; e.click = 3 * sc; e.rp = 1.5 * sc; break;
      case 'zander': e.prod = 4 * sc; e.goldFreq = 2 * sc; e.offline += 0.3 * sc; break;
      case 'custom': case 'omega': {
        const profiles = {
          finn: { prod: 1 + 0.25 * sc, click: 1 + 0.25 * sc },
          julian: { click: 3 * sc, crit: 0.08 * sc, combo: 0.5 * sc },
          leo: { goldFreq: 1 + 0.5 * sc, goldVal: 1 + 0.5 * sc, pet: 1 + 0.25 * sc },

          secret: { prod: 10 * sc, click: 10 * sc, goldFreq: 2 * sc, rp: 2 * sc, pet: 2 * sc },
          ralph: { prod: 3 * sc },
          mitch: { rp: 2 * sc }, hugh: { prod: 2 * sc, offline: 0.2 * sc },

          zander: { prod: 4 * sc, goldFreq: 2 * sc, offline: 0.3 * sc },

        };
        const score = p => (p.prod || 1) * (p.click || 1) * (p.goldFreq || 1) * (p.goldVal || 1) * (p.rp || 1) * (p.pet || 1);

{ /* World 2 title: 150% of the strongest title in each stat */

function boostText(b) {
  const parts = [];
  if (b.prod) parts.push('Production x' + fmt(b.prod));
  if (b.click) parts.push('Click power x' + fmt(b.click));
  if (b.gold) parts.push('Golden Finns x' + fmt(b.gold) + ' more often');
  if (b.pet) parts.push('Pets x' + fmt(b.pet));
  if (b.rp) parts.push('Research x' + fmt(b.rp) + ' faster');
  return parts.length ? parts.join(', ') : 'No boost, just a name.';

function titleFx() {
  const out = { prod: 1, click: 1, gold: 1, pet: 1, rp: 1 };
  if (!S || !S.titlesOwned) return out;
  const n = Object.keys(S.titlesOwned).length;
  out.prod *= 1 + 0.01 * Math.max(0, n - 1);
  const t = TITLE_BY_ID[S.titleSel];
  if (t && S.titlesOwned[t.id]) for (const k in t.boost) out[k] *= t.boost[k];
  return out;
}

function grantTitle(id, equip) {
  if (!TITLE_BY_ID[id]) return;
  if (!S.titlesOwned[id]) S.titlesOwned[id] = Date.now();

  ui.dirty = true;
}

function checkTitles() {
  const fresh = [];
  MY_TITLES.forEach(t => {
    if (S.titlesOwned[t.id]) return;
    let ok = false;
    try { ok = !!t.check(); } catch (e) { ok = false; }
    if (ok) { S.titlesOwned[t.id] = Date.now(); fresh.push(t); }
  });
  if (!fresh.length) return;
  recalc();
  ui.dirty = ui.dirty || ui.tab === 'profile';
  if (titleFirst) return;
  if (fresh.length <= 2) fresh.forEach(t => toast('New title: ' + t.name, boostText(t.boost), 'gold'));

}

function equipDivine(pet) {
  if (S.equipped.length >= calc.slots) {

      const p = findPet(S.equipped[i]);
      if (p && PET_BY_ID[p.id].rarity !== 'divine') { S.equipped.splice(i, 1); break; }
    }
  }
  if (S.equipped.length < calc.slots) S.equipped.push(pet.u);
}

/* =====================================================================
   6. RESTORE THINGS THE ORIGINAL LOADER DROPPED, THEN BACKFILL
   (the game booted before this file ran, so new Kumars/pets in an
   existing save were filtered out as "unknown")
   ===================================================================== */
step('restore', () => {
  ensureFields(S);
  const raw = readSave();
  if (raw) {
    if (isPlainObject(raw.kumarsUnlocked)) {
      Object.keys(raw.kumarsUnlocked).forEach(id => { if (KUMAR_BY_ID[id] && !S.kumarsUnlocked[id]) S.kumarsUnlocked[id] = raw.kumarsUnlocked[id]; });
    }
    if (typeof raw.kumar === 'string' && KUMAR_BY_ID[raw.kumar] && S.kumarsUnlocked[raw.kumar]) S.kumar = raw.kumar;
    if (Array.isArray(raw.pets)) {
      raw.pets.forEach(p => {
        if (p && PET_BY_ID[p.id] && typeof p.u === 'number' && !findPet(p.u)) S.pets.push({ u: p.u, id: p.id, lvl: clamp(p.lvl | 0, 0, PET_MAX_LEVEL), star: clamp(p.star | 0, 0, MEGA_MAX_STARS) });
      });
      S.pets.forEach(p => { S.petDex[p.id] = S.petDex[p.id] || 1; });
    }
    if (Array.isArray(raw.equipped)) {
      raw.equipped.forEach(u => { if (findPet(u) && S.equipped.indexOf(u) < 0 && S.equipped.length < calc.slots + 4) S.equipped.push(u); });
    }
    if (raw.titlesOwned && isPlainObject(raw.titlesOwned)) {
      Object.keys(raw.titlesOwned).forEach(id => { if (TITLE_BY_ID[id]) S.titlesOwned[id] = raw.titlesOwned[id]; });
    }
  }
  /* codes redeemed in earlier versions */
  if (hasOwn(S.codes, '666')) S.titlesOwned.code666 = S.titlesOwned.code666 || Date.now();
  if (hasOwn(S.codes, '123')) {
    S.titlesOwned.code123 = S.titlesOwned.code123 || Date.now();
    S.kumarsUnlocked.kasi = S.kumarsUnlocked.kasi || Date.now();
  }
  if (S.titleSel && !S.titlesOwned[S.titleSel]) S.titleSel = '';
  checkTitles();
  titleFirst = false;
  recalc();
});

function refreshBoard() {
  if (!online()) return Promise.resolve();
  return fetch(DB + '/scores.json').then(r => r.json()).then(data => {
    const rows = [];
    const now = Date.now();
    if (data && typeof data === 'object') {
      Object.keys(data).forEach(id => {
        const d = data[id];
        if (!d || typeof d !== 'object' || id === S.pid || typeof d.life !== 'number') return;
        if (now - safeNum(d.t) > 30 * 864e5) return;
        const vals = { life: safeNum(d.life), cps: safeNum(d.cps), clicks: safeNum(d.clicks) };
        EXTRA_BOARDS.forEach(b => { vals[b.id] = safeNum(d[b.id]); });
        const kum = KUMAR_BY_ID[d.kumar];
        rows.push({ id: 'p' + id.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 24), name: cleanName(d.name) || 'Player', title: String(d.title || '').slice(0, 30), icon: kum ? kum.icon : '🥚', vals: vals });
      });
    }
    rows.sort((a, b) => b.vals.life - a.vals.life);
    net.rows = rows.slice(0, 300);
    net.loaded = true;
    net.err = '';
    net.at = now;
    net.cache = null;
    ui.dirty = ui.dirty || ui.tab === 'board';
  }).catch(() => { net.err = 'offline'; });
}

step('boards', () => {
  EXTRA_BOARDS.forEach(b => { if (!BOARDS.some(x => x.id === b.id)) BOARDS.push({ id: b.id, name: b.name }); });

  wrap('playerValue', orig => board => (hasOwn(EXTRA_BY_ID, board) ? EXTRA_BY_ID[board].get() : orig(board)));
  wrap('rivalValue', orig => (r, board) => (hasOwn(EXTRA_BY_ID, board) ? EXTRA_BY_ID[board].rival(RIVALS.indexOf(r) + 1, rivalHours()) : orig(r, board)));

  origGetBoard = wrap('getBoard', orig => function (board) {
    const k = KUMAR_BY_ID[S.kumar] || KUMARS[0];
    if (!online() || !net.loaded) {
      const rows = orig(board);
      rows.forEach(r => { if (r.you) r.title = currentTitle(); });
      return rows;
    }
    const now = Date.now();
    if (net.cache && net.cache.board === board && now - net.cacheAt < 500) return net.cache.rows;
    const rows = net.rows.map(r => ({ id: r.id, name: r.name, icon: r.icon, title: r.title, value: safeNum(r.vals[board]), you: false }));
    rows.push({ id: 'you', name: S.playerName || 'You', icon: k.icon, title: currentTitle(), value: playerValue(board), you: true });
    rows.sort((a, b) => b.value - a.value);
    rows.forEach((r, i) => { r.rank = i + 1; });
    net.cache = { board: board, rows: rows };
    net.cacheAt = now;
    return rows;
  });

  /* The rank production bonus always uses the local computer rivals, so an empty real board cannot hand out #1 for free. */
  window.updateRank = function () {
    T.boardCache = {};
    const rows = origGetBoard('life');
    const me = rows.find(r => r.you);
    const rank = me ? me.rank : RIVALS.length + 1;
    const bonus = 1 + rankBonusFor(rank);
    const changed = bonus !== T.rankMult;
    if (T.lastRank && rank < T.lastRank) bus.emit('rankUp', rank, rows[rank] ? rows[rank].name : '');
    T.lastRank = rank;
    T.rank = rank;
    T.rankMult = bonus;
    if (changed) recalc();
  };

  wrap('liveText', orig => function (key) {
    const p = key.split(':');
    if (p[0] === 'rankinfo') {
      const rows = origGetBoard('life');
      const me = rows.find(r => r.you);
      const b = rankBonusFor(me.rank);
      return 'Rank bonus (vs the computer Kumars): #' + me.rank + ' of ' + rows.length + '. ' + (b > 0 ? '+' + Math.round(b * 100) + '% production.' : 'None yet (reach the top 8).');
    }
    if (p[0] === 'daily') {
      const left = 20 * 3600 - (Date.now() - S.daily.last) / 1000;
      return left <= 0 ? 'Claim gift' : 'Ready in ' + fmtTime(left);
    }
    return orig(key);
  });
  wrap('liveAff', orig => function (key) {
    if (key.indexOf('daily:') === 0) return dailyReady();
    return orig(key);
  });

  const t = TAB_BY_ID.board;
  const origSig = t.sig;
  t.sig = () => origSig() + '|' + currentTitle() + '|' + net.at + '|' + net.loaded;
  t.render = renderBoard;
});

function dailyReady() {
  if (S.daily.last > Date.now()) S.daily.last = 0;
  return Date.now() - S.daily.last >= 20 * 3600 * 1000;
}

function claimDaily() {
  if (!dailyReady()) return null;
  const now = Date.now();
  const gap = now - S.daily.last;
  S.daily.streak = (S.daily.last && gap < 48 * 3600 * 1000) ? S.daily.streak + 1 : 1;
  S.daily.last = now;
  const s = S.daily.streak;
  const fk = calc.cps * 1800 * (1 + 0.25 * Math.min(s, 20)) + 5000 * s;
  addFk(fk, 'daily');
  const rp = Math.min(s, 10);
  addResearch(rp);
  addBuff({ id: 'frenzy', name: 'Finn Frenzy', kind: 'cps', mult: 7, tone: 'sunny' }, 60);
  const parts = ['+' + fmt(fk) + ' Finn Kumar', '+' + rp + ' RP', 'a 60 second Frenzy'];
  if (s % 7 === 0 && S.rebirths >= 1) { S.rt += 1; S.rtTotal += 1; S.rtRun += 1; parts.push('+1 Rebirth Token'); }
  recalc();
  return 'Day ' + s + ': ' + parts.join(', ');
}

/* =====================================================================
   8. REAL ACCOUNTS: Firebase email/password auth + cloud saves
   Configure window.FK_CONFIG with your Firebase Web API key and RTDB URL.
   Username is used as a private synthetic email; passwords are handled by
   Firebase Authentication and are never stored in this HTML/localStorage.
   ===================================================================== */
const AUTH_KEY = 'fk-auth-session-v1';
const USER_EMAIL_DOMAIN = '@kumar.game';
let authUser = null;
let IMP = null;   /* admin "login as": {uid, username, backup} */

  ['Gold', 'linear-gradient(135deg,#ffe27a,#b87918,#fff0a8)'],
  ['Neon', 'linear-gradient(135deg,#50eaff,#8d4dff,#ff4cba)'],
  ['Emerald', 'linear-gradient(135deg,#9dffca,#079b70,#d7ffe9)'],
  ['Crimson', 'linear-gradient(135deg,#ff9b9b,#a41438,#ffd0d0)']
];

function authConfigured() { return !!(CFG.apiKey && !String(CFG.apiKey).includes('PASTE_') && DB && !DB.includes('YOUR-PROJECT')); }
function authEmail(username) { return cleanName(username).toLowerCase() + USER_EMAIL_DOMAIN; }
function authErrorMessage(raw) {
  const code = String(raw || 'UNKNOWN');
  const map = {
    EMAIL_EXISTS: 'That username is already taken.',
    EMAIL_NOT_FOUND: 'Username or password is incorrect.',
    INVALID_PASSWORD: 'Username or password is incorrect.',
    INVALID_LOGIN_CREDENTIALS: 'Username or password is incorrect.',
    WEAK_PASSWORD: 'Password must be at least 6 characters.',
    TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many attempts. Try again later.',
    OPERATION_NOT_ALLOWED: 'Enable Email/Password sign-in in Firebase Authentication.',
    API_KEY_INVALID: 'Firebase API key is incorrect.',
    USER_DISABLED: 'This account has been disabled.'
  };
  return map[code] || ('Account error: ' + code.replace(/_/g, ' ').toLowerCase());
}
async function authRequest(method, payload) {
  const url = 'https://identitytoolkit.googleapis.com/v1/accounts:' + method + '?key=' + encodeURIComponent(CFG.apiKey);
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(authErrorMessage(data.error && data.error.message));
  return data;
}
function persistAuth(data, username) {
  authUser = { uid: data.localId, username: username, idToken: data.idToken, refreshToken: data.refreshToken, expiresAt: Date.now() + Math.max(60, Number(data.expiresIn || 3600) - 60) * 1000 };
  try { localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: authUser.uid, username: username, refreshToken: authUser.refreshToken })); } catch (e) {}
}
async function refreshAuth() {
  if (!authUser || !authUser.refreshToken) throw new Error('Please log in again.');
  const res = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(CFG.apiKey), {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(authUser.refreshToken)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { authUser = null; try { localStorage.removeItem(AUTH_KEY); } catch (e) {} throw new Error('Your session expired. Please log in again.'); }
  authUser.idToken = data.id_token;
  authUser.refreshToken = data.refresh_token;
  authUser.expiresAt = Date.now() + Math.max(60, Number(data.expires_in || 3600) - 60) * 1000;
  try { localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: authUser.uid, username: authUser.username, refreshToken: authUser.refreshToken })); } catch (e) {}
}
async function token() { if (!authUser) throw new Error('Not logged in.'); if (Date.now() >= authUser.expiresAt) await refreshAuth(); return authUser.idToken; }
async function dbRequest(path, options) {
  const idToken = await token();
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  let url = DB + path + (path.includes('?') ? '&' : '?') + 'auth=' + encodeURIComponent(idToken);
  let res = await fetch(url, opts);
  if (res.status === 401 || res.status === 403) {
    await refreshAuth();
    url = DB + path + (path.includes('?') ? '&' : '?') + 'auth=' + encodeURIComponent(authUser.idToken);
    res = await fetch(url, opts);
  }
  if (!res.ok) throw new Error('Database request failed (' + res.status + '). Check Firebase Realtime Database rules.');
  return res.status === 204 ? null : res.json().catch(() => null);
}
function cloudUid() { return IMP ? IMP.uid : authUser.uid; }
/* Banned accounts (written by the admin panel to /bans/<uid>) are logged out. Admins are exempt. */
async function enforceBan() {
  if (!authUser || IMP) return false;
  try {
    const b = await dbRequest('/bans/' + encodeURIComponent(authUser.uid) + '.json', { method: 'GET' });
    if (b && b.banned !== false) {
      authUser = null;
      try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
      showAuthGate('This account has been banned.' + (b.reason ? ' Reason: ' + b.reason : ''));
      return true;
    }
  } catch (e) { /* rules not set up or offline: do not lock anyone out */ }
  return false;
}
function profileFrameIndex() { return Math.max(0, Math.min(FRAME_STYLES.length - 1, Number(S.profileFrame || 0) | 0)); }
function profileAvatar() { const k = KUMAR_BY_ID[S.kumar] || KUMARS[0]; return k.icon || '🥚'; }
function profileName() { return authUser ? authUser.username : 'Guest'; }
function authOverlayHtml() {

    + '<form id="fkAuthForm"><label>Username</label><input id="fkAuthUsername" autocomplete="username" maxlength="16" minlength="3" required placeholder="3–16 characters">'
    + '<label>Password</label><input id="fkAuthPassword" type="password" autocomplete="' + (authMode === 'signup' ? 'new-password' : 'current-password') + '" minlength="6" required placeholder="At least 6 characters">'
    + (authMode === 'signup' ? '<label>Confirm password</label><input id="fkAuthConfirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Enter password again">' : '')
    + '<div class="fk-auth-error" id="fkAuthError">' + esc(authMessage) + '</div>'

    + '<button class="fk-auth-switch" id="fkAuthSwitch" type="button">' + (authMode === 'signup' ? 'Already have an account? Log in' : 'New here? Create an account') + '</button>'

    + '</div></div>';

function ensureAuthUI() {

          + '<label class="fk-frame-label">Profile frame</label><select id="fkFrameSelect">' + FRAME_STYLES.map((f,i) => '<option value="' + i + '" ' + (fi === i ? 'selected' : '') + '>' + f[0] + '</option>').join('') + '</select>'

async function loadCloudSave() {
  const cloud = await dbRequest('/users/' + encodeURIComponent(cloudUid()) + '/save.json', { method: 'GET' });
  if (cloud && typeof cloud === 'object' && cloud.v) {
    S = stateFromSaved(cloud);
    recalc(); updateRank(); updateStage(); ui.dirty = true;
    toast('Progress loaded', 'Your cloud save has been restored.', 'good');
  } else {
    /* First login on this account: migrate this browser's existing progress. */
    S.playerName = S.playerName && S.playerName !== 'You' ? S.playerName : authUser.username;
    saveGame();
    await cloudSave(true);
  }
}
async function cloudSave(force) {
  if (!authUser || cloudSaveBusy || !S) return;
  if (!force && Date.now() - lastCloudSave < 12000) return;
  cloudSaveBusy = true;
  try {
    const snapshot = JSON.parse(JSON.stringify(S));
    await dbRequest('/users/' + encodeURIComponent(cloudUid()) + '/save.json', { method: 'PUT', body: JSON.stringify(snapshot) });
    lastCloudSave = Date.now();
    await submitScore();
  } catch (e) { console.warn('[account] cloud save failed', e); }
  finally { cloudSaveBusy = false; }
}
async function doAuth(mode, username, password) {
  if (!authConfigured()) throw new Error('Firebase is not configured yet.');
  const name = cleanName(username);
  if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) throw new Error('Username must be 3–16 letters, numbers or underscores.');
  const data = await authRequest(mode === 'signup' ? 'signUp' : 'signInWithPassword', { email: authEmail(name), password: password, returnSecureToken: true });
  persistAuth(data, name);
  if (await enforceBan()) return;
  await loadCloudSave();
  authMessage = '';
  ensureAuthUI();
  renderAuthUI();
  ui.dirty = true;
  await cloudSave(true);
}
async function restoreSession() {
  if (!authConfigured()) { ensureAuthUI(); return; }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) {}
  if (!saved || !saved.refreshToken || !saved.uid || !saved.username) { ensureAuthUI(); return; }
  authUser = { uid: saved.uid, username: saved.username, refreshToken: saved.refreshToken, idToken: '', expiresAt: 0 };
  try {
    await refreshAuth();
    if (await enforceBan()) return;
    await loadCloudSave();
    ensureAuthUI();
    renderAuthUI();
    await submitScore();
    await refreshBoard();
  } catch (e) {
    authUser = null;
    try { localStorage.removeItem(AUTH_KEY); } catch (x) {}
    showAuthGate('Your saved login expired. Please log in again.');
  }
}
async function logoutAccount() {
  if (authUser) await cloudSave(true);
  authUser = null; profileOpen = false;
  try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
  showAuthGate('You have been logged out.');
}

    finally { authBusy = false; }
  });
  document.addEventListener('click', ev => {
    const id = ev.target && ev.target.id;
    if (id === 'fkAuthSwitch') { authMode = authMode === 'login' ? 'signup' : 'login'; authMessage = ''; showAuthGate(''); }
    if (id === 'fkProfileToggle') { profileOpen = !profileOpen; renderAuthUI(); }
    if (id === 'fkLogout' || id === 'fkLogoutProfile') logoutAccount();
    if (id !== 'fkProfileToggle' && !ev.target.closest('.fk-profile-menu') && !ev.target.closest('.fk-top-profile')) { if (profileOpen) { profileOpen = false; renderAuthUI(); } }
  });
  document.addEventListener('change', ev => {
    if (ev.target.id === 'fkFrameSelect' || ev.target.id === 'fkFrameSelectProfile') { S.profileFrame = Number(ev.target.value) || 0; saveGame(); renderAuthUI(); ui.dirty = true; }
  });
  const originalSaveGame = saveGame;
  saveGame = function () { if (IMP) { if (authUser) cloudSave(false); return true; } const ok = originalSaveGame(); if (authUser) cloudSave(false); return ok; };
  window.addEventListener('beforeunload', () => { if (authUser) cloudSave(true); });
  setInterval(() => { if (authUser) { cloudSave(false); refreshBoard(); } }, 15000);
  restoreSession();
});

  async function loadPlayers() {

      const out = await Promise.all([req('/scores.json'), req('/bans.json').catch(() => null), req('/users.json?shallow=true').catch(() => null)]);
      const scores = out[0] || {}, bans = out[1] || {}, shallow = out[2] || {};
      adm.bans = bans;
      const ids = Array.from(new Set(Object.keys(scores).concat(Object.keys(shallow))));
      adm.rows = ids.map(uid => { const r = scores[uid] || {}, b = bans[uid]; return { uid: uid, name: r.name || '(no score yet)', life: +r.life || 0, cps: +r.cps || 0, at: r.at || r.t || 0, banned: !!(b && b.banned !== false), reason: (b && b.reason) || '' }; })

  function parseVal(v) {

  async function pushSave(uid, obj, note) {

    else if (a === 'reload') loadPlayers();
    else if (a === 'back') { adm.det = null; draw(); }
    else if (a === 'open') openPlayer(uid);
    else if (a === 'login') loginAs(uid, name);
    else if (a === 'ban') setBan(uid, name, true);
    else if (a === 'unban') setBan(uid, name, false);
    else if (a === 'copyrules') { try { await navigator.clipboard.writeText($a('admRules').textContent); say('Rules copied.'); } catch (e) { say('Select the text and copy it manually.'); } }
    else if (a === 'save') {
      try {
        const obj = JSON.parse($a('admJson').value);
        root.querySelectorAll('[data-q]').forEach(inp => {
          const k = inp.dataset.q, orig = adm.det.save[k] === undefined ? '' : String(adm.det.save[k]);

      } catch (err) { say('Not saved: ' + (err.message || err)); }
    }
    else if (a === 'reset') {
      if (!window.confirm('Reset ALL progress for ' + adm.det.name + '? This cannot be undone.')) return;
      try {
        const old = adm.det.save || {};
        const fresh = JSON.parse(JSON.stringify(defaultState()));
        if (old.pid) fresh.pid = old.pid;
        if (old.playerName) fresh.playerName = old.playerName;
        await pushSave(adm.det.uid, fresh, 'Progress reset.');
        adm.det.save = fresh; draw();
      } catch (err) { say('Failed: ' + err.message); }
    }
    else if (a === 'delscore') {
      try { await req('/scores/' + encodeURIComponent(adm.det.uid) + '.json', 'DELETE'); say('Removed from the leaderboard (they reappear when they play).'); } catch (err) { say('Failed: ' + err.message); }
    }
  });
  root.addEventListener('input', ev => {

  function openPanel() { if (!allowed()) return; adm.open = true; adm.det = null; draw(); if (!adm.rows.length) loadPlayers(); }
  window.openAdminPanel = openPanel;
  const btn = $a('btnAdmin');
  if (btn) btn.addEventListener('click', openPanel);

  /* player side: apply admin edits and check bans while playing */
  async function pollPlayer() {
    if (!authUser || IMP) return;
    try {
      if (await enforceBan()) return;
      const patch = await dbRequest('/users/' + encodeURIComponent(authUser.uid) + '/adminPatch.json', { method: 'GET' });

      }
    } catch (e) { /* ignore */ }
  }
  setInterval(pollPlayer, 15000);
  window.__fk = { get authUser() { return authUser; }, get IMP() { return IMP; }, cloudSave: f => cloudSave(f) };
});

    #fkExpansion .fx-up button{min-width:94px;background:linear-gradient(135deg,#6354d9,#974de0);border:0}
    #fkExpansion button:disabled{opacity:.35;cursor:not-allowed}
    #fkExpansion .fx-switch{display:flex;align-items:center;justify-content:space-between;padding:10px;border-radius:10px;background:#ffffff0c;margin:10px 0}
    #fkExpansion .fx-switch button{background:#1f8069;border:0}
    #fkExpansion .fx-switch button.off{background:#4c4d61}
    #fkExpansion .fx-milestone{font-size:11px;color:#d9d4ff;padding:7px 9px;background:#7c62ff18;border-radius:8px;margin-top:6px}
    .golden{filter:drop-shadow(0 0 10px #ffd43b);animation:fkGoldFloat 1.4s ease-in-out infinite, fkGoldGlow 1.8s ease-in-out infinite}
    .golden.mini{animation:fkGoldFloat .9s ease-in-out infinite}
    @keyframes fkGoldFloat{0%,100%{transform:translateY(0) rotate(-3deg) scale(1)}50%{transform:translateY(-9px) rotate(3deg) scale(1.08)}}
    @keyframes fkGoldGlow{0%,100%{filter:drop-shadow(0 0 6px #ffd43b)}50%{filter:drop-shadow(0 0 19px #fff06a)}}
    #fkExpansion .fx-progress{height:7px;border-radius:20px;background:#ffffff18;overflow:hidden;margin:7px 0}
    #fkExpansion .fx-progress i{display:block;height:100%;background:linear-gradient(90deg,#47e5c0,#9b79ff);border-radius:20px}
    @media(max-width:520px){#fkExpansionToggle{right:10px;bottom:10px}#fkExpansion{right:8px;bottom:66px}}
  `;
  document.head.appendChild(css);

  if (!S.expansion) S.expansion = { autoGolden: 0, autoEnabled: true, goldenPower: 0, reactor: 0, rebirthCore: 0, capBreaks: 0 };
  const X = () => {
    if (!S.expansion || typeof S.expansion !== 'object') S.expansion = { autoGolden:0, autoEnabled:true, goldenPower:0, reactor:0, rebirthCore:0, capBreaks:0 };
    const x = S.expansion;
    ['autoGolden','goldenPower','reactor','rebirthCore','capBreaks'].forEach(k => x[k] = Math.max(0, Math.floor(Number(x[k]) || 0)));
    if (typeof x.autoEnabled !== 'boolean') x.autoEnabled = true;
    return x;
  };
  const COSTS = {
    autoGolden: n => Math.ceil(8 * Math.pow(2.25, n)),
    goldenPower: n => Math.ceil(5 * Math.pow(1.75, n)),
    reactor: n => Math.ceil(10 * Math.pow(1.9, n)),
    rebirthCore: n => Math.ceil(20 * Math.pow(2.15, n)),
    capBreaks: n => Math.ceil(30 * Math.pow(2.4, n))
  };
  const MAX = { autoGolden: 5, goldenPower: 100, reactor: 100, rebirthCore: 50, capBreaks: 25 };
  function buyExpansion(id) {
    const x = X(), level = x[id], cost = COSTS[id](level);
    if (!(id in MAX) || level >= MAX[id] || S.rt < cost) return;
    S.rt -= cost;
    x[id]++;
    recalc(); updateRank(); ui.dirty = true; saveGame();
    if (authUser && typeof cloudSave === 'function') cloudSave(true);
    sfx.achievement();
    toast('Upgrade purchased!', id === 'autoGolden' ? 'Auto Golden Finn level ' + x[id] : id + ' level ' + x[id], 'gold');
    renderExpansion();
  }
  function expansionMultiplier() {
    const x = X();
    return Math.pow(1.12, x.reactor) * Math.pow(1.18, x.rebirthCore) * Math.pow(1.08, x.capBreaks);
  }
  const originalRecalcExpansion = recalc;
  recalc = function () {
    originalRecalcExpansion();
    const x = X(), m = expansionMultiplier();
    calc.cps = Math.min(LIMIT, calc.cps * m);
    calc.cpsBig = calc.cpsBig.mul(m);
    calc.clickBase = Math.min(LIMIT, calc.clickBase * m);
    calc.goldVal = Math.min(LIMIT, calc.goldVal * Math.pow(1.22, x.goldenPower));
    calc.goldFreq = Math.min(LIMIT, calc.goldFreq * (1 + 0.08 * x.goldenPower));
  };

  let panelOpen = false;
  const toggle = document.createElement('button');
  toggle.id = 'fkExpansionToggle'; toggle.type = 'button'; toggle.textContent = '✨ Finn Labs';
  document.body.appendChild(toggle);
  const panel = document.createElement('section'); panel.id = 'fkExpansion'; panel.hidden = true;
  document.body.appendChild(panel);
  function renderExpansion() {
    const x = X(), rt = Math.max(0, Number(S.rt) || 0);
    const items = [
      ['autoGolden','🤖 Auto Golden Finn','Automatically catches Golden Finns before they disappear. Each level makes the collector faster.'],
      ['goldenPower','🌟 Golden Jackpot','Golden Finn rewards become bigger and Golden Finns appear more often.'],
      ['reactor','⚡ Quantum Reactor','Permanent production and click power boost. Stacks with your other upgrades.'],
      ['rebirthCore','♻️ Rebirth Core','Every level strengthens your permanent multiplier. Built for long-term incremental progress.'],
      ['capBreaks','🚀 Limit Breaker','Pushes your permanent power ceiling further. Each level adds another multiplier layer.']
    ];
    let h = '<div class="fx-head"><strong>✨ Finn Labs</strong><span style="color:#aeb7e0;font-size:11px">Expansion v2</span><button class="fx-close" data-fx="close">✕</button></div>';
    h += '<div class="fx-balance"><div class="fx-stat"><small>REBIRTH TOKENS</small><b>🔁 ' + esc(fmtInt(rt)) + '</b></div><div class="fx-stat"><small>PERMANENT POWER</small><b>x' + fmt(expansionMultiplier()) + '</b></div></div>';
    h += '<div class="fx-switch"><span><b>Auto Golden Finn</b><small style="display:block;color:#aeb7e0">Collector status: ' + (x.autoEnabled && x.autoGolden > 0 ? 'ACTIVE' : 'OFF') + '</small></span><button class="' + (x.autoEnabled ? '' : 'off') + '" data-fx="toggle">' + (x.autoEnabled ? 'ON' : 'OFF') + '</button></div>';
    items.forEach(([id,name,desc]) => {
      const cost = COSTS[id](x[id]), maxed = x[id] >= MAX[id], progress = x[id] / MAX[id] * 100;
      h += '<div class="fx-up"><div><b>' + name + ' <span style="color:#b9a7ff">Lv.' + x[id] + '/' + MAX[id] + '</span></b><small>' + desc + '</small><div class="fx-progress"><i style="width:' + progress + '%"></i></div></div>'
        + '<button data-fx="buy" data-id="' + id + '"' + (maxed || rt < cost ? ' disabled' : '') + '>' + (maxed ? 'MAXED' : '🔁 ' + fmtInt(cost)) + '</button></div>';
    });
    h += '<div class="fx-milestone">Milestones: 1 Auto level = automatic catching · 5 = rapid collector · 10 Reactor levels = major power spike · 25 Limit Breakers = maximum lab tier.</div>';
    panel.innerHTML = h;
  }
  toggle.addEventListener('click', () => { panelOpen = !panelOpen; panel.hidden = !panelOpen; if (panelOpen) renderExpansion(); });
  panel.addEventListener('click', ev => {
    const b = ev.target.closest('[data-fx]'); if (!b) return;
    if (b.dataset.fx === 'close') { panelOpen = false; panel.hidden = true; }
    if (b.dataset.fx === 'toggle') { X().autoEnabled = !X().autoEnabled; saveGame(); renderExpansion(); }
    if (b.dataset.fx === 'buy') buyExpansion(b.dataset.id);
  });

  /* Auto collector uses the game's real Golden Finn reward function and event system. */
  let autoAcc = 0;
  setInterval(() => {
    if (!S || !X().autoEnabled || X().autoGolden < 1 || !T || !Array.isArray(T.goldens) || !T.goldens.length) return;
    autoAcc += 0.25;
    const interval = Math.max(0.25, 1.35 / (1 + X().autoGolden * 0.8));
    if (autoAcc < interval) return;
    autoAcc = 0;
    const g = T.goldens.slice().sort((a,b) => a.until - b.until)[0];
    if (g) {
      const result = clickGolden(g.uid);
      if (result) {
        if (typeof fx !== 'undefined' && fx.confetti) fx.confetti(g.x * innerWidth, g.y * innerHeight, 12);
        if (panelOpen) renderExpansion();
      }
    }
  }, 250);

  /* Security: a ban always wins. No special unlock or client-side mode bypass. */
  enforceBan = async function () {
    if (!authUser || IMP) return false;
    try {
      const b = await dbRequest('/bans/' + encodeURIComponent(authUser.uid) + '.json', { method: 'GET' });
      if (b && b.banned === true) {
        const reason = String(b.reason || 'No reason supplied').slice(0, 240);
        const bannedUid = authUser.uid;
        authUser = null;
        try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
        try { localStorage.removeItem('fk_session'); } catch (e) {}
        showAuthGate('PERMANENT BAN — This account is blocked. Reason: ' + reason + ' (Account: ' + bannedUid.slice(0, 10) + '…)');
        return true;
      }
      return false;
    } catch (e) {
      console.warn('[security] Ban status could not be verified:', e);
      return false;
    }
  };

  /* Faster ban checks, and immediately re-check after account restore/login. */
  const oldRestoreSession = restoreSession;
  if (typeof oldRestoreSession === 'function') {
    restoreSession = async function () {
      await oldRestoreSession();
      if (authUser && await enforceBan()) return;
    };
  }
  setInterval(() => { if (authUser && !IMP) enforceBan(); }, 5000);

  /* Score sanity checks: reject malformed, impossible-format and stale leaderboard entries. */
  const oldRefreshBoard = refreshBoard;
  refreshBoard = async function () {
    await oldRefreshBoard();
    if (!net || !Array.isArray(net.rows)) return;
    net.rows = net.rows.filter(r => r && typeof r.name === 'string' && r.name.length <= 16 &&
      r.vals && Object.values(r.vals).every(v => Number.isFinite(v) && v >= 0 && v <= LIMIT));
    net.cache = null;
    if (ui && ui.tab === 'board') ui.dirty = true;
  };

  /* Save/score publishing is throttled and refreshes the visible board after a successful write. */
  const oldSubmitScore = submitScore;
  let lastScoreSubmit = 0, scoreSubmitBusy = false;
  submitScore = async function () {
    if (!authUser || IMP || scoreSubmitBusy || Date.now() - lastScoreSubmit < 8000) return;
    scoreSubmitBusy = true;
    try {
      await oldSubmitScore();
      lastScoreSubmit = Date.now();
      await refreshBoard();
    } finally { scoreSubmitBusy = false; }
  };

  /* Persist new expansion state immediately after a prestige or major reward. */
  bus.on('prestige', () => { setTimeout(() => { recalc(); saveGame(); if (authUser) cloudSave(true); if (panelOpen) renderExpansion(); }, 100); });
  setInterval(() => {
    if (!S) return;
    if (panelOpen) renderExpansion();
  }, 5000);

  /* New save data is merged safely for older save files. */
  if (!S.expansion) S.expansion = { autoGolden:0, autoEnabled:true, goldenPower:0, reactor:0, rebirthCore:0, capBreaks:0 };
  recalc();
});

/* ---------- finish ---------- */
step('finish', () => {
  recalc();
  updateRank();
  ui.skinSig = '';
  ui.buffSig = '';
  ui.navSig = '';
  ui.dirty = true;
  console.log('[finn-patch] loaded' + (online() ? ' (online leaderboard on)' : ' (offline leaderboard)'));
});

})();

</script>
</body>
</html>
