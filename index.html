<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finn Kumar Incremental</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout concept: chunky cartoon sticker-sheet. A sticky Finn stage on the left, tabbed shop on the right.
   Thick ink outlines, hard offset shadows, saturated cobalt ground. One committed look, so a single theme. */
:root {
  --ink: #17133b;
  --ink-soft: #2a2466;
  --ground: #3b2ee0;
  --ground-deep: #2a1fb4;
  --paper: #f5f3ff;
  --paper-2: #e6e2ff;
  --paper-3: #d3ccff;
  --muted: #6a63a8;
  --sun: #ffd43b;
  --sun-deep: #e8a900;
  --pink: #ff5c9d;
  --mint: #25d9a2;
  --sky: #4cc9ff;
  --orange: #ff9a3c;
  --danger: #ff4d5e;
  --line: 3px solid var(--ink);
  --shadow: 5px 5px 0 var(--ink);
  --shadow-sm: 3px 3px 0 var(--ink);
  --radius: 16px;
  --radius-sm: 10px;
  --font-display: "Lilita One", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r-common: #9aa3c7;
  --r-uncommon: #3ccf7a;
  --r-rare: #3d9bff;
  --r-epic: #b05cff;
  --r-legendary: #ffb21e;
  --r-mythic: #ff4f86;
  --r-secret: #17133b;
  color-scheme: light;
}

* { box-sizing: border-box; }

html, body { height: auto; }

body {
  margin: 0;
  background-color: var(--ground);
  background-image:
    radial-gradient(circle at 20% 10%, rgba(255, 255, 255, 0.10) 0, rgba(255, 255, 255, 0) 38%),
    radial-gradient(var(--ground-deep) 2px, transparent 2.5px);
  background-size: auto, 26px 26px;
  color: var(--ink);
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 15px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  overflow-x: hidden;
}

body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--ink);
  z-index: 30;
}

button { font-family: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible, .finn-btn:focus-visible {
  outline: 3px solid var(--sun);
  outline-offset: 2px;
}

.muted { color: var(--muted); }
.mono { font-family: var(--font-mono); font-weight: 500; }
.hidden { display: none !important; }
.grow { flex: 1 1 auto; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- App shell ---------- */
.app {
  max-width: 1320px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}

/* ---------- Top bar ---------- */
.topbar {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 20;
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background: var(--ink);
  color: var(--paper);
  border-bottom: 4px solid var(--sun);
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: 16px;
}

.brand {
  font-family: var(--font-display);
  font-size: 22px;
  line-height: 1;
  letter-spacing: 0.02em;
  color: var(--sun);
  text-transform: uppercase;
}
.brand small {
  display: block;
  font-family: var(--font-body);
  font-size: 11px;
  letter-spacing: 0.18em;
  color: var(--paper-3);
  margin-top: 3px;
}

.bank { text-align: center; min-width: 0; }
.bank-num {
  font-family: var(--font-display);
  font-size: clamp(26px, 4.2vw, 44px);
  line-height: 1;
  color: var(--paper);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
.bank-label { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--sun); margin-top: 2px; }
.bank-rate { font-family: var(--font-mono); font-size: 13px; color: var(--mint); margin-top: 2px; }

.top-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 2px solid var(--paper-3);
  background: var(--ink-soft);
  color: var(--paper);
  font-size: 12px;
  font-weight: 800;
  cursor: pointer;
  display: grid;
  place-items: center;
  transition: transform 0.08s ease, background 0.12s ease;
}
.icon-btn:hover { background: var(--ground); }
.icon-btn:active { transform: translateY(2px); }
.icon-btn.off { opacity: 0.55; text-decoration: line-through; }

/* ---------- News ticker ---------- */
.ticker {
  margin-top: 14px;
  background: var(--sun);
  border: var(--line);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-sm);
  padding: 7px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 38px;
}
.ticker-tag {
  flex: none;
  background: var(--ink);
  color: var(--sun);
  font-family: var(--font-display);
  font-size: 12px;
  letter-spacing: 0.1em;
  padding: 3px 8px;
  border-radius: 6px;
}
.ticker-text { min-width: 0; font-size: 14px; animation: tickIn 0.5s ease both; }
@keyframes tickIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Main layout ---------- */
.layout {
  margin-top: 18px;
  display: grid;
  grid-template-columns: minmax(300px, 380px) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}

.panel {
  background: var(--paper);
  border: var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 14px;
  min-width: 0;
}
.panel-title {
  font-family: var(--font-display);
  font-size: 20px;
  margin: 0 0 8px;
  letter-spacing: 0.01em;
}
.panel-sub { margin: 0 0 12px; color: var(--muted); font-size: 13px; }

/* ---------- Stage (left) ---------- */
.stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 96px); display: flex; flex-direction: column; gap: 14px; min-width: 0; }

.finn-stage {
  position: relative;
  background: var(--paper);
  border: var(--line);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 14px 14px 16px;
  text-align: center;
  overflow: hidden;
}
.finn-stage::before {
  content: "";
  position: absolute;
  inset: 0;
  background: repeating-conic-gradient(from 0deg at 50% 46%, var(--aura-a, rgba(255, 212, 59, 0.22)) 0deg 10deg, transparent 10deg 20deg);
  opacity: var(--aura-o, 0.55);
  animation: spinSlow 60s linear infinite;
  pointer-events: none;
}
@keyframes spinSlow { to { transform: rotate(360deg); } }

.finn-wrap {
  position: relative;
  width: min(100%, 270px);
  aspect-ratio: 1 / 1;
  margin: 4px auto 0;
}
.finn-btn {
  position: relative;
  width: 100%;
  height: 100%;
  border: 0;
  padding: 0;
  background: transparent;
  cursor: pointer;
  border-radius: 50%;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  transition: transform 0.07s ease;
}
.finn-btn:active, .finn-btn.squish { transform: scale(0.93, 0.89); }
.finn-btn svg { width: 100%; height: 100%; overflow: visible; display: block; pointer-events: none; }
.finn-btn.hype svg { animation: wobble 0.5s ease-in-out infinite alternate; }
@keyframes wobble { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }

.finn-name {
  position: relative;
  margin-top: 8px;
  font-family: var(--font-display);
  font-size: 22px;
  line-height: 1.1;
}
.finn-title { position: relative; font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

.click-info { position: relative; display: flex; justify-content: center; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  background: var(--paper-2);
  border: 2px solid var(--ink);
  border-radius: 999px;
  padding: 2px 10px;
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}
.pill.sun { background: var(--sun); }
.pill.mint { background: var(--mint); }
.pill.pink { background: var(--pink); color: #fff; }
.pill.sky { background: var(--sky); }

.combo { position: relative; margin-top: 12px; }
.combo-label { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 4px; }
.combo-bar { height: 16px; border: 2px solid var(--ink); border-radius: 999px; background: var(--paper-3); overflow: hidden; }
.combo-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--mint), var(--sun), var(--pink));
  border-right: 2px solid var(--ink);
  transition: width 0.08s linear;
}

.buffs { display: flex; flex-wrap: wrap; gap: 6px; min-height: 0; }
.buff-chip {
  position: relative;
  background: var(--pink);
  color: #fff;
  border: 2px solid var(--ink);
  border-radius: 10px;
  padding: 3px 9px 3px 9px;
  font-size: 12px;
  box-shadow: 2px 2px 0 var(--ink);
  animation: pop 0.25s ease both;
}
.buff-chip.sunny { background: var(--sun); color: var(--ink); }
.buff-chip.cool { background: var(--sky); color: var(--ink); }
.buff-chip .t { font-family: var(--font-mono); margin-left: 6px; font-weight: 500; }
@keyframes pop { from { transform: scale(0.6); opacity: 0; } to { transform: none; opacity: 1; } }

.quick-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.qs {
  background: var(--paper-2);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 6px 10px;
  min-width: 0;
}
.qs span { display: block; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.qs b { font-family: var(--font-display); font-weight: 400; font-size: 18px; overflow-wrap: anywhere; }

/* ---------- Buttons ---------- */
.btn {
  appearance: none;
  border: var(--line);
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-display);
  font-weight: 400;
  font-size: 16px;
  letter-spacing: 0.02em;
  border-radius: 12px;
  padding: 7px 14px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.07s ease, box-shadow 0.07s ease, filter 0.12s ease;
}
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: 1px 1px 0 var(--ink); }
.btn-sun { background: var(--sun); }
.btn-mint { background: var(--mint); }
.btn-pink { background: var(--pink); color: #fff; }
.btn-sky { background: var(--sky); }
.btn-ink { background: var(--ink); color: var(--sun); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-sm { font-size: 13px; padding: 4px 10px; border-width: 2px; border-radius: 9px; box-shadow: 2px 2px 0 var(--ink); }
.btn-block { width: 100%; }

/* ---------- Tabs ---------- */
.content { min-width: 0; display: flex; flex-direction: column; gap: 14px; }
.tabs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding: 2px 4px 8px 2px;
  scrollbar-width: thin;
}
.tab-btn {
  flex: none;
  appearance: none;
  border: var(--line);
  background: var(--paper-2);
  font-family: var(--font-display);
  font-size: 16px;
  padding: 7px 14px;
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  position: relative;
  transition: transform 0.07s ease;
}
.tab-btn:hover { background: var(--paper); }
.tab-btn.active { background: var(--sun); transform: translateY(-2px); }
.tab-badge {
  position: absolute;
  top: -9px;
  right: -7px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 999px;
  background: var(--pink);
  color: #fff;
  border: 2px solid var(--ink);
  font-family: var(--font-body);
  font-size: 11px;
  font-weight: 800;
  display: grid;
  place-items: center;
}
.tab-body { min-width: 0; display: flex; flex-direction: column; gap: 14px; }

/* ---------- Shop / generators ---------- */
.mode-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.mode-btn {
  appearance: none;
  border: 2px solid var(--ink);
  background: var(--paper-2);
  border-radius: 9px;
  padding: 3px 12px;
  font-family: var(--font-display);
  font-size: 15px;
  cursor: pointer;
}
.mode-btn.active { background: var(--ink); color: var(--sun); }

.gen-list { display: flex; flex-direction: column; gap: 10px; }
.gen-row {
  display: grid;
  grid-template-columns: 52px minmax(0, 1fr) auto;
  gap: 12px;
  align-items: center;
  background: var(--paper-2);
  border: var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
  transition: background 0.12s ease;
}
.gen-row.afford { background: #fff; }
.gen-row.locked { opacity: 0.7; filter: grayscale(0.7); }
.gen-icon {
  width: 52px;
  height: 52px;
  border-radius: 14px;
  border: 2px solid var(--ink);
  background: var(--paper-3);
  display: grid;
  place-items: center;
  font-size: 28px;
  position: relative;
}
.gen-count {
  position: absolute;
  right: -8px;
  bottom: -8px;
  background: var(--ink);
  color: var(--sun);
  border-radius: 999px;
  font-family: var(--font-display);
  font-size: 12px;
  padding: 1px 7px;
  min-width: 24px;
  text-align: center;
}
.gen-name { font-family: var(--font-display); font-size: 18px; line-height: 1.1; }
.gen-desc { font-size: 12px; color: var(--muted); margin-top: 1px; }
.gen-meta { font-family: var(--font-mono); font-size: 12px; margin-top: 3px; color: var(--ink-soft); overflow-wrap: anywhere; }
.gen-bar { margin-top: 6px; height: 8px; background: var(--paper-3); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.gen-bar-fill { height: 100%; width: 0; background: var(--mint); }
.gen-buy { min-width: 112px; text-align: center; }
.gen-buy small { display: block; font-family: var(--font-mono); font-size: 11px; font-weight: 500; margin-top: 2px; }

/* ---------- Upgrades ---------- */
.up-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.up-card {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  background: var(--paper-2);
  border: var(--line);
  border-radius: 14px;
  padding: 10px 12px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  transition: transform 0.07s ease;
  min-width: 0;
}
.up-card.afford { background: #fff; }
.up-card:hover.afford { transform: translateY(-2px); }
.up-card:active.afford { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.up-head { display: flex; align-items: center; gap: 8px; }
.up-icon { font-size: 22px; }
.up-name { font-family: var(--font-display); font-size: 16px; line-height: 1.1; }
.up-desc { font-size: 12.5px; color: var(--ink-soft); }
.up-cost { margin-top: auto; font-family: var(--font-mono); font-size: 13px; font-weight: 500; }
.up-tag { position: absolute; top: 8px; right: 8px; font-size: 10px; }
.owned-list { display: flex; flex-wrap: wrap; gap: 6px; }
.owned-chip { background: var(--paper-2); border: 2px solid var(--ink); border-radius: 999px; padding: 1px 9px; font-size: 12px; }

/* ---------- Pets ---------- */
.egg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.egg-card {
  background: var(--paper-2);
  border: var(--line);
  border-radius: 16px;
  padding: 12px;
  box-shadow: var(--shadow-sm);
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.egg-icon { font-size: 54px; line-height: 1; filter: drop-shadow(3px 3px 0 var(--ink)); }
.egg-name { font-family: var(--font-display); font-size: 18px; }
.egg-cost { font-family: var(--font-mono); font-size: 12px; }
.egg-odds { font-size: 11px; color: var(--muted); }
.egg-btns { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
.egg-card.shake .egg-icon { animation: shake 0.45s ease; }
@keyframes shake {
  0%, 100% { transform: rotate(0); }
  20% { transform: rotate(-14deg) scale(1.1); }
  40% { transform: rotate(12deg) scale(1.1); }
  60% { transform: rotate(-8deg); }
  80% { transform: rotate(6deg); }
}

.slots { display: flex; gap: 8px; flex-wrap: wrap; }
.slot {
  width: 74px;
  height: 84px;
  border: 3px dashed var(--ink-soft);
  border-radius: 14px;
  display: grid;
  place-items: center;
  text-align: center;
  background: var(--paper-2);
  font-size: 11px;
  color: var(--muted);
}
.slot.filled { border-style: solid; border-color: var(--ink); background: #fff; color: var(--ink); cursor: pointer; }
.slot.filled:hover { background: var(--paper-3); }

.pet-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.pet {
  position: relative;
  background: #fff;
  border: 3px solid var(--r-common);
  border-radius: 14px;
  padding: 6px 4px 5px;
  text-align: center;
  cursor: pointer;
  appearance: none;
  box-shadow: 2px 2px 0 var(--ink);
  transition: transform 0.07s ease;
}
.pet:hover { transform: translateY(-2px); }
.pet.equipped { background: var(--sun); }
.pet-emoji { font-size: 30px; line-height: 1.1; }
.pet-name { font-size: 10.5px; line-height: 1.1; min-height: 23px; display: block; }
.pet-pow { font-family: var(--font-mono); font-size: 10px; font-weight: 500; display: block; }
.pet-lvl {
  position: absolute;
  top: -8px;
  left: -6px;
  background: var(--ink);
  color: var(--sun);
  font-family: var(--font-display);
  font-size: 11px;
  border-radius: 8px;
  padding: 0 6px;
}
.r-common { border-color: var(--r-common); }
.r-uncommon { border-color: var(--r-uncommon); }
.r-rare { border-color: var(--r-rare); }
.r-epic { border-color: var(--r-epic); }
.r-legendary { border-color: var(--r-legendary); box-shadow: 2px 2px 0 var(--ink), 0 0 12px rgba(255, 178, 30, 0.8); }
.r-mythic { border-color: var(--r-mythic); box-shadow: 2px 2px 0 var(--ink), 0 0 14px rgba(255, 79, 134, 0.85); }
.r-secret { border-color: var(--r-secret); box-shadow: 2px 2px 0 var(--ink), 0 0 16px rgba(23, 19, 59, 0.9); animation: secretGlow 2s ease-in-out infinite alternate; }
@keyframes secretGlow { from { background: #fff; } to { background: var(--paper-3); } }
.rt-common { color: var(--r-common); }
.rt-uncommon { color: var(--r-uncommon); }
.rt-rare { color: var(--r-rare); }
.rt-epic { color: var(--r-epic); }
.rt-legendary { color: #d98e00; }
.rt-mythic { color: var(--r-mythic); }
.rt-secret { color: var(--ink); }

.dex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(62px, 1fr)); gap: 6px; }
.dex-item {
  border: 2px solid var(--ink);
  background: #fff;
  border-radius: 10px;
  text-align: center;
  padding: 4px 2px;
  font-size: 22px;
}
.dex-item.unknown { background: var(--paper-3); filter: grayscale(1) brightness(0.45); }

/* ---------- Prestige ---------- */
.pcard { display: flex; flex-direction: column; gap: 10px; }
.pcard-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pcard-title { font-family: var(--font-display); font-size: 24px; margin: 0; }
.pcard-desc { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.pcard-gain { font-family: var(--font-display); font-size: 28px; }
.pcard.locked { opacity: 0.65; }
.progress { height: 18px; background: var(--paper-3); border: 2px solid var(--ink); border-radius: 999px; overflow: hidden; }
.progress-fill { height: 100%; width: 0; background: var(--sun); border-right: 2px solid var(--ink); }
.progress-text { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }

.shop-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.shop-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: left;
  appearance: none;
  background: var(--paper-2);
  border: 3px solid var(--ink);
  border-radius: 14px;
  padding: 9px 12px;
  box-shadow: var(--shadow-sm);
  cursor: pointer;
  min-width: 0;
}
.shop-item.afford { background: #fff; }
.shop-item.maxed { background: var(--mint); cursor: default; }
.shop-item:active.afford { transform: translate(3px, 3px); box-shadow: 0 0 0 var(--ink); }
.shop-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.shop-name { font-family: var(--font-display); font-size: 16px; line-height: 1.1; }
.shop-lvl { font-family: var(--font-mono); font-size: 12px; font-weight: 500; white-space: nowrap; }
.shop-desc { font-size: 12.5px; color: var(--ink-soft); }
.shop-cost { font-family: var(--font-mono); font-size: 12.5px; font-weight: 500; }

.tree { display: flex; flex-direction: column; gap: 14px; }
.branch-title { font-family: var(--font-display); font-size: 16px; margin: 0 0 6px; }
.branch-row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
.node {
  position: relative;
  flex: 1 1 180px;
  max-width: 260px;
  appearance: none;
  text-align: left;
  background: var(--paper-2);
  border: 3px solid var(--ink);
  border-radius: 14px;
  padding: 8px 10px;
  cursor: pointer;
  box-shadow: var(--shadow-sm);
}
.node::after {

  right: -11px;
  top: 50%;
  width: 11px;
  height: 4px;
  background: var(--ink);
  transform: translateY(-50%);
}
.node:last-child::after { display: none; }
.node.owned { background: var(--mint); cursor: default; }
.node.avail.afford { background: #fff; }
.node.locked { opacity: 0.55; cursor: not-allowed; }
.node-name { font-family: var(--font-display); font-size: 15px; line-height: 1.1; }
.node-desc { font-size: 12px; margin: 2px 0; color: var(--ink-soft); }
.node-cost { font-family: var(--font-mono); font-size: 12px; font-weight: 500; }

/* ---------- Quests & achievements ---------- */
.quest-list { display: flex; flex-direction: column; gap: 10px; }
.quest {

  grid-template-columns: minmax(0, 1fr) auto;

}
.quest.done { background: var(--mint); }
.quest-title { font-family: var(--font-display); font-size: 17px; line-height: 1.15; }
.quest-reward { font-size: 12px; color: var(--ink-soft); }
.quest .progress { grid-column: 1 / -1; height: 14px; }

.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.ach {
  display: flex;
  gap: 8px;
  align-items: center;
  background: var(--paper-3);
  border: 2px solid var(--ink);
  border-radius: 12px;
  padding: 6px 8px;
  opacity: 0.6;
  min-width: 0;
}
.ach.got { background: var(--sun); opacity: 1; }
.ach-badge { font-size: 22px; flex: none; }
.ach-name { font-family: var(--font-display); font-size: 14px; line-height: 1.1; }
.ach-desc { font-size: 11px; color: var(--ink-soft); line-height: 1.2; }

/* ---------- Mini games ---------- */
.fun-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; }
.wheel-wrap { position: relative; width: min(100%, 260px); margin: 6px auto; aspect-ratio: 1 / 1; }
.wheel {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 4px solid var(--ink);
  box-shadow: var(--shadow-sm);
  transition: transform 4.2s cubic-bezier(0.12, 0.7, 0.1, 1);
  position: relative;
  overflow: hidden;
}
.wheel-label {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 46%;
  transform-origin: 0 0;
  font-family: var(--font-display);
  font-size: 11px;
  text-align: right;
  color: var(--ink);
  padding-right: 6px;
  line-height: 1;
  pointer-events: none;
}
.wheel-hub {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 52px;
  height: 52px;
  margin: -26px 0 0 -26px;
  background: var(--ink);
  border: 3px solid var(--sun);
  border-radius: 50%;
}
.wheel-pointer {
  position: absolute;
  left: 50%;
  top: -10px;
  margin-left: -13px;
  width: 0;
  height: 0;
  border-left: 13px solid transparent;
  border-right: 13px solid transparent;
  border-top: 26px solid var(--danger);

}

.arena {

}
.target {
  position: absolute;

  height: 54px;

  border: 3px solid var(--ink);

  font-size: 26px;

  place-items: center;

  padding: 0;

}
.target.gold { background: var(--pink); }

.arena-hud { display: flex; justify-content: space-between; font-family: var(--font-display); font-size: 17px; margin-bottom: 6px; }

.slot-machine { display: flex; justify-content: center; gap: 8px; margin: 8px 0; }
.reel {

}
.reel.spin { animation: reelSpin 0.12s linear infinite; }
@keyframes reelSpin { from { transform: translateY(-4px); } to { transform: translateY(4px); } }
.bet-row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
.result-line { text-align: center; min-height: 22px; font-family: var(--font-display); font-size: 16px; }

/* ---------- Stats & settings ---------- */
.stats-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.stats-table td { padding: 5px 4px; border-bottom: 2px dashed var(--paper-3); vertical-align: top; }
.stats-table td:last-child { text-align: right; font-family: var(--font-mono); font-weight: 500; overflow-wrap: anywhere; }

.setting-row {
  display: flex;

}
.setting-row:last-child { border-bottom: 0; }
.setting-name { font-family: var(--font-display); font-size: 16px; }
.setting-desc { font-size: 12px; color: var(--muted); }
.switch {
  appearance: none;
  position: relative;
  width: 54px;
  height: 30px;
  border-radius: 999px;
  border: 3px solid var(--ink);
  background: var(--paper-3);
  cursor: pointer;
  transition: background 0.15s ease;
  flex: none;
}
.switch::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 18px;
  height: 18px;
  border-radius: 50%;

}
.switch:checked { background: var(--mint); }

.select, .input, .textarea {
  font-family: var(--font-body);

.textarea { width: 100%; min-height: 84px; font-family: var(--font-mono); font-size: 12px; font-weight: 500; resize: vertical; }
.input-sm { width: 110px; }

/* ---------- Modal / toast / fx ---------- */
.modal-back {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(23, 19, 59, 0.72);
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px 16px;

}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  width: min(100%, 480px);
  max-height: 88vh;
  overflow-y: auto;
  background: var(--paper);
  border: var(--line);

}
.modal h3 { font-family: var(--font-display); font-weight: 400; font-size: 26px; margin: 0 0 8px; }

.modal ul { margin: 0 0 10px; padding-left: 20px; }

.toasts {
  position: fixed;
  top: calc(env(safe-area-inset-top, 0px) + 72px);
  right: max(12px, env(safe-area-inset-right, 0px));

  display: flex;
  flex-direction: column;
  gap: 8px;
  width: min(320px, calc(100vw - 24px));

}
.toast {
  background: var(--paper);
  border: var(--line);
  border-radius: 12px;
  box-shadow: var(--shadow-sm);
  padding: 8px 12px;
  font-size: 13.5px;

}
.toast b { font-family: var(--font-display); font-weight: 400; font-size: 15px; display: block; }
.toast.good { background: var(--mint); }
.toast.gold { background: var(--sun); }
.toast.bad { background: var(--danger); color: #fff; }
.toast.out { animation: toastOut 0.3s ease both; }
@keyframes toastIn { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes toastOut { to { transform: translateX(40px); opacity: 0; } }

.fx-layer { position: fixed; inset: 0; pointer-events: none; z-index: 50; overflow: hidden; }
.float-num {
  position: absolute;
  font-family: var(--font-display);
  font-size: 22px;
  color: var(--sun);
  -webkit-text-stroke: 1px var(--ink);
  paint-order: stroke fill;
  text-shadow: 2px 2px 0 var(--ink);
  white-space: nowrap;
  animation: floatUp 1.1s ease-out both;
}
.float-num.crit { font-size: 32px; color: var(--pink); }
.float-num.small { font-size: 16px; color: #fff; }
@keyframes floatUp {
  from { transform: translate(-50%, 0) scale(0.7); opacity: 1; }

  to { transform: translate(-50%, -90px) scale(1); opacity: 0; }
}
.confetti {
  position: absolute;

  height: 14px;

}
@keyframes confettiFall {

}

.golden {
  position: fixed;
  z-index: 60;
  width: 78px;
  height: 78px;
  margin: -39px 0 0 -39px;
  border: 4px solid var(--ink);

  animation: goldenBob 1.1s ease-in-out infinite alternate, pop 0.3s ease both;
}
.golden.mini { width: 54px; height: 54px; margin: -27px 0 0 -27px; font-size: 11px; }
@keyframes goldenBob { from { transform: translateY(-6px) rotate(-6deg); } to { transform: translateY(6px) rotate(6deg); } }

/* ---------- Responsive ---------- */
@media (max-width: 900px) {
  .layout { grid-template-columns: minmax(0, 1fr); }

  .brand { display: none; }
}

@media (max-width: 560px) {
  .quick-stats { grid-template-columns: 1fr 1fr; }
  .gen-row { grid-template-columns: 44px minmax(0, 1fr); }

  .gen-buy { grid-column: 1 / -1; width: 100%; }
  .up-grid, .shop-grid { grid-template-columns: minmax(0, 1fr); }
  .tab-btn { font-size: 15px; padding: 6px 11px; }
  .bank-num { font-size: 28px; }
  .node { max-width: none; flex-basis: 100%; }
  .node::after { display: none; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }

}

/* ---------- Finn avatar blink + misc ---------- */
.finn-eye { transform-box: fill-box; transform-origin: center; animation: blink 4.6s infinite; }
@keyframes blink {
  0%, 93%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.1); }
}
.panel > .panel-title:first-child { margin-top: 0; }
.panel .btn-block { margin-top: 4px; }
.shop-item:disabled { opacity: 0.5; cursor: not-allowed; }
.egg-card .btn:disabled, .btn[data-btn]:disabled { cursor: not-allowed; }
.pet-grid .pet, .slots .slot { font-family: var(--font-body); color: var(--ink); }

.hint-line { color: var(--muted); font-size: 12px; }

/* ---------- Divine rarity (code pet) ---------- */
.r-divine { border-color: #ff2fa0; background: linear-gradient(135deg, #fff3b0, #ffd0ec, #c9f4ff); box-shadow: 2px 2px 0 var(--ink), 0 0 18px rgba(255, 47, 160, 0.9); animation: divineGlow 1.4s ease-in-out infinite alternate; }

@keyframes divineGlow { from { box-shadow: 2px 2px 0 var(--ink), 0 0 10px rgba(255, 47, 160, 0.7); } to { box-shadow: 2px 2px 0 var(--ink), 0 0 26px rgba(255, 212, 59, 1); } }

/* ---------- Kumar eggs, missions, board ---------- */
.kumar-boost { position: relative; margin: 6px auto 0; max-width: 300px; font-size: 12px; color: var(--ink-soft); line-height: 1.3; }
.kumar-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.kumar-card {

.kumar-egg { width: min(100%, 130px); aspect-ratio: 1 / 1; align-self: center; }
.kumar-egg svg { width: 100%; height: 100%; display: block; overflow: visible; }
.kumar-name { font-family: var(--font-display); font-size: 20px; line-height: 1.1; text-align: center; }
.kumar-title { text-align: center; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.kumar-card.active .kumar-title { color: var(--ink-soft); }
.kumar-desc { font-size: 12.5px; color: var(--ink-soft); }

.lb { display: flex; flex-direction: column; gap: 6px; }
.lb-row {
  display: grid;
  grid-template-columns: 44px minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  background: var(--paper-2);

  border-radius: 12px;

}
.lb-row.you { background: var(--sun); border-width: 3px; box-shadow: var(--shadow-sm); }
.lb-row.top1 { background: #fff0a8; }
.lb-rank { font-family: var(--font-display); font-size: 17px; text-align: center; }
.lb-name { font-family: var(--font-display); font-size: 16px; min-width: 0; overflow-wrap: anywhere; }
.lb-icon { margin-right: 8px; }
.lb-val { font-size: 13px; text-align: right; }

@media (max-width: 900px) {
  .quick-stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 560px) {
  .quick-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .lb-row { grid-template-columns: 38px minmax(0, 1fr); }
  .lb-val { grid-column: 2; text-align: left; }
}

<script>
"use strict";
/* =====================================================================
   FINN KUMAR INCREMENTAL - game engine (no DOM access in this file)
   State, formulas, buying, prestige, pets, quests, saving.
   ===================================================================== */

var S = null;                 /* persistent game state */
const calc = {};              /* derived numbers, rebuilt by recalc() */
const T = {                   /* transient, never saved */
  last: Date.now(),
  combo: 0,
  lastClick: 0,
  autoClickAcc: 0,
  autoBuyAcc: 0,
  achAcc: 0,
  saveAcc: 0,
  questAcc: 0,
  goldenAt: 0,
  goldens: [],
  stormLeft: 0,
  stormNextAt: 0,
  goldenSeq: 1,
  ready: false,
  rankMult: 1,
  rank: 0,
  lastRank: 0,
  rankAcc: 0,
  kumAcc: 0,
  rAutoBuyAcc: 0,
  rAutoUpAcc: 0,
  boardCache: {}
};

const LIMIT = 1e300;
const REBIRTH_MIN = 5e8;
const TRANSCEND_MIN_RT = 100;
const ASCEND_MIN_SHARDS = 40;
const MAX_OFFLINE_DT = 120;   /* seconds a single tick may cover at full speed */

/* ---------- Tiny event bus ---------- */
const bus = {
  h: {},
  on(evt, fn) { (this.h[evt] = this.h[evt] || []).push(fn); },
  emit(evt, a, b, c) {
    const list = this.h[evt];
    if (!list) return;
    for (let i = 0; i < list.length; i++) {
      try { list[i](a, b, c); } catch (err) { console.error('[bus:' + evt + ']', err); }
    }
  }
};

/* ---------- Utilities ---------- */
function clamp(x, lo, hi) { return Math.max(lo, Math.min(hi, x)); }
function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
function randInt(lo, hi) { return Math.floor(rand(lo, hi + 1)); }
function pickOne(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

function pickWeighted(items, weightOf) {
  let total = 0;
  for (let i = 0; i < items.length; i++) total += weightOf(items[i]);
  let r = Math.random() * total;
  for (let i = 0; i < items.length; i++) {
    r -= weightOf(items[i]);
    if (r <= 0) return items[i];
  }
  return items[items.length - 1];
}

function isPlainObject(x) { return x !== null && typeof x === 'object' && !Array.isArray(x); }

function mergeState(base, saved) {
  for (const key in saved) {
    if (!Object.prototype.hasOwnProperty.call(saved, key)) continue;
    const sv = saved[key];
    if (isPlainObject(sv) && isPlainObject(base[key])) mergeState(base[key], sv);
    else if (sv !== undefined && sv !== null) base[key] = sv;
  }
  return base;
}

/* ---------- Number formatting ---------- */
const SUFFIXES = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc', 'No', 'Dc', 'Ud', 'Dd', 'Td', 'Qad', 'Qid', 'Sxd', 'Spd', 'Ocd', 'Nod', 'Vg', 'Uvg', 'Dvg', 'Tvg', 'Qavg', 'Qivg', 'Sxvg', 'Spvg', 'Ocvg', 'Novg', 'Tg'];

function trimZeros(str) {
  if (str.indexOf('.') === -1) return str;
  return str.replace(/\.?0+$/, '');
}

function fmt(n) {
  if (typeof n !== 'number' || isNaN(n)) return '0';
  if (!isFinite(n)) return n > 0 ? 'Infinity' : '-Infinity';
  if (n === 0) return '0';
  if (n < 0) return '-' + fmt(-n);
  const mode = (S && S.settings && S.settings.notation) || 'suffix';
  if (n < 1000) {
    if (n < 0.01) return n.toExponential(1).replace('e-', 'e-');
    if (n < 10) return trimZeros(n.toFixed(2));
    if (n < 100) return trimZeros(n.toFixed(1));
    return String(Math.floor(n));
  }
  const exp = Math.floor(Math.log10(n));
  if (mode === 'sci' || (mode === 'suffix' && Math.floor(exp / 3) >= SUFFIXES.length)) {
    if (n < 1e6 && mode === 'sci') return Math.floor(n).toLocaleString('en-US');
    let m = n / Math.pow(10, exp);
    let e = exp;
    if (m.toFixed(2) === '10.00') { m = 1; e += 1; }
    return m.toFixed(2) + 'e' + e;
  }
  if (mode === 'eng') {
    const e3 = Math.floor(exp / 3) * 3;
    if (e3 === 0) return String(Math.floor(n));
    const m = n / Math.pow(10, e3);
    return m.toFixed(m < 10 ? 2 : m < 100 ? 1 : 0) + 'e' + e3;
  }
  let tier = Math.floor(exp / 3);
  let mant = n / Math.pow(10, tier * 3);
  let s = mant.toFixed(mant < 10 ? 2 : mant < 100 ? 1 : 0);
  if (parseFloat(s) >= 1000 && tier + 1 < SUFFIXES.length) {
    tier += 1;
    mant = n / Math.pow(10, tier * 3);
    s = mant.toFixed(mant < 10 ? 2 : mant < 100 ? 1 : 0);
  }
  return s + SUFFIXES[tier];
}

function fmtInt(n) {
  if (n < 1e6) return Math.floor(n).toLocaleString('en-US');
  return fmt(n);
}

function fmtPct(x) {
  return trimZeros((x * 100).toFixed(x * 100 < 10 ? 1 : 0)) + '%';
}

function fmtTime(sec) {
  sec = Math.max(0, Math.floor(sec));
  if (sec < 60) return sec + 's';
  const m = Math.floor(sec / 60);
  if (sec < 3600) return m + 'm ' + (sec % 60) + 's';
  const h = Math.floor(sec / 3600);
  if (sec < 86400) return h + 'h ' + (m % 60) + 'm';
  const d = Math.floor(sec / 86400);
  return d + 'd ' + (h % 24) + 'h';
}

/* ---------- State ---------- */

    }
