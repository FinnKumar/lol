function lv(id) { return S.rtUp[id] || 0; }
function hasNode(id) { return !!S.shardNodes[id]; }
function crownLv(id) { return S.crownPerks[id] || 0; }

function achievementCount() { return Object.keys(S.achievements).length; }

function ownsRarity(r) {
  for (let i = 0; i < S.pets.length; i++) {
    if (PET_BY_ID[S.pets[i].id].rarity === r) return true;
  }
  return false;
}

/* ---------- Milestones ---------- */
function milestoneBase() { return hasNode('e4') ? 3 : 2; }

function milestoneMult(n) {
  const b = milestoneBase();
  let m = 1;
  for (let i = 0; i < MILESTONES.length; i++) {
    if (n >= MILESTONES[i]) m *= b; else break;
  }
  return m;
}

function nextMilestone(n) {
  for (let i = 0; i < MILESTONES.length; i++) if (n < MILESTONES[i]) return MILESTONES[i];
  return null;
}

function prevMilestone(n) {
  let p = 0;
  for (let i = 0; i < MILESTONES.length; i++) if (n >= MILESTONES[i]) p = MILESTONES[i];
  return p;
}

/* ---------- Derived numbers ---------- */
function petBaseValue(p) {
  return PET_BY_ID[p.id].power * PET_LEVEL_MULT[p.lvl] * petStarMult(p);
}

function recalc() {
  const c = calc;
  const now = Date.now();
  if (S.buffs.length) S.buffs = S.buffs.filter(b => b.until > now);

  let global = 1, clickAdd = 0, clickMult = 1, clickCps = 0, crit = 0.03, critMult = 5, comboBonus = 0;
  let goldFreq = 1, goldDur = 1, goldVal = 1, costMult = 1, upCost = 1, offline = 0.5, slots = 3, eggCost = 1;
  let petAmp = 1, luck = 0, rtGain = 1, offlineCapH = 8;
  const genMult = {};
  GENS.forEach(g => { genMult[g.id] = 1; });

  /* purchased upgrades */
  for (const id in S.upgrades) {
    const u = UP_BY_ID[id];
    if (!u) continue;
    const e = u.effect;
    switch (e.type) {
      case 'gen': genMult[e.gen] *= e.mult; break;
      case 'clickAdd': clickAdd += e.add; break;
      case 'clickMult': clickMult *= e.mult; break;
      case 'clickCps': clickCps += e.pct; break;
      case 'global': global *= e.mult; break;
      case 'crit': crit += e.add; break;
      case 'critMult': critMult += e.add; break;
      case 'combo': comboBonus += e.add; break;
      case 'goldFreq': goldFreq *= e.mult; break;
      case 'goldDur': goldDur *= e.mult; break;
      case 'goldVal': goldVal *= e.mult; break;
      case 'cost': costMult *= e.mult; break;
      case 'offline': offline += e.add; break;
      case 'slots': slots += e.add; break;
      case 'eggCost': eggCost *= e.mult; break;
      case 'synergy': genMult[e.to] *= 1 + e.per * (S.gens[e.from] || 0); break;
      default: break;
    }
  }

  /* rebirth shop */
  clickMult *= 1 + 0.5 * lv('clickkarma');
  costMult *= Math.max(0.5, 1 - 0.02 * lv('discount'));
  goldFreq *= 1 + 0.1 * lv('golden');
  goldDur *= 1 + 0.05 * lv('golden');
  slots += lv('petslots');
  eggCost *= Math.max(0.5, 1 - 0.05 * lv('eggdisc'));
  offline += 0.1 * lv('offline');
  upCost *= Math.max(0.4, 1 - 0.04 * lv('upgdisc'));
  rtGain *= 1 + 0.1 * lv('rtgain');

  /* shard tree */
  let nodePower = 1;
  if (hasNode('p1')) nodePower *= 2;
  if (hasNode('p2')) nodePower *= 3;
  if (hasNode('p3')) nodePower *= 5;
  if (hasNode('p4')) nodePower *= 10;
  if (hasNode('c1')) clickMult *= 5;
  if (hasNode('c2')) { crit += 0.10; critMult += 5; }
  if (hasNode('c3')) comboBonus += 1;
  if (hasNode('c4')) clickCps += 0.10;
  if (hasNode('l1')) goldFreq *= 1.5;
  if (hasNode('l2')) goldVal *= 2;
  if (hasNode('l3')) goldDur *= 2;
  if (hasNode('k1')) petAmp *= 2;
  if (hasNode('k2')) luck += 0.5;
  if (hasNode('k3')) slots += 2;
  if (hasNode('k4')) eggCost *= 0.7;
  if (hasNode('e1')) costMult *= 0.9;
  if (hasNode('e2')) upCost *= 0.5;
  if (hasNode('e3')) rtGain *= 1.5;
  if (hasNode('a3')) { offline += 0.5; offlineCapH *= 2; }

  /* crown perks */
  const crownPower = Math.pow(2, crownLv('cpower'));
  petAmp *= Math.pow(1.5, crownLv('cwonder'));
  offlineCapH += 4 * crownLv('ctime');
  goldFreq *= 1 + 0.15 * crownLv('cfortune');
  rtGain *= 1 + 0.5 * crownLv('ckarma');

  /* Kumar characters and research lab */
  const ke = kumarEffects();
  c.kumarFx = ke;
  c.kumarCollect = 1 + 0.05 * Math.max(0, Object.keys(S.kumarsUnlocked).length - 1);
  clickMult *= ke.click * (1 + 0.2 * rl('rclick'));
  crit += ke.crit;
  comboBonus += ke.combo;
  goldFreq *= ke.goldFreq * (1 + 0.12 * rl('rgolden'));
  goldVal *= ke.goldVal;
  petAmp *= ke.pet;
  costMult *= ke.cost * Math.max(0.5, 1 - 0.02 * rl('rcost'));
  upCost *= Math.max(0.4, 1 - 0.03 * rl('rupg'));
  eggCost *= Math.max(0.5, 1 - 0.04 * rl('regg'));
  offline += ke.offline + 0.06 * rl('roff');
  global *= ke.prod * c.kumarCollect * (T.rankMult || 1) * (1 + 0.12 * rl('rprod'));
  c.rpInterval = Math.max(8, (60 - 4 * rl('rinterval')) / ke.rp);
  c.rpPerCycle = 1 + rl('rpoints');
  c.cooldownMult = Math.max(0.2, 1 - 0.08 * rl('rcooldown'));
  c.missionMult = Math.max(0.3, 1 - 0.07 * rl('rmission'));
  c.missionSlots = 2 + rl('rslots');
  c.autoBuyEvery = rl('rauto') > 0 ? 8 / rl('rauto') : 0;
  c.autoUpEvery = rl('rautoup') > 0 ? 12 / rl('rautoup') : 0;

  /* temporary buffs */
  let buffCps = 1, buffClick = 1, buffPet = 1;
  const buffGen = {};
  for (let i = 0; i < S.buffs.length; i++) {
    const b = S.buffs[i];
    if (b.kind === 'cps') buffCps *= b.mult;
    else if (b.kind === 'click') buffClick *= b.mult;
    else if (b.kind === 'cost') costMult *= b.mult;
    else if (b.kind === 'pet') buffPet *= b.mult;
    else if (b.kind === 'gen') buffGen[b.gen] = (buffGen[b.gen] || 1) * b.mult;
  }

  /* pets */
  let petCps = 0, petClick = 0, petGold = 0, petDisc = 0;
  for (let i = 0; i < S.equipped.length; i++) {
    const p = findPet(S.equipped[i]);
    if (!p) continue;
    const def = PET_BY_ID[p.id];
    const v = petBaseValue(p) * petAmp * buffPet;
    if (def.kind === 'cps') petCps += v;
    else if (def.kind === 'click') petClick += v;
    else if (def.kind === 'golden') petGold += v;
    else if (def.kind === 'discount') petDisc += v;
  }
  clickMult *= 1 + petClick;
  goldFreq *= 1 + petGold;
  costMult *= Math.max(0.5, 1 - petDisc);

  /* prestige multipliers */
  c.rtMult = (1 + 0.04 * S.rtTotal) * (1 + 0.3 * lv('kapital'));
  c.shardMult = (1 + 0.2 * S.shardsTotal) * nodePower;
  c.crownMult = (1 + 0.1 * S.crownsTotal) * crownPower;
  c.achMult = 1 + 0.01 * achievementCount();
  c.prestigeMult = c.rtMult * c.shardMult * c.crownMult;
  c.upgradeGlobal = global;
  c.petCpsMult = 1 + petCps;
  c.buffCps = buffCps;
  c.buffClick = buffClick;
  c.globalMult = global * c.achMult * c.prestigeMult * c.petCpsMult * buffCps;

  /* generators */
  let total = 0;
  if (!c.genCps) c.genCps = [];
  for (let i = 0; i < GENS.length; i++) {
    const g = GENS[i];
    const n = S.gens[g.id] || 0;
    const m = genMult[g.id] * milestoneMult(n) * (buffGen[g.id] || 1);
    c.genCps[i] = n * g.cps * m * c.globalMult;
    total += c.genCps[i];
  }
  c.genMult = genMult;
  c.buffGen = buffGen;
  c.cps = Math.min(total, LIMIT);
  if (c.cps > S.stats.bestCps) S.stats.bestCps = c.cps;

  /* clicking */
  c.clickBase = (1 + clickAdd) * clickMult * c.prestigeMult * c.achMult;
  c.clickCpsPct = clickCps;
  c.crit = Math.min(0.95, crit);
  c.critMult = critMult;
  c.comboBonus = comboBonus;

  /* misc */
  c.goldFreq = goldFreq;
  c.goldDur = goldDur;
  c.goldVal = goldVal;
  c.costMult = Math.max(0.05, costMult);
  c.upCostMult = Math.max(0.1, upCost);
  c.eggCostMult = Math.max(0.1, eggCost);
  c.offlineEff = Math.min(1, offline);
  c.offlineCapH = offlineCapH;
  c.slots = slots;
  c.petLuck = luck;
  c.rtGainMult = rtGain;
  c.petCps = petCps;
  c.petClick = petClick;
  c.petGold = petGold;
  c.petDisc = petDisc;
  c.petAmp = petAmp * buffPet;
}

/* ---------- Earning ---------- */
function addFk(n, source) {
  if (!(n > 0) || !isFinite(n)) return;
  S.fk = Math.min(LIMIT, S.fk + n);
  S.runEarned = Math.min(LIMIT, S.runEarned + n);
  S.lifeEarned = Math.min(LIMIT, S.lifeEarned + n);
  if (source === 'golden') S.stats.goldenEarned += n;
}

function spendFk(n) {
  S.fk = Math.max(0, S.fk - n);
  S.counters.spent += n;
}

function comboFactor() {
  return 1 + (T.combo / 100) * (1 + calc.comboBonus);
}

function clickValueNow(withCombo) {
  const base = calc.clickBase + calc.cps * calc.clickCpsPct;
  return base * (withCombo ? comboFactor() : 1) * calc.buffClick;
}

function doClick(auto) {
  let v = clickValueNow(!auto);
  let crit = false;
  if (Math.random() < calc.crit) {
    crit = true;
    v *= calc.critMult;
    if (!auto) S.counters.crits++;
  }
  addFk(v);
  if (!auto) {
    S.counters.clicks++;
    T.combo = Math.min(100, T.combo + 5);
    T.lastClick = Date.now();
    if (T.combo > S.counters.maxCombo) S.counters.maxCombo = Math.floor(T.combo);
  }
  if (v > S.stats.biggestClick) S.stats.biggestClick = v;
  return { value: v, crit: crit };
}

/* ---------- Generators ---------- */
function genUnitCost(i) {
  const g = GENS[i];
  return g.cost * Math.pow(GROWTH, S.gens[g.id]) * calc.costMult;
}

function genBulkCost(i, n) {
  const first = genUnitCost(i);
  return first * (Math.pow(GROWTH, n) - 1) / (GROWTH - 1);
}

function genMaxAfford(i, budget) {
  const first = genUnitCost(i);
  if (!isFinite(first) || first <= 0 || budget < first) return 0;
  let n = Math.floor(Math.log(1 + budget * (GROWTH - 1) / first) / Math.log(GROWTH));
  n = clamp(n, 0, 2000);
  while (n > 0 && genBulkCost(i, n) > budget) n--;
  return n;
}

function buyAmountFor(i) {
  const mode = S.settings.buyMode;
  if (mode === 0) return Math.max(1, genMaxAfford(i, S.fk));
  return mode;
}

function buyGen(i, n) {
  if (n < 1) return false;
  const cost = genBulkCost(i, n);
  if (!isFinite(cost) || S.fk < cost) return false;
  spendFk(cost);
  S.gens[GENS[i].id] += n;
  recalc();
  bus.emit('buyGen', i, n);
  return true;
}

function buyMaxAll() {
  let bought = 0;
  for (let i = GENS.length - 1; i >= 0; i--) {
    const n = genMaxAfford(i, S.fk);
    if (n > 0 && buyGen(i, n)) bought += n;
  }
  return bought;
}

function genVisible(i) {
  if (i === 0) return true;
  const g = GENS[i];
  return S.gens[g.id] > 0 || S.gens[GENS[i - 1].id] > 0 || S.runEarned >= g.cost * 0.4 || S.lifeEarned >= g.cost * 4;
}

/* ---------- Upgrades ---------- */
function checkUnlock(un) {
  if (!un) return true;
  if (un.earned !== undefined && S.runEarned < un.earned && S.lifeEarned < un.earned * 20) return false;
  if (un.gen && (S.gens[un.gen[0]] || 0) < un.gen[1]) return false;
  if (un.clicks !== undefined && S.counters.clicks < un.clicks) return false;
  if (un.rebirths !== undefined && S.rebirths < un.rebirths) return false;
  return true;
}

function upgradeCost(u) { return u.cost * calc.upCostMult; }
function upgradeAvailable(u) { return !S.upgrades[u.id] && checkUnlock(u.unlock); }

function availableUpgrades() {
  const list = [];
  for (let i = 0; i < UPGRADES.length; i++) if (upgradeAvailable(UPGRADES[i])) list.push(UPGRADES[i]);
  list.sort((a, b) => a.cost - b.cost);
  return list;
}

function buyUpgrade(id) {
  const u = UP_BY_ID[id];
  if (!u || S.upgrades[id] || !checkUnlock(u.unlock)) return false;
  const cost = upgradeCost(u);
  if (S.fk < cost) return false;
  spendFk(cost);
  S.upgrades[id] = 1;
  S.counters.upgrades++;
  recalc();
  bus.emit('buyUpgrade', u);
  return true;
}

function buyAllUpgrades() {
  let count = 0;
  let guard = 0;
  while (guard++ < 400) {
    const list = availableUpgrades();
    let did = false;
    for (let i = 0; i < list.length; i++) {
      if (S.fk >= upgradeCost(list[i]) && buyUpgrade(list[i].id)) { count++; did = true; break; }
    }
    if (!did) break;
  }
  return count;
}

/* ---------- Buffs ---------- */
function addBuff(buff, seconds) {
  const until = Date.now() + seconds * 1000;
  for (let i = 0; i < S.buffs.length; i++) {
    if (S.buffs[i].id === buff.id) {
      S.buffs[i].until = Math.max(S.buffs[i].until, until);
      S.buffs[i].total = seconds;
      recalc();
      bus.emit('buff', S.buffs[i]);
      return;
    }
  }
  const b = Object.assign({}, buff, { until: until, total: seconds });
  S.buffs.push(b);
  recalc();
  bus.emit('buff', b);
}

/* ---------- Golden Finns ---------- */
function goldenInterval() {
  return (70 + Math.random() * 80) / Math.max(0.2, calc.goldFreq);
}

function scheduleGolden() {
  T.goldenAt = Date.now() + goldenInterval() * 1000;
}

function spawnGolden(mini) {
  const g = {
    uid: T.goldenSeq++,
    mini: !!mini,
    x: rand(0.08, 0.92),
    y: rand(0.22, 0.85),
    until: Date.now() + (mini ? 6500 : 13000 * calc.goldDur)
  };
  T.goldens.push(g);
  bus.emit('goldenSpawn', g);
  return g;
}

function expireGoldens() {
  const now = Date.now();
  for (let i = T.goldens.length - 1; i >= 0; i--) {
    if (T.goldens[i].until <= now) {
      const g = T.goldens.splice(i, 1)[0];
      bus.emit('goldenEnd', g, false);
    }
  }
}

function pickGoldenEffect() {
  const pool = GOLDEN_EFFECTS.filter(e => {
    if (e.kind === 'blessing' && S.rebirths < 1) return false;
    if (e.kind === 'gen' && !GENS.some(g => S.gens[g.id] > 0)) return false;
    return true;
  });
  return pickWeighted(pool, e => e.weight);
}

function applyGoldenEffect(e) {
  const gv = calc.goldVal;
  const cps = calc.cps;
  const out = { name: e.name, text: e.desc };
  switch (e.kind) {
    case 'cps':
      addBuff({ id: 'frenzy', name: e.name, kind: 'cps', mult: e.mult, tone: 'sunny' }, e.dur * gv);
      break;
    case 'click':
      addBuff({ id: 'clickfrenzy', name: e.name, kind: 'click', mult: e.mult, tone: 'pink' }, e.dur * gv);
      break;
    case 'lucky': {
      const amt = (Math.min(S.fk * 0.15, cps * 900) + 13) * gv;
      addFk(amt, 'golden');
      out.text = '+' + fmt(amt) + ' Finn Kumar';
      break;
    }
    case 'gen': {
      const owned = GENS.filter(g => S.gens[g.id] > 0);
      const g = pickOne(owned);
      addBuff({ id: 'special_' + g.id, name: g.name + ' Special', kind: 'gen', gen: g.id, mult: e.mult, tone: 'cool' }, e.dur * gv);
      out.text = g.plural + ' produce x' + e.mult;
      break;
    }
    case 'storm':
      T.stormLeft = 10;
      T.stormNextAt = Date.now() + 300;
      break;
    case 'cost':
      addBuff({ id: 'sale', name: e.name, kind: 'cost', mult: e.mult, tone: 'cool' }, e.dur * gv);
      break;
    case 'pet':
      addBuff({ id: 'petparty', name: e.name, kind: 'pet', mult: e.mult, tone: 'pink' }, e.dur * gv);
      break;
    case 'skip': {
      const amt = cps * 300 * gv + 13;
      addFk(amt, 'golden');
      out.text = '+' + fmt(amt) + ' Finn Kumar';
      break;
    }
    case 'blessing':
      S.rt += 1; S.rtTotal += 1; S.rtRun += 1;
      recalc();
      out.text = '+1 Rebirth Token';
      break;
    default: break;
  }
  return out;
}

function clickGolden(uid) {
  const idx = T.goldens.findIndex(g => g.uid === uid);
  if (idx < 0) return null;
  const g = T.goldens.splice(idx, 1)[0];
  S.counters.goldens++;
  let result;
  if (g.mini) {
    const amt = (calc.cps * 45 + 13) * calc.goldVal;
    addFk(amt, 'golden');
    result = { name: 'Mini Finn', text: '+' + fmt(amt) + ' Finn Kumar', mini: true };
  } else {
    result = applyGoldenEffect(pickGoldenEffect());
  }
  bus.emit('goldenEnd', g, true);
  bus.emit('goldenClick', result, g);
  return result;
}

function updateGoldens(now) {
  if (!T.goldenAt) scheduleGolden();
  expireGoldens();
  if (T.stormLeft > 0 && now >= T.stormNextAt) {
    T.stormLeft--;
    T.stormNextAt = now + 380;
    spawnGolden(true);
  }
  const hasBig = T.goldens.some(g => !g.mini);
  if (!hasBig && T.stormLeft === 0 && now >= T.goldenAt) {
    spawnGolden(false);
    scheduleGolden();
  }
}

/* ---------- Pets ---------- */
function findPet(uid) {
  for (let i = 0; i < S.pets.length; i++) if (S.pets[i].u === uid) return S.pets[i];
  return null;
}

function eggCostFor(egg) {
  if (egg.currency === 'rt') return Math.max(1, Math.ceil(egg.cost * calc.eggCostMult));
  return egg.cost * calc.eggCostMult;
}

function eggVisible(egg) {
  if (egg.currency === 'rt') return S.rebirths >= 1;
  return S.lifeEarned >= egg.cost * 0.1 || S.runEarned >= egg.cost * 0.02;
}

function eggBalance(egg) { return egg.currency === 'rt' ? S.rt : S.fk; }

function eggOdds(egg) {
  const pool = egg.pool.map(id => PET_BY_ID[id]);
  const w = pool.map(p => RARITIES[p.rarity].weight * (RARITIES[p.rarity].luck ? 1 + calc.petLuck : 1));
  const total = w.reduce((a, b) => a + b, 0);
  const byRarity = {};
  pool.forEach((p, i) => { byRarity[p.rarity] = (byRarity[p.rarity] || 0) + w[i] / total; });
  return byRarity;
}

function rollPet(egg) {
  const pool = egg.pool.map(id => PET_BY_ID[id]);
  return pickWeighted(pool, p => RARITIES[p.rarity].weight * (RARITIES[p.rarity].luck ? 1 + calc.petLuck : 1));
}

function addPet(def) {
  const pet = { u: S.petUid++, id: def.id, lvl: 0 };
  S.pets.push(pet);
  S.petDex[def.id] = 1;
  if (S.equipped.length < calc.slots) S.equipped.push(pet.u);
  return pet;
}

function hatchCount(egg) { return { n1: 1, n5: 5, n25: hasNode('k4') ? 25 : 0 }; }

function hatchEgg(eggId, count, free) {
  const egg = EGG_BY_ID[eggId];
  if (!egg) return [];
  const results = [];
  for (let i = 0; i < count; i++) {
    if (S.pets.length >= PET_INVENTORY_CAP) { bus.emit('toast', { title: 'Pet inventory full', text: 'Merge or release some pets first.', tone: 'bad' }); break; }
    if (!free) {
      const cost = eggCostFor(egg);
      if (eggBalance(egg) < cost) break;
      if (egg.currency === 'rt') S.rt -= cost; else spendFk(cost);
    }
    const def = rollPet(egg);
    const pet = addPet(def);
    S.counters.hatches++;
    S.eggRarity[def.rarity] = (S.eggRarity[def.rarity] || 0) + 1;
    results.push({ pet: pet, def: def });
    recalc();
  }
  if (results.length) bus.emit('hatch', results, egg);
  return results;
}

function petScore(p) {
  const w = { cps: 1, click: 0.6, golden: 0.9, discount: 4 };
  const def = PET_BY_ID[p.id];
  return petBaseValue(p) * w[def.kind];
}

function equipBest() {
  const sorted = S.pets.slice().sort((a, b) => petScore(b) - petScore(a));
  S.equipped = sorted.slice(0, calc.slots).map(p => p.u);
  recalc();
}

function unequipAll() { S.equipped = []; recalc(); }

function toggleEquip(uid) {
  const idx = S.equipped.indexOf(uid);
  if (idx >= 0) { S.equipped.splice(idx, 1); recalc(); return 'off'; }
  if (S.equipped.length >= calc.slots) return 'full';
  S.equipped.push(uid);
  recalc();
  return 'on';
}

function releasePet(uid) {
  const idx = S.pets.findIndex(p => p.u === uid);
  if (idx < 0) return;
  S.pets.splice(idx, 1);
  const e = S.equipped.indexOf(uid);
  if (e >= 0) S.equipped.splice(e, 1);
  recalc();
}

function releaseWeak() {
  let n = 0;
  for (let i = S.pets.length - 1; i >= 0; i--) {
    const p = S.pets[i];
    const r = PET_BY_ID[p.id].rarity;
    if ((r === 'common' || r === 'uncommon') && p.lvl === 0 && S.equipped.indexOf(p.u) < 0) {
      S.pets.splice(i, 1);
      n++;
    }
  }
  recalc();
  return n;
}

function mergePets() {
  let merges = 0;
  let again = true;
  while (again) {
    again = false;
    const groups = {};
    S.pets.forEach(p => {
      if (p.lvl >= PET_MAX_LEVEL) return;
      const key = p.id + ':' + p.lvl;
      (groups[key] = groups[key] || []).push(p);
    });
    for (const key in groups) {
      const list = groups[key];
      while (list.length >= 3) {
        list.sort((a, b) => (S.equipped.indexOf(b.u) >= 0 ? 1 : 0) - (S.equipped.indexOf(a.u) >= 0 ? 1 : 0));
        const eat = list.splice(list.length - 3, 3);
        const keeper = eat[0];
        let wasEquipped = false;
        eat.forEach(p => {
          const ei = S.equipped.indexOf(p.u);
          if (ei >= 0) { wasEquipped = true; S.equipped.splice(ei, 1); }
        });
        S.pets = S.pets.filter(p => eat.indexOf(p) < 0);
        const np = { u: S.petUid++, id: keeper.id, lvl: keeper.lvl + 1, star: Math.min.apply(null, eat.map(x => x.star | 0)) };
        S.pets.push(np);
        if (wasEquipped && S.equipped.length < calc.slots) S.equipped.push(np.u);
        merges++;
        again = true;
      }
    }
  }
  if (merges) {
    S.counters.merges += merges;
    recalc();
    bus.emit('merge', merges);
  }
  return merges;
}

/* ---------- Quests ---------- */
function questTier() { return Math.min(14, Math.floor(S.questsDone / 3)); }

function highestOwnedGen() {
  let gi = 0;
  for (let i = 0; i < GENS.length; i++) if (S.gens[GENS[i].id] > 0) gi = i;
  return gi;
}

const QUEST_TYPES = {
  click: {
    avail: () => true,
    make: t => ({ target: Math.round(80 * Math.pow(1.45, t)) }),
    base: () => S.counters.clicks,
    prog: q => S.counters.clicks - q.base,
    text: q => 'Click Finn ' + fmtInt(q.target) + ' times'
  },
  earn: {
    avail: () => calc.cps > 0,
    make: t => ({ target: Math.max(1000, calc.cps * (600 + t * 240)) }),
    base: () => S.lifeEarned,
    prog: q => S.lifeEarned - q.base,
    text: q => 'Earn ' + fmt(q.target) + ' Finn Kumar'
  },
  golden: {
    avail: () => true,
    make: t => ({ target: 1 + Math.floor(t / 3) }),
    base: () => S.counters.goldens,
    prog: q => S.counters.goldens - q.base,
    text: q => 'Click ' + q.target + ' Golden Finn' + (q.target > 1 ? 's' : '')
  },
  hatch: {
    avail: () => EGGS.some(e => e.currency === 'fk' && eggVisible(e)),
    make: t => ({ target: 1 + Math.floor(t / 2) }),
    base: () => S.counters.hatches,
    prog: q => S.counters.hatches - q.base,
    text: q => 'Hatch ' + q.target + ' egg' + (q.target > 1 ? 's' : '')
  },
  upgrade: {
    avail: () => availableUpgrades().length > 0,
    make: t => ({ target: 2 + t * 2 }),
    base: () => S.counters.upgrades,
    prog: q => S.counters.upgrades - q.base,
    text: q => 'Buy ' + q.target + ' upgrades'
  },
  own: {
    avail: () => true,
    make: t => {
      const gi = highestOwnedGen();
      return { gi: gi, target: S.gens[GENS[gi].id] + 4 + t };
    },
    base: () => 0,
    prog: q => S.gens[GENS[q.gi].id],
    text: q => 'Own ' + q.target + ' ' + GENS[q.gi].plural
  },
  crit: {
    avail: () => true,
    make: t => ({ target: 5 + t * 5 }),
    base: () => S.counters.crits,
    prog: q => S.counters.crits - q.base,
    text: q => 'Land ' + q.target + ' critical clicks'
  },
  merge: {
    avail: () => S.pets.length >= 3,
    make: t => ({ target: 1 + Math.floor(t / 3) }),
    base: () => S.counters.merges,
    prog: q => S.counters.merges - q.base,
    text: q => 'Merge pets ' + q.target + ' time' + (q.target > 1 ? 's' : '')
  },
  play: {
    avail: () => S.lifeEarned > 5e4,
    make: t => ({ target: 1 + Math.floor(t / 4) }),
    base: () => S.counters.wheel + S.counters.catches + S.stats.slotPlays,
    prog: q => S.counters.wheel + S.counters.catches + S.stats.slotPlays - q.base,
    text: q => 'Play ' + q.target + ' mini game' + (q.target > 1 ? 's' : '')
  }
};

function makeQuestReward(t) {
  const r = Math.random();
  if (r < 0.15 && S.rebirths >= 1) return { kind: 'rt', amt: 1 + Math.floor(t / 4) };
  if (r < 0.35) return { kind: 'buff' };
  return { kind: 'fk', mul: 1200 + 300 * t };
}

function newQuest(avoidTypes) {
  const t = questTier();
  const types = Object.keys(QUEST_TYPES).filter(k => QUEST_TYPES[k].avail() && avoidTypes.indexOf(k) < 0);
  const type = types.length ? pickOne(types) : 'click';
  const def = QUEST_TYPES[type];
  const q = Object.assign({ uid: S.questSeq++, type: type, done: false, reward: makeQuestReward(t) }, def.make(t));
  q.base = def.base();
  return q;
}

function fillQuests() {
  while (S.quests.length < 4) {
    S.quests.push(newQuest(S.quests.map(q => q.type)));
  }
}

function questProgress(q) {
  const v = QUEST_TYPES[q.type].prog(q);
  return clamp(v, 0, q.target);
}

function questText(q) { return QUEST_TYPES[q.type].text(q); }

function questRewardText(r) {
  if (r.kind === 'rt') return r.amt + ' Rebirth Token' + (r.amt > 1 ? 's' : '');
  if (r.kind === 'buff') return 'A 45 second Finn Frenzy';
  return fmtTime(r.mul) + ' of production';
}

function updateQuests() {
  for (let i = 0; i < S.quests.length; i++) {
    const q = S.quests[i];
    if (!q.done && QUEST_TYPES[q.type].prog(q) >= q.target) {
      q.done = true;
      bus.emit('questReady', q);
    }
  }
}

function claimQuest(uid) {
  const idx = S.quests.findIndex(q => q.uid === uid);
  if (idx < 0 || !S.quests[idx].done) return false;
  const q = S.quests[idx];
  const r = q.reward;
  if (r.kind === 'rt') { S.rt += r.amt; S.rtTotal += r.amt; S.rtRun += r.amt; }
  else if (r.kind === 'buff') addBuff({ id: 'frenzy', name: 'Finn Frenzy', kind: 'cps', mult: 7, tone: 'sunny' }, 45);
  else addFk(Math.max(200, calc.cps * r.mul) + 100, 'quest');
  S.questsDone++;
  S.quests.splice(idx, 1);
  fillQuests();
  recalc();
  bus.emit('questClaimed', q);
  return true;
}

/* ---------- Achievements ---------- */
function checkAchievements() {
  let any = false;
  for (let i = 0; i < ACHIEVEMENTS.length; i++) {
    const a = ACHIEVEMENTS[i];
    if (S.achievements[a.id]) continue;
    let ok = false;
    try { ok = a.check(); } catch (err) { ok = false; }
    if (ok) {
      S.achievements[a.id] = Date.now();
      any = true;
      bus.emit('achievement', a);
    }
  }
  if (any) recalc();
}

/* ---------- Prestige ---------- */
function rebirthGain() {
  const base = Math.sqrt(S.runEarned / REBIRTH_MIN);
  if (!(base >= 1)) return 0;
  return Math.floor(base * calc.rtGainMult);
}

function nextRebirthAt(gain) {
  /* run earnings needed to reach `gain` tokens */
  return REBIRTH_MIN * Math.pow(gain / calc.rtGainMult, 2);
}

function transcendGain() {
  if (S.rtRun < TRANSCEND_MIN_RT) return 0;
  const g = Math.pow(S.rtRun / 50, 0.6) * (1 + 0.3 * crownLv('cshard'));
  return Math.floor(g);
}

function ascendGain() {
  if (S.shardRun < ASCEND_MIN_SHARDS) return 0;
  return Math.floor(Math.sqrt(S.shardRun / 20));
}

function resetRunState() {
  GENS.forEach(g => { S.gens[g.id] = 0; });
  S.upgrades = {};
  S.buffs = [];
  S.runEarned = 0;
  S.runStart = Date.now();
  S.fk = headStartAmount(lv('headstart'));
  T.combo = 0;
  T.goldens.forEach(g => bus.emit('goldenEnd', g, false));
  T.goldens = [];
  T.stormLeft = 0;
  scheduleGolden();
  recalc();
}

function doRebirth() {
  const gain = rebirthGain();
  if (gain < 1) return false;
  if (fullAutoOn()) return prestigeKeep('rebirth', gain);
  const runTime = (Date.now() - S.runStart) / 1000;
  S.rt += gain; S.rtTotal += gain; S.rtRun += gain;
  S.rebirths++;
  S.stats.lastRebirthGain = gain;
  if (!S.stats.fastestRebirth || runTime < S.stats.fastestRebirth) S.stats.fastestRebirth = runTime;
  resetRunState();
  bus.emit('prestige', { layer: 'rebirth', gain: gain });
  return true;
}

function resetRebirthLayer(keepShop) {
  S.rt = 0; S.rtTotal = 0; S.rtRun = 0;
  if (!keepShop) S.rtUp = {};
}

function doTranscend() {
  const gain = transcendGain();
  if (gain < 1) return false;
  if (fullAutoOn()) return prestigeKeep('transcend', gain);
  S.shards += gain; S.shardsTotal += gain; S.shardRun += gain;
  S.transcends++;
  resetRebirthLayer(hasNode('a1'));
  resetRunState();
  bus.emit('prestige', { layer: 'transcend', gain: gain });
  return true;
}

function doAscend() {
  const gain = ascendGain();
  if (gain < 1) return false;
  if (fullAutoOn()) return prestigeKeep('ascend', gain);
  S.crowns += gain; S.crownsTotal += gain; S.crownRun += gain;
  S.ascensions++;
  S.shards = 0; S.shardsTotal = 0; S.shardRun = 0;
  if (!crownLv('cmemory')) S.shardNodes = {};
  resetRebirthLayer(hasNode('a1'));
  resetRunState();
  bus.emit('prestige', { layer: 'ascend', gain: gain });
  return true;
}


/* =====================================================================
   MEGA EVOLUTION  (after 1,000B crowns: full restart, Kumar + pets +1 star)
   FULLY AUTO      (special account only)
   ===================================================================== */
const MEGA_CROWNS = 1e12;            /* 1000B crowns earned in this evolution cycle */
const MEGA_MAX_STARS = 1e9;          /* effectively no cap on stars */
const PET_STAR_MULT = 3;             /* each pet star: pet bonus x3 */
const KUMAR_STAR_PROD = 4;           /* each Kumar star: production and click x4 */
const KUMAR_STAR_FX = 0.5;           /* each Kumar star: other leader effects +50% */
const FULL_AUTO_ID = '64966bed-47a8-45bc-8b16-1d20889cdaa7';

function kumarStar(id) { return (S.kumarStars && S.kumarStars[id]) | 0; }
function petStarMult(p) { return Math.min(1e100, Math.pow(PET_STAR_MULT, p.star | 0)); }
function starText(n) { return n <= 0 ? '' : n <= 5 ? '\u2605'.repeat(n) : '\u2605\u00d7' + n; }

function applyKumarStars(e) {
  const st = kumarStar(S.kumar);
  if (!st) return e;
  const f = 1 + KUMAR_STAR_FX * st;
  const sm = Math.min(1e100, Math.pow(KUMAR_STAR_PROD, st));   /* clamped so huge star counts never overflow */
  e.prod *= sm;
  e.click *= sm;
  e.goldFreq = 1 + (e.goldFreq - 1) * f;
  e.goldVal = 1 + (e.goldVal - 1) * f;
  e.pet = 1 + (e.pet - 1) * f;
  e.rp = 1 + (e.rp - 1) * f;
  e.cost = Math.max(0.5, 1 - (1 - e.cost) * f);
  e.crit *= f; e.combo *= f; e.offline *= f;
  return e;
}

function fullAutoUnlocked() { return !!S && String(S.pid || '').toLowerCase() === FULL_AUTO_ID; }
function fullAutoOn() { return fullAutoUnlocked() && !!S.settings.fullAuto; }

function megaReady() { return S.crownRun >= MEGA_CROWNS; }

function doMegaEvolve() {
  if (!megaReady()) return false;
  const kid = S.kumar;
  S.kumarStars[kid] = kumarStar(kid) + 1;
  S.pets.forEach(p => { p.star = (p.star | 0) + 1; });
  S.megaCount++;
  S.crownRun = 0;
  if (!fullAutoOn()) {
    /* full restart: every prestige layer and the run itself. Kumars, pets, research, achievements stay. */
    S.rt = 0; S.rtTotal = 0; S.rtRun = 0; S.rtUp = {};
    S.shards = 0; S.shardsTotal = 0; S.shardRun = 0; S.shardNodes = {};
    S.crowns = 0; S.crownsTotal = 0; S.crownPerks = {};
    resetRunState();
  } else {
    recalc();
  }
  bus.emit('mega', { kumar: kid, stars: S.kumarStars[kid] });
  return true;
}

/* Prestige that loses nothing: only the counter that feeds that layer's formula starts over. */
function prestigeKeep(layer, gain) {
  if (layer === 'rebirth') {
    const runTime = (Date.now() - S.runStart) / 1000;
    S.rt += gain; S.rtTotal += gain; S.rtRun += gain;
    S.rebirths++;
    S.stats.lastRebirthGain = gain;
    if (!S.stats.fastestRebirth || runTime < S.stats.fastestRebirth) S.stats.fastestRebirth = runTime;
    S.runEarned = 0; S.runStart = Date.now();
  } else if (layer === 'transcend') {
    S.shards += gain; S.shardsTotal += gain; S.shardRun += gain;
    S.transcends++;
    S.rtRun = 0;
  } else {
    S.crowns += gain; S.crownsTotal += gain; S.crownRun += gain;
    S.ascensions++;
    S.shardRun = 0;
  }
  recalc();
  bus.emit('prestige', { layer: layer, gain: gain });
  return true;
}

function fullAutoSpend() {
  let guard = 0;
  while (guard++ < 300) {                       /* rebirth shop, cheapest first */
    let best = null, bc = Infinity;
    for (let i = 0; i < RT_UPGRADES.length; i++) {
      const d = RT_UPGRADES[i], l = lv(d.id);
      if (l >= d.max) continue;
      const c = rtUpgradeCost(d, l);
      if (c <= S.rt && c < bc) { best = d; bc = c; }
    }
    if (!best || !buyRtUpgrade(best.id)) break;
  }
  guard = 0;
  while (guard++ < 100) {                       /* shard tree */
    let best = null;
    for (let i = 0; i < SHARD_NODES.length; i++) {
      const n = SHARD_NODES[i];
      if (!hasNode(n.id) && nodeAvailable(n) && S.shards >= n.cost && (!best || n.cost < best.cost)) best = n;
    }
    if (!best || !buyShardNode(best.id)) break;
  }
  guard = 0;
  while (guard++ < 300) {                       /* crown perks */
    let best = null, bc = Infinity;
    for (let i = 0; i < CROWN_PERKS.length; i++) {
      const d = CROWN_PERKS[i], l = crownLv(d.id);
      if (l >= d.max) continue;
      const c = crownPerkCost(d, l);
      if (c <= S.crowns && c < bc) { best = d; bc = c; }
    }
    if (!best || !buyCrownPerk(best.id)) break;
  }
  guard = 0;
  while (guard++ < 300) {                       /* research lab */
    let best = null, bc = Infinity;
    for (let i = 0; i < RP_UPGRADES.length; i++) {
      const d = RP_UPGRADES[i], l = rl(d.id);
      if (l >= d.max) continue;
      const c = rpCost(d, l);
      if (c <= S.rp && c < bc) { best = d; bc = c; }
    }
    if (!best || !buyResearch(best.id)) break;
  }
}

function fullAutoStep() {
  T.autoQuiet = true;
  const sum = T.autoSum || (T.autoSum = { rebirth: 0, transcend: 0, ascend: 0, mega: 0 });
  try {
    buyAllUpgrades();          /* "auto upgrade" = buy everything affordable */
    buyMaxAll();               /* "auto buy" = buy max of every generator */
    buyAllUpgrades();
    fullAutoSpend();
    let g;
    if ((g = ascendGain()) >= 1 && doAscend()) sum.ascend += g;
    if ((g = transcendGain()) >= 1 && doTranscend()) sum.transcend += g;
    if ((g = rebirthGain()) >= 1 && doRebirth()) sum.rebirth += g;
    fullAutoSpend();
    if (megaReady()) { T.autoQuiet = false; if (doMegaEvolve()) sum.mega++; T.autoQuiet = true; }
  } finally {
    T.autoQuiet = false;
  }
  const now = Date.now();
  if (now - T.autoSumAt > 20000) {
    if (T.autoSumAt && (sum.rebirth || sum.transcend || sum.ascend)) {
      const parts = [];
      if (sum.rebirth) parts.push('+' + fmtInt(sum.rebirth) + ' tokens');
      if (sum.transcend) parts.push('+' + fmtInt(sum.transcend) + ' shards');
      if (sum.ascend) parts.push('+' + fmtInt(sum.ascend) + ' crowns');
      bus.emit('toast', { title: 'Fully Auto', text: parts.join(', ') + ' in the last 20s.', tone: 'good' });
    }
    T.autoSum = null;
    T.autoSumAt = now;
  }
}

function buyRtUpgrade(id) {
  const def = RT_BY_ID[id];
  const l = lv(id);
  if (!def || l >= def.max) return false;
  const cost = rtUpgradeCost(def, l);
  if (S.rt < cost) return false;
  S.rt -= cost;
  S.rtUp[id] = l + 1;
  recalc();
  bus.emit('buyShop', def);
  return true;
}

function nodeAvailable(n) { return n.req.every(r => hasNode(r)); }

function buyShardNode(id) {
  const n = SHARD_BY_ID[id];
  if (!n || hasNode(id) || !nodeAvailable(n) || S.shards < n.cost) return false;
  S.shards -= n.cost;
  S.shardNodes[id] = 1;
  recalc();
  bus.emit('buyShop', n);
  return true;
}

function buyCrownPerk(id) {
  const def = CROWN_BY_ID[id];
  const l = crownLv(id);
  if (!def || l >= def.max) return false;
  const cost = crownPerkCost(def, l);
  if (S.crowns < cost) return false;
  S.crowns -= cost;
  S.crownPerks[id] = l + 1;
  recalc();
  bus.emit('buyShop', def);
  return true;
}

/* ---------- Mini games ---------- */
function wheelReady() { return Date.now() >= S.wheelNext; }
function catcherReady() { return Date.now() >= S.catcherNext; }

function bestAffordableEgg() {
  let best = EGGS[0];
  for (let i = 0; i < EGGS.length; i++) {
    const e = EGGS[i];
    if (e.currency === 'fk' && eggVisible(e) && e.cost <= Math.max(2.5e5, calc.cps * 7200)) best = e;
  }
  return best;
}

function spinWheel() {
  if (!wheelReady()) return null;
  const prize = pickWeighted(WHEEL_PRIZES, p => p.weight);
  const index = WHEEL_PRIZES.indexOf(prize);
  S.wheelNext = Date.now() + WHEEL_COOLDOWN * 1000 * calc.cooldownMult;
  S.counters.wheel++;
  const cps = calc.cps;
  let text = prize.desc;
  switch (prize.id) {
    case 'pile_s': { const a = cps * 600 + 50; addFk(a, 'wheel'); text = '+' + fmt(a) + ' Finn Kumar'; break; }
    case 'pile_l': { const a = cps * 3600 + 200; addFk(a, 'wheel'); text = '+' + fmt(a) + ' Finn Kumar'; break; }
    case 'frenzy': addBuff({ id: 'frenzy', name: 'Finn Frenzy', kind: 'cps', mult: 7, tone: 'sunny' }, 60); break;
    case 'clickf': addBuff({ id: 'clickfrenzy', name: 'Click Frenzy', kind: 'click', mult: 777, tone: 'pink' }, 20); break;
    case 'egg': {
      const egg = bestAffordableEgg();
      const res = hatchEgg(egg.id, 1, true);
      if (res.length) text = 'You hatched a ' + res[0].def.name + '!';
      break;
    }
    case 'party': addBuff({ id: 'petparty', name: 'Pet Party', kind: 'pet', mult: 3, tone: 'pink' }, 60); break;
    case 'token':
      if (S.rebirths >= 1) { S.rt += 1; S.rtTotal += 1; S.rtRun += 1; recalc(); text = '+1 Rebirth Token'; }
      else { const a = cps * 10800 + 500; addFk(a, 'wheel'); text = '+' + fmt(a) + ' Finn Kumar'; }
      break;
    case 'jackpot': { const a = cps * 28800 + 1000; addFk(a, 'wheel'); text = '+' + fmt(a) + ' Finn Kumar'; break; }
    default: break;
  }
  bus.emit('wheel', { index: index, prize: prize, text: text });
  return { index: index, prize: prize, text: text };
}

function finishCatcher(score) {
  S.catcherNext = Date.now() + CATCHER_COOLDOWN * 1000 * calc.cooldownMult;
  S.counters.catches++;
  if (score > S.stats.bestCatch) S.stats.bestCatch = score;
  const pts = Math.max(0, score);
  const amt = calc.cps * 20 * pts + 50 * pts;
  addFk(amt, 'catcher');
  let extra = '';
  if (pts >= 40) { addBuff({ id: 'frenzy', name: 'Finn Frenzy', kind: 'cps', mult: 7, tone: 'sunny' }, 20); extra = ' and a Finn Frenzy'; }
  bus.emit('catcherDone', { score: pts, amt: amt, extra: extra });
  return { score: pts, amt: amt, extra: extra };
}

function slotBetFor(pct) {
  return Math.floor(S.fk * pct);
}

function slotSpin(bet) {
  if (!(bet >= 1) || S.fk < bet) return null;
  spendFk(bet);
  S.stats.slotPlays++;
  const reels = [0, 1, 2].map(() => pickWeighted(SLOT_SYMBOLS, s => s.w));
  let payout = 0;
  let kind = 'lose';
  if (reels[0] === reels[1] && reels[1] === reels[2]) {
    payout = bet * reels[0].pay;
    kind = reels[0].s === '👑' ? 'jackpot' : 'triple';
  } else if (reels[0] === reels[1] || reels[1] === reels[2] || reels[0] === reels[2]) {
    payout = bet * 1.4;
    kind = 'pair';
  }
  if (payout > 0) {
    addFk(payout, 'slots');
    S.stats.slotWins++;
    if (kind === 'jackpot') S.stats.slotJackpots++;
  }
  S.stats.slotNet += payout - bet;
  return { reels: reels.map(r => r.s), bet: bet, payout: payout, kind: kind };
}

/* ---------- Offline progress ---------- */
function applyOffline(seconds) {
  recalc();
  const cap = calc.offlineCapH * 3600;
  const used = Math.min(seconds, cap);
  const gain = calc.cps * used * calc.offlineEff;
  addFk(gain);
  S.stats.offlineEarned += gain;
  /* research keeps ticking while you are away, at offline efficiency */
  const effSec = used * calc.offlineEff + S.rpProgress;
  const cycles = Math.floor(effSec / calc.rpInterval);
  let rp = 0;
  if (cycles > 0) { rp = cycles * calc.rpPerCycle; addResearch(rp); }
  S.rpProgress = effSec - cycles * calc.rpInterval;
  return { seconds: seconds, used: used, gain: gain, capped: seconds > cap, eff: calc.offlineEff, rp: rp };
}

/* =====================================================================
   KUMARS (playable eggs)
   ===================================================================== */
function rl(id) { return S.rpUp[id] || 0; }

function kumarEffects() {
  const sc = 1 + 0.1 * rl('rgym');
  const e = { prod: 1, click: 1, crit: 0, combo: 0, goldFreq: 1, goldVal: 1, pet: 1, rp: 1, cost: 1, offline: 0 };
  switch (S.kumar) {
    case 'finn':
      e.prod = 1 + 0.25 * sc; e.click = 1 + 0.25 * sc;
      break;
    case 'julian':
      e.click = 3 * sc; e.crit = 0.08 * sc; e.combo = 0.5 * sc;
      break;
    case 'leo':
      e.goldFreq = 1 + 0.5 * sc; e.goldVal = 1 + 0.5 * sc; e.pet = 1 + 0.25 * sc;
      break;
    case 'madhav':
      e.rp = 1 + 0.5 * sc; e.cost = Math.max(0.5, 1 - 0.1 * sc); e.offline = 0.25 * sc;
      break;
    case 'secret':
      e.prod = 10 * sc; e.click = 10 * sc; e.goldFreq = 2 * sc; e.rp = 2 * sc; e.pet = 2 * sc;
      break;
    default: break;
  }
  return e;
}

function unlockKumar(id) {
  if (S.kumarsUnlocked[id] || !KUMAR_BY_ID[id]) return false;
  S.kumarsUnlocked[id] = Date.now();
  recalc();
  bus.emit('kumarUnlock', KUMAR_BY_ID[id]);
  return true;
}

function checkKumarUnlocks() {
  for (let i = 0; i < KUMARS.length; i++) {
    const k = KUMARS[i];
    if (!S.kumarsUnlocked[k.id] && k.unlock()) unlockKumar(k.id);
  }
}

function missionOf(kid) {
  for (let i = 0; i < S.missions.length; i++) if (S.missions[i].k === kid) return S.missions[i];
  return null;
}

function selectKumar(id) {
  if (!S.kumarsUnlocked[id]) return 'locked';
  if (missionOf(id)) return 'busy';
  if (S.kumar === id) return 'same';
  S.kumar = id;
  recalc();
  bus.emit('kumarSelect', id);
  return 'ok';
}

function eligibleKumars() {
  return KUMARS.filter(k => S.kumarsUnlocked[k.id] && k.id !== S.kumar && !missionOf(k.id));
}

/* =====================================================================
   RESEARCH LAB
   ===================================================================== */
function rpCost(def, level) { return Math.ceil(def.base * Math.pow(def.growth, level)); }

function researchLevelsOwned() {
  let n = 0;
  for (const id in S.rpUp) n += S.rpUp[id];
  return n;
}

function addResearch(n) {
  if (!(n > 0)) return;
  S.rp += n;
  S.rpTotal += n;
}

function tickResearch(dt) {
  S.rpProgress += dt;
  const interval = calc.rpInterval;
  let guard = 0;
  let gained = 0;
  while (S.rpProgress >= interval && guard++ < 100) {
    S.rpProgress -= interval;
    gained += calc.rpPerCycle;
  }
  if (S.rpProgress > interval) S.rpProgress = 0;
  if (gained > 0) {
    addResearch(gained);
    bus.emit('research', gained);
  }
}

function buyResearch(id) {
  const def = RP_BY_ID[id];
  const l = rl(id);
  if (!def || l >= def.max) return false;
  const cost = rpCost(def, l);
  if (S.rp < cost) return false;
  S.rp -= cost;
  S.rpUp[id] = l + 1;
  recalc();
  bus.emit('buyShop', def);
  return true;
}

/* =====================================================================
   MISSIONS
   ===================================================================== */
function missionDur(m) { return m.mins * 60 * calc.missionMult; }
function missionOpen(m) { return (m.needRebirths || 0) <= S.rebirths; }
function missionDone(x) { return Date.now() >= x.end; }

function missionReward(m, kid) {
  const aff = KUMAR_BY_ID[kid].mission;
  return {
    fk: calc.cps * m.fkSec * aff.fk + 100 * m.mins,
    rp: Math.round(m.rp * aff.rp),
    egg: Math.min(1, m.egg * aff.egg),
    rt: m.rt || 0
  };
}

function startMission(mid, kid) {
  const m = MISSION_BY_ID[mid];
  if (!m || !missionOpen(m)) return 'locked';
  if (S.missions.length >= calc.missionSlots) return 'full';
  if (!S.kumarsUnlocked[kid]) return 'locked';
  if (kid === S.kumar) return 'active';
  if (missionOf(kid)) return 'busy';
  const now = Date.now();
  S.missions.push({ u: S.missionSeq++, id: mid, k: kid, start: now, end: now + missionDur(m) * 1000 });
  recalc();
  return 'ok';
}

function claimMission(u) {
  const idx = S.missions.findIndex(x => x.u === u);
  if (idx < 0 || !missionDone(S.missions[idx])) return null;
  const x = S.missions[idx];
  const m = MISSION_BY_ID[x.id];
  const r = missionReward(m, x.k);
  S.missions.splice(idx, 1);
  S.missionsDone++;
  addFk(r.fk, 'mission');
  if (r.rp > 0) addResearch(r.rp);
  const parts = ['+' + fmt(r.fk) + ' Finn Kumar'];
  if (r.rp > 0) parts.push('+' + r.rp + ' RP');
  if (r.rt > 0 && S.rebirths >= 1) { S.rt += r.rt; S.rtTotal += r.rt; S.rtRun += r.rt; parts.push('+' + r.rt + ' Rebirth Token' + (r.rt > 1 ? 's' : '')); }
  if (Math.random() < r.egg) {
    const res = hatchEgg(bestAffordableEgg().id, 1, true);
    if (res.length) parts.push('a free ' + res[0].def.name);
  }
  recalc();
  const out = { mission: m, kumar: KUMAR_BY_ID[x.k], text: parts.join(', ') };
  bus.emit('missionClaimed', out);
  return out;
}

/* =====================================================================
   LEADERBOARD (computer rivals whose scores grow with time)
   ===================================================================== */
function rivalHours() { return Math.max(0.02, (Date.now() - S.created) / 3.6e6); }

function rivalValue(r, board) {
  const h = rivalHours();
  const life = r.k * Math.pow(h, r.p);
  if (board === 'cps') return life * r.p / (h * 3600);
  if (board === 'clicks') return r.cl * h;
  return life;
}

function playerValue(board) {
  if (board === 'cps') return S.stats.bestCps;
  if (board === 'clicks') return S.counters.clicks;
  return S.lifeEarned;
}

function getBoard(board) {
  const now = Date.now();
  const hit = T.boardCache[board];
  if (hit && now - hit.at < 500) return hit.rows;
  const k = KUMAR_BY_ID[S.kumar] || KUMARS[0];
  const rows = RIVALS.map(r => ({ id: r.id, name: r.name, icon: r.icon, value: rivalValue(r, board), you: false }));
  rows.push({ id: 'you', name: S.playerName || 'You', icon: k.icon, value: playerValue(board), you: true });
  rows.sort((a, b) => b.value - a.value);
  rows.forEach((r, i) => { r.rank = i + 1; });
  T.boardCache[board] = { at: now, rows: rows };
  return rows;
}

function rankBonusFor(rank) {
  for (let i = 0; i < RANK_BONUSES.length; i++) if (rank <= RANK_BONUSES[i].max) return RANK_BONUSES[i].bonus;
  return 0;
}

function updateRank() {
  T.boardCache = {};
  const rows = getBoard('life');
  const me = rows.find(r => r.you);
  const rank = me ? me.rank : RIVALS.length + 1;
  const bonus = 1 + rankBonusFor(rank);
  const changed = bonus !== T.rankMult;
  if (T.lastRank && rank < T.lastRank) {
    const passed = rows[rank] ? rows[rank].name : '';
    bus.emit('rankUp', rank, passed);
  }
  T.lastRank = rank;
  T.rank = rank;
  T.rankMult = bonus;
  if (changed) recalc();
}

/* ---------- Redeem codes ---------- */
function redeemCode(raw) {
  const code = String(raw || '').trim().toLowerCase();
  if (!code) return { ok: false, msg: 'Type a code first.' };
  const def = CODES[code];
  if (!def) return { ok: false, msg: 'That code is not valid.' };
  if (S.codes[code]) return { ok: false, msg: 'You already used that code.' };
  S.codes[code] = Date.now();
  recalc();
  def.apply();
  recalc();
  saveGame();
  return { ok: true, title: def.title, msg: def.msg };
}

/* ---------- Titles ---------- */
function currentTitle() {
  let t = TITLES[0].name;
  for (let i = 0; i < TITLES.length; i++) if (S.lifeEarned >= TITLES[i].at) t = TITLES[i].name;
  return t;
}

/* ---------- Saving ---------- */
function saveGame() {
  try {
    S.lastSave = Date.now();
    localStorage.setItem(SAVE_KEY, JSON.stringify(S));
    return true;
  } catch (err) {
    return false;
  }
}

function readSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return null;
    return JSON.parse(raw);
  } catch (err) {
    return null;
  }
}

function stateFromSaved(obj) {
  const st = mergeState(defaultState(), obj);
  if (!(obj.v >= 2)) st.settings.autosave = 1;   /* saves from version 1 used a slower autosave */
  st.v = SAVE_VERSION;
  if (!isPlainObject(st.codes)) st.codes = {};
  if (!Array.isArray(st.pets)) st.pets = [];
  if (!Array.isArray(st.equipped)) st.equipped = [];
  if (!Array.isArray(st.buffs)) st.buffs = [];
  if (!Array.isArray(st.quests)) st.quests = [];
  /* guard against corrupt numbers */
  ['fk', 'runEarned', 'lifeEarned', 'rt', 'rtTotal', 'rtRun', 'shards', 'shardsTotal', 'shardRun', 'crowns', 'crownsTotal', 'crownRun', 'megaCount'].forEach(k => {
    if (typeof st[k] !== 'number' || !isFinite(st[k]) || st[k] < 0) st[k] = 0;
  });
  GENS.forEach(g => { if (typeof st.gens[g.id] !== 'number' || st.gens[g.id] < 0) st.gens[g.id] = 0; });
  st.pets = st.pets.filter(p => p && PET_BY_ID[p.id]);
  st.pets.forEach(p => { p.lvl = clamp(p.lvl | 0, 0, PET_MAX_LEVEL); p.star = clamp(p.star | 0, 0, MEGA_MAX_STARS); });
  if (!obj || obj.crownRun === undefined) st.crownRun = st.crownsTotal;   /* saves from before Mega Evolution */
  if (!isPlainObject(st.kumarStars)) st.kumarStars = {};
  Object.keys(st.kumarStars).forEach(id => { st.kumarStars[id] = clamp(st.kumarStars[id] | 0, 0, MEGA_MAX_STARS); if (!st.kumarStars[id]) delete st.kumarStars[id]; });
  const uids = {};
  st.pets.forEach(p => { uids[p.u] = 1; });
  st.equipped = st.equipped.filter(u => uids[u]);
  st.quests = st.quests.filter(q => q && QUEST_TYPES[q.type]);
  if (!isPlainObject(st.kumarsUnlocked)) st.kumarsUnlocked = { finn: 1 };
  st.kumarsUnlocked.finn = st.kumarsUnlocked.finn || 1;
  if (st.codes && st.codes['666'] && !st.kumarsUnlocked.secret) st.kumarsUnlocked.secret = Date.now();   /* earlier saves that used code 666 */
  Object.keys(st.kumarsUnlocked).forEach(id => { if (!KUMAR_BY_ID[id]) delete st.kumarsUnlocked[id]; });
  if (!KUMAR_BY_ID[st.kumar] || !st.kumarsUnlocked[st.kumar]) st.kumar = 'finn';
  if (!isPlainObject(st.rpUp)) st.rpUp = {};
  ['rp', 'rpTotal', 'rpProgress'].forEach(k => { if (typeof st[k] !== 'number' || !isFinite(st[k]) || st[k] < 0) st[k] = 0; });
  if (!Array.isArray(st.missions)) st.missions = [];
  st.missions = st.missions.filter(m => m && MISSION_BY_ID[m.id] && KUMAR_BY_ID[m.k] && typeof m.end === 'number');
  if (typeof st.playerName !== 'string' || !st.playerName.trim()) st.playerName = 'You';
  st.playerName = st.playerName.slice(0, 16);
  return st;
}

function exportSave() {
  const json = JSON.stringify(S);
  const bytes = new TextEncoder().encode(json);
  let bin = '';
  for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin);
}

function parseExport(str) {
  try {
    const bin = atob(str.replace(/\s+/g, ''));
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const obj = JSON.parse(new TextDecoder().decode(bytes));
    if (!isPlainObject(obj) || typeof obj.fk !== 'number' || !isPlainObject(obj.gens)) return null;
    return obj;
  } catch (err) {
    return null;
  }
}

/* ---------- Main loop ---------- */
function tick() {
  if (!S) return;
  const now = Date.now();
  let dt = (now - T.last) / 1000;
  T.last = now;
  if (dt <= 0) return;

  recalc();
  if (dt > MAX_OFFLINE_DT) {
    const r = applyOffline(dt);
    bus.emit('offline', r);
    dt = 0.1;
  } else {
    addFk(calc.cps * dt);
    S.playtime += dt;
  }

  /* combo decay */
  if (now - T.lastClick > 900 && T.combo > 0) T.combo = Math.max(0, T.combo - 25 * dt);

  /* auto clicker */
  const ac = lv('autoclick');
  if (ac > 0) {
    T.autoClickAcc += ac * dt;
    let guard = 0;
    while (T.autoClickAcc >= 1 && guard++ < 40) {
      T.autoClickAcc -= 1;
      doClick(true);
    }
    if (T.autoClickAcc > 40) T.autoClickAcc = 0;
  }

  /* auto buyer */
  if (fullAutoOn()) {
    T.fullAutoAcc += dt;
    if (T.fullAutoAcc >= 0.5) { T.fullAutoAcc = 0; fullAutoStep(); }
  }

  const ab = lv('autobuy');
  if (ab > 0 && S.settings.autobuy && !fullAutoOn()) {
    T.autoBuyAcc += dt;
    if (T.autoBuyAcc >= 3 / ab) {
      T.autoBuyAcc = 0;
      for (let i = GENS.length - 1; i >= 0; i--) {
        if (genUnitCost(i) <= S.fk * 0.3) buyGen(i, 1);
      }
    }
  }

  /* auto rebirth */
  if (hasNode('a2') && S.settings.autoRebirth && !fullAutoOn() && rebirthGain() >= Math.max(1, S.settings.autoRebirthAt)) {
    const g = rebirthGain();
    if (doRebirth()) bus.emit('toast', { title: 'Auto Rebirth', text: 'Gained ' + g + ' Rebirth Tokens.', tone: 'good' });
  }

  /* research lab auto buyers */
  if (calc.autoBuyEvery > 0 && S.settings.autobuy && !fullAutoOn()) {
    T.rAutoBuyAcc += dt;
    if (T.rAutoBuyAcc >= calc.autoBuyEvery) {
      T.rAutoBuyAcc = 0;
      for (let i = GENS.length - 1; i >= 0; i--) {
        if (genUnitCost(i) <= S.fk * 0.5) buyGen(i, 1);
      }
    }
  }
  if (calc.autoUpEvery > 0 && S.settings.autoupg && !fullAutoOn()) {
    T.rAutoUpAcc += dt;
    if (T.rAutoUpAcc >= calc.autoUpEvery) {
      T.rAutoUpAcc = 0;
      const list = availableUpgrades();
      let bought = 0;
      for (let i = 0; i < list.length && bought < 3; i++) {
        if (upgradeCost(list[i]) <= S.fk * 0.5 && buyUpgrade(list[i].id)) bought++;
      }
    }
  }

  tickResearch(dt);

  updateGoldens(now);

  T.kumAcc += dt;
  if (T.kumAcc >= 1) { T.kumAcc = 0; checkKumarUnlocks(); }
  T.rankAcc += dt;
  if (T.rankAcc >= 2) { T.rankAcc = 0; updateRank(); }

  T.achAcc += dt;
  if (T.achAcc >= 0.5) { T.achAcc = 0; checkAchievements(); }
  T.questAcc += dt;
  if (T.questAcc >= 1) { T.questAcc = 0; updateQuests(); }

  T.saveAcc += dt;
  if (S.settings.autosave > 0 && T.saveAcc >= S.settings.autosave) {
    T.saveAcc = 0;
    saveGame();
  }

  if (!isFinite(S.fk)) S.fk = LIMIT;
  bus.emit('tick', dt);
}

/* ---------- Boot ---------- */
function initGame(savedObj) {
  S = savedObj ? stateFromSaved(savedObj) : defaultState();
  T.last = Date.now();
  T.combo = 0;
  T.goldens = [];
  T.goldenAt = 0;
  recalc();
  updateRank();
  fillQuests();
  /* offline catch-up for returning players */
  let offline = null;
  if (savedObj && S.lastSave) {
    const away = (Date.now() - S.lastSave) / 1000;
    if (away > 60) offline = applyOffline(away);
  }
  recalc();
  scheduleGolden();
  T.ready = true;
  return offline;
}

function resetEverything() {
  try { localStorage.removeItem(SAVE_KEY); } catch (err) { /* ignore */ }
  S = defaultState();
  T.combo = 0;
  T.goldens = [];
  T.last = Date.now();
  T.lastRank = 0;
  T.rankMult = 1;
  T.boardCache = {};
  recalc();
  updateRank();
  fillQuests();
  scheduleGolden();
}

/* =====================================================================
   FINN KUMAR INCREMENTAL - static game data
   Generators, upgrades, prestige shops, pets, achievements, flavour text.

const SAVE_KEY = 'finn-kumar-incremental-v1';

/* ---------- Generators ---------- */

const GENS = [
  { id: 'fan',         name: 'Finn Fan',          plural: 'Finn Fans',          icon: '📣', cost: 15,      cps: 0.1,   desc: 'Cheers loudly from the cheap seats.' },

/* =====================================================================
   FINN KUMAR INCREMENTAL - tiny WebAudio sound engine (no files needed)
   Browsers only allow sound after a click, so the context is created lazily.
   ===================================================================== */

const sfx = (function () {
  let ctx = null;
  let master = null;
  let lastClickAt = 0;

  function ensure() {
    if (ctx) return ctx;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.18;
      master.connect(ctx.destination);
    } catch (err) {
      ctx = null;
    }
    return ctx;
  }

  function enabled() { return !!(S && S.settings && S.settings.sound); }

  function tone(freq, start, dur, type, vol, slideTo) {
    const c = ensure();
    if (!c || !enabled()) return;
    if (c.state === 'suspended') { try { c.resume(); } catch (err) { /* ignore */ } }
    const t0 = c.currentTime + start;
    const osc = c.createOscillator();
    const g = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.5, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(master);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function arp(notes, step, type, vol) {
    notes.forEach((n, i) => tone(n, i * step, step * 2.2, type || 'triangle', vol || 0.45));
  }

  return {
    unlock() { ensure(); },
    click(crit, combo) {
      const now = performance.now();
      if (now - lastClickAt < 35) return;
      lastClickAt = now;
      const base = 380 + (combo || 0) * 3.2;
      if (crit) {
        tone(base * 1.5, 0, 0.14, 'square', 0.35, base * 2.4);
        tone(base * 2, 0.04, 0.16, 'triangle', 0.4);
      } else {
        tone(base, 0, 0.07, 'triangle', 0.45, base * 1.35);
      }
    },
    buy() { tone(520, 0, 0.08, 'square', 0.28); tone(780, 0.06, 0.1, 'square', 0.28); },
    fail() { tone(180, 0, 0.12, 'sawtooth', 0.25, 120); },
    golden() { arp([660, 880, 1100, 1320], 0.06, 'triangle', 0.5); },
    goldenSpawn() { tone(1200, 0, 0.18, 'sine', 0.3, 1800); },
    achievement() { arp([523, 659, 784, 1046], 0.09, 'triangle', 0.5); },
    hatch() { arp([392, 494, 587, 784, 988], 0.07, 'square', 0.3); },
    rare() { arp([523, 659, 784, 1046, 1318, 1568], 0.08, 'triangle', 0.5); },
    prestige() { arp([262, 330, 392, 523, 659, 784, 1046], 0.08, 'sawtooth', 0.28); },
    win() { arp([440, 554, 659, 880], 0.08, 'triangle', 0.5); },
    tick() { tone(900, 0, 0.03, 'square', 0.18); },
    merge() { arp([330, 440, 554], 0.07, 'triangle', 0.45); }
  };
})();

/* ---------- Visual effects ---------- */
const fx = {
  layer: null,

  init() { this.layer = document.getElementById('fxLayer'); },

  enabled() { return !!(S && S.settings.particles); },

  floatText(x, y, text, cls) {
    if (!this.enabled() || !this.layer) return;
    if (this.layer.childElementCount > 70) return;
    const el = document.createElement('div');
    el.className = 'float-num ' + (cls || '');
    el.textContent = text;
    el.style.left = x + 'px';
    el.style.top = y + 'px';
    this.layer.appendChild(el);
    setTimeout(() => el.remove(), 1150);
  },

  confetti(x, y, count) {
    if (!this.enabled() || !this.layer) return;
    const colors = ['#ffd43b', '#ff5c9d', '#25d9a2', '#4cc9ff', '#ff9a3c', '#b05cff'];
    const n = Math.min(count || 24, 40);
    for (let i = 0; i < n; i++) {
      const el = document.createElement('div');
      el.className = 'confetti';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.background = colors[i % colors.length];
      el.style.setProperty('--dx', rand(-260, 260).toFixed(0) + 'px');
      el.style.setProperty('--rot', rand(-720, 720).toFixed(0) + 'deg');
      el.style.animationDuration = rand(1.2, 2.2).toFixed(2) + 's';
      this.layer.appendChild(el);
      setTimeout(() => el.remove(), 2300);
    }
  },

  burstCenter(count) {
    this.confetti(window.innerWidth / 2, window.innerHeight * 0.3, count);
  }
};

   FINN KUMAR INCREMENTAL - user interface
   Tabs are rendered to HTML strings. Numbers that change every frame are
   patched in place (data-live / data-bar / data-aff) so buttons never get
   replaced under the player's finger.
   ===================================================================== */

const $ = id => document.getElementById(id);

const ui = {
  tab: 'shop',
  dirty: true,
  sigs: {},
  busy: 0,
  navSig: '',
  buffSig: '',
  skinSig: '',
  newsAt: 0,
  newsLast: -1,
  wheelRot: 0,
  modalActions: [],
  goldenEls: {},
  catchResult: '',
  slotResult: '',
  wheelResult: '',
  board: 'life'
};

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ---------- Toasts and modals ---------- */
function toast(title, text, tone) {
  const box = $('toasts');
  if (!box) return;
  while (box.childElementCount >= 4) box.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = 'toast ' + (tone || '');
  el.innerHTML = '<b>' + esc(title) + '</b>' + (text ? esc(text) : '');
  box.appendChild(el);
  setTimeout(() => el.classList.add('out'), 3800);
  setTimeout(() => el.remove(), 4200);
}

function showModal(title, bodyHtml, actions) {
  ui.modalActions = actions || [{ label: 'OK', cls: 'btn-sun' }];
  $('modalRoot').innerHTML = '<div class="modal-back" data-mclose="1"><div class="modal" role="dialog" aria-modal="true">'
    + '<h3>' + esc(title) + '</h3>' + bodyHtml
    + '<div class="modal-actions">'
    + ui.modalActions.map((a, i) => '<button class="btn ' + (a.cls || '') + '" type="button" data-ma="' + i + '">' + esc(a.label) + '</button>').join('')
    + '</div></div></div>';
}

function closeModal() {
  $('modalRoot').innerHTML = '';
  ui.modalActions = [];
}

function confirmModal(title, body, yesLabel, yesCls, onYes) {
  showModal(title, '<p>' + body + '</p>', [
    { label: 'Cancel', cls: '' },
    { label: yesLabel, cls: yesCls || 'btn-sun', fn: onYes }
  ]);
}

/* ---------- Small formatting helpers ---------- */
function rarityLabel(r) { return '<span class="rt-' + r + '">' + RARITIES[r].name + '</span>'; }

function petEffectText(p) {
  const def = PET_BY_ID[p.id];
  const v = petBaseValue(p) * (calc.petAmp || 1);
  switch (def.kind) {
    case 'cps': return v >= 10 ? 'x' + fmt(1 + v) + ' production' : '+' + fmtPct(v) + ' production';
    case 'click': return '+' + fmtPct(v) + ' click power';
    case 'golden': return '+' + fmtPct(v) + ' golden Finns';
    default: return '-' + fmtPct(Math.min(0.5, v)) + ' generator cost';
  }
}

function afford(n) { return S.fk >= n; }

/* =====================================================================
   LIVE PATCHING
   ===================================================================== */
function liveText(key) {
  const p = key.split(':');
  const k = p[0];
  const a = p[1];
  switch (k) {
    case 'gcount': return String(S.gens[GENS[+a].id]);
    case 'gmeta': {
      const i = +a;
      const n = S.gens[GENS[i].id];
      const each = n > 0 ? calc.genCps[i] / n : GENS[i].cps * calc.genMult[GENS[i].id] * calc.globalMult;
      const share = calc.cps > 0 ? calc.genCps[i] / calc.cps : 0;
      const nm = nextMilestone(n);
      return fmt(each) + ' each, ' + fmt(calc.genCps[i]) + '/s total (' + fmtPct(share) + ')' + (nm ? ' | next bonus at ' + nm : ' | all bonuses done');
    }
    case 'gbuy': {
      const n = buyAmountFor(+a);
      return 'Buy x' + n;
    }
    case 'gcost': {
      const n = buyAmountFor(+a);
      return fmt(genBulkCost(+a, n));
    }
    case 'ucost': return fmt(upgradeCost(UP_BY_ID[a]));
    case 'ecost': {
      const egg = EGG_BY_ID[a];
      return fmt(eggCostFor(egg)) + (egg.currency === 'rt' ? ' Tokens' : '');
    }
    case 'ecost5': {
      const egg = EGG_BY_ID[a];
      return fmt(eggCostFor(egg) * 5);
    }
    case 'ecost25': {
      const egg = EGG_BY_ID[a];
      return fmt(eggCostFor(egg) * 25);
    }
    case 'rbtxt': {
      const g = rebirthGain();
      if (g < 1) return 'Earn ' + fmt(REBIRTH_MIN) + ' in one run to rebirth. This run: ' + fmt(S.runEarned);
      return 'Rebirth now for ' + fmtInt(g) + ' Rebirth Token' + (g > 1 ? 's' : '') + '. Next token at ' + fmt(nextRebirthAt(g + 1)) + ' this run.';
    }
    case 'rbmult': {
      const g = rebirthGain();
      const after = (1 + 0.04 * (S.rtTotal + g)) * (1 + 0.3 * lv('kapital'));
      return 'Token boost now x' + calc.rtMult.toFixed(2) + (g > 0 ? ' and x' + after.toFixed(2) + ' after rebirthing' : '');
    }
    case 'rbbal': return fmtInt(S.rt) + ' tokens';
    case 'trtxt': {
      const g = transcendGain();
      if (g < 1) return 'Collect ' + TRANSCEND_MIN_RT + ' Rebirth Tokens in one Transcend run. Now: ' + fmtInt(S.rtRun) + '.';
      return 'Transcend now for ' + fmtInt(g) + ' Shard' + (g > 1 ? 's' : '') + '.';
    }
    case 'trmult': return 'Shard boost now x' + calc.shardMult.toFixed(2);
    case 'trbal': return fmtInt(S.shards) + ' shards';
    case 'astxt': {
      const g = ascendGain();
      if (g < 1) return 'Collect ' + ASCEND_MIN_SHARDS + ' Shards in one Ascension run. Now: ' + fmtInt(S.shardRun) + '.';
      return 'Ascend now for ' + fmtInt(g) + ' Crown' + (g > 1 ? 's' : '') + '.';
    }
    case 'asmult': return 'Crown boost now x' + fmt(calc.crownMult);
    case 'megatxt': {
      if (S.crownRun < MEGA_CROWNS) return 'Earn ' + fmt(MEGA_CROWNS) + ' Crowns this cycle. Now: ' + fmt(S.crownRun) + '.';
      return 'Ready! Mega Evolve for +1 star on your Kumar and every pet.';
    }
    case 'asbal': return fmtInt(S.crowns) + ' crowns';
    case 'q': {
      const q = S.quests.find(x => x.uid === +a);
      if (!q) return '';
      return fmt(questProgress(q)) + ' / ' + fmt(q.target);
    }
    case 'rpbal': return fmtInt(S.rp) + ' RP';
    case 'rptxt': {
      const left = Math.max(0, calc.rpInterval - S.rpProgress);
      return 'Next research in ' + fmtTime(Math.ceil(left)) + ' (+' + calc.rpPerCycle + ' RP). Cycle length ' + fmtTime(Math.round(calc.rpInterval)) + '.';
    }
    case 'kumtxt': {
      const k = KUMAR_BY_ID[a];
      const pr = k.prog();
      return k.id === 'julian' ? fmt(pr[0]) + ' / ' + fmt(pr[1]) : Math.floor(pr[0]) + ' / ' + pr[1];
    }
    case 'mstxt': {
      const x = S.missions.find(m => m.u === +a);
      if (!x) return '';
      const left = (x.end - Date.now()) / 1000;
      return left > 0 ? fmtTime(Math.ceil(left)) + ' left' : 'Done!';
    }
    case 'lbv': {
      const rows = getBoard(ui.board);
      const r = rows.find(x => x.id === a);
      return r ? (ui.board === 'clicks' ? fmtInt(r.value) : fmt(r.value)) : '';
    }
    case 'rankinfo': {
      const rows = getBoard('life');
      const me = rows.find(r => r.you);
      const b = rankBonusFor(me.rank);
      return 'You are ranked #' + me.rank + ' of ' + rows.length + '. Rank bonus: ' + (b > 0 ? '+' + Math.round(b * 100) + '% production' : 'none yet (reach the top 8)') + '.';
    }
    case 'wheel': {
      const left = (S.wheelNext - Date.now()) / 1000;
      return left > 0 ? 'Ready in ' + fmtTime(left) : 'Spin it!';
    }
    case 'catch': {
      const left = (S.catcherNext - Date.now()) / 1000;
      return left > 0 ? 'Ready in ' + fmtTime(left) : 'Start round';
    }
    case 'slotbet': {
      const pct = +a;
      return fmt(Math.floor(S.fk * pct));
    }
    default: return '';
  }
}

function liveBar(key) {
  const p = key.split(':');
  const k = p[0];
  const a = p[1];
  switch (k) {
    case 'gbar': {
      const n = S.gens[GENS[+a].id];
      const nx = nextMilestone(n);
      if (!nx) return 1;
      const pv = prevMilestone(n);
      return (n - pv) / (nx - pv);
    }
    case 'q': {
      const q = S.quests.find(x => x.uid === +a);
      return q ? questProgress(q) / q.target : 0;
    }
    case 'rp': return clamp(S.rpProgress / calc.rpInterval, 0, 1);
    case 'kum': { const pr = KUMAR_BY_ID[a].prog(); return pr[0] / pr[1]; }
    case 'ms': {
      const x = S.missions.find(m => m.u === +a);
      return x ? clamp((Date.now() - x.start) / (x.end - x.start), 0, 1) : 0;
    }
    case 'rb': return clamp(S.runEarned / REBIRTH_MIN, 0, 1);
    case 'tr': return clamp(S.rtRun / TRANSCEND_MIN_RT, 0, 1);
    case 'as': return clamp(S.shardRun / ASCEND_MIN_SHARDS, 0, 1);
    case 'mega': return clamp(Math.log10(Math.max(1, S.crownRun)) / Math.log10(MEGA_CROWNS), 0, 1);
    default: return 0;
  }
}

function liveAff(key) {
  const p = key.split(':');
  const k = p[0];
  const a = p[1];
  switch (k) {
    case 'gen': { const i = +a; return genMaxAfford(i, S.fk) >= 1 && S.fk >= genBulkCost(i, buyAmountFor(i)); }
    case 'up': return S.fk >= upgradeCost(UP_BY_ID[a]);
    case 'egg': {
      const egg = EGG_BY_ID[a];
      return eggBalance(egg) >= eggCostFor(egg) * (+p[2] || 1);
    }
    case 'rt': { const d = RT_BY_ID[a]; return lv(a) < d.max && S.rt >= rtUpgradeCost(d, lv(a)); }
    case 'node': { const n = SHARD_BY_ID[a]; return !hasNode(a) && nodeAvailable(n) && S.shards >= n.cost; }
    case 'crown': { const d = CROWN_BY_ID[a]; return crownLv(a) < d.max && S.crowns >= crownPerkCost(d, crownLv(a)); }
    case 'rp': { const d = RP_BY_ID[a]; return rl(a) < d.max && S.rp >= rpCost(d, rl(a)); }
    case 'msstart': return missionOpen(MISSION_BY_ID[a]) && S.missions.length < calc.missionSlots && eligibleKumars().length > 0;
    case 'rebirth': return rebirthGain() >= 1;
    case 'transcend': return transcendGain() >= 1;
    case 'ascend': return ascendGain() >= 1;
    case 'mega': return megaReady();
    case 'wheel': return wheelReady() && !ui.wheelSpinning;
    case 'catch': return catcherReady() && !catcher.running;
    case 'slot': return !ui.slotBusy && Math.floor(S.fk * (+a)) >= 1;
    case 'allup': return availableUpgrades().some(u => S.fk >= upgradeCost(u));
    default: return false;
  }
}

function patchLive(root) {
  root.querySelectorAll('[data-live]').forEach(el => {
    const t = liveText(el.getAttribute('data-live'));
    if (el.textContent !== t) el.textContent = t;
  });
  root.querySelectorAll('[data-bar]').forEach(el => {
    el.style.width = (clamp(liveBar(el.getAttribute('data-bar')), 0, 1) * 100).toFixed(1) + '%';
  });
  root.querySelectorAll('[data-aff]').forEach(el => {
    const ok = !!liveAff(el.getAttribute('data-aff'));
    el.classList.toggle('afford', ok);
    if (el.tagName === 'BUTTON' && el.hasAttribute('data-btn')) el.disabled = !ok;
  });
}

function onSpin() {
  if (ui.wheelSpinning) return;
  const r = spinWheel();
  if (!r) return;
  ui.wheelSpinning = true;
  ui.busy++;
  const n = WHEEL_PRIZES.length;
  const seg = 360 / n;
  const center = r.index * seg + seg / 2;
  const base = ui.wheelRot - (ui.wheelRot % 360);
  ui.wheelRot = base + 360 * 6 + (360 - center);
  const w = $('wheel');
  $('wheelResult').textContent = 'Spinning...';
  if (w) {
    void w.offsetWidth;
    w.style.transition = 'transform 4.2s cubic-bezier(0.12, 0.7, 0.1, 1)';
    w.style.transform = 'rotate(' + ui.wheelRot + 'deg)';
  }
  const tickTimer = setInterval(() => sfx.tick(), 260);
  setTimeout(() => {
    clearInterval(tickTimer);
    ui.wheelSpinning = false;
    ui.busy = Math.max(0, ui.busy - 1);
    ui.wheelResult = r.prize.label + ': ' + r.text;
    const el = $('wheelResult');
    if (el) el.textContent = ui.wheelResult;
    toast('Lucky Wheel', r.prize.label + ' - ' + r.text, 'gold');
    sfx.win();
    fx.burstCenter(30);
  }, 4300);
}

/* Finn Catcher */
function catcherHud() {
  const t = $('catchTime');
  const s = $('catchScore');
  if (t) t.textContent = catcher.left;
  if (s) s.textContent = catcher.score;
}

function startCatcher() {
  if (!catcherReady() || catcher.running) return;
  const arena = $('arena');
  if (!arena) return;
  catcher.running = true;
  catcher.score = 0;
  catcher.left = CATCHER_LENGTH;
  ui.busy++;
  arena.innerHTML = '';
  ui.catchResult = '';
  $('catchResult').textContent = '';
  catcherHud();
  catcher.tickT = setInterval(() => {
    catcher.left--;
    catcherHud();
    if (catcher.left <= 0) endCatcher(false);
  }, 1000);
  const spawn = () => {
    if (!catcher.running) return;
    spawnTarget();
    const elapsed = CATCHER_LENGTH - catcher.left;
    catcher.spawnT = setTimeout(spawn, Math.max(260, 720 - elapsed * 16));
  };
  spawn();
}

function spawnTarget() {
  const a = $('arena');
  if (!a) return;
  const w = a.clientWidth;
  const h = a.clientHeight;
  if (w < 80) return;
  const r = Math.random();
  const kind = r < 0.09 ? 'bomb' : r < 0.22 ? 'gold' : 'normal';
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'target' + (kind === 'gold' ? ' gold' : kind === 'bomb' ? ' bomb' : '');
  el.setAttribute('data-kind', kind);
  el.textContent = kind === 'gold' ? '⭐' : kind === 'bomb' ? '💣' : '😄';
  el.style.left = rand(34, w - 34).toFixed(0) + 'px';
  el.style.top = rand(34, h - 34).toFixed(0) + 'px';
  a.appendChild(el);
  setTimeout(() => el.remove(), kind === 'bomb' ? 1700 : 1250);
}

function endCatcher(abort) {
  if (!catcher.running) return;
  catcher.running = false;
  clearInterval(catcher.tickT);
  clearTimeout(catcher.spawnT);
  ui.busy = Math.max(0, ui.busy - 1);
  const a = $('arena');
  if (a) a.innerHTML = '';
  if (abort) return;
  const res = finishCatcher(catcher.score);
  ui.catchResult = 'Score ' + res.score + ': +' + fmt(res.amt) + ' Finn Kumar' + res.extra;
  const el = $('catchResult');
  if (el) el.textContent = ui.catchResult;
  toast('Finn Catcher', ui.catchResult, 'gold');
  sfx.win();
  if (res.score >= 20) fx.burstCenter(24);
}

function onArenaClick(ev) {
  const t = ev.target.closest('.target');
  if (!t || !catcher.running) return;
  const kind = t.getAttribute('data-kind');
  const rect = t.getBoundingClientRect();
  const x = rect.left + rect.width / 2;
  const y = rect.top;
  if (kind === 'bomb') {
    catcher.score = Math.max(0, catcher.score - 3);
    fx.floatText(x, y, '-3', 'crit');
    sfx.fail();
  } else {
    const pts = kind === 'gold' ? 3 : 1;
    catcher.score += pts;
    fx.floatText(x, y, '+' + pts, kind === 'gold' ? 'crit' : 'small');
    sfx.tick();
  }
  t.remove();
  catcherHud();
}

/* Finn Slots */
function doSlot(pct) {
  if (ui.slotBusy) return;
  const bet = Math.floor(S.fk * pct);
  if (bet < 1) { toast('Not enough Finn Kumar', 'Earn a bit more first.', 'bad'); return; }
  const res = slotSpin(bet);
  if (!res) return;
  ui.slotBusy = true;
  ui.busy++;
  const reels = [$('reel0'), $('reel1'), $('reel2')];
  reels.forEach(r => r && r.classList.add('spin'));
  const spinT = setInterval(() => {
    reels.forEach((r, i) => { if (r && r.classList.contains('spin')) r.textContent = pickOne(SLOT_SYMBOLS).s; });
    sfx.tick();
  }, 80);
  [600, 950, 1300].forEach((ms, i) => {
    setTimeout(() => {
      if (reels[i]) { reels[i].classList.remove('spin'); reels[i].textContent = res.reels[i]; }
    }, ms);
  });
  setTimeout(() => {
    clearInterval(spinT);
    ui.slotBusy = false;
    ui.busy = Math.max(0, ui.busy - 1);
    let msg;
    if (res.kind === 'jackpot') msg = 'JACKPOT! +' + fmt(res.payout);
    else if (res.kind === 'triple') msg = 'Triple! +' + fmt(res.payout);
    else if (res.kind === 'pair') msg = 'Pair! +' + fmt(res.payout);
    else msg = 'No match. -' + fmt(res.bet);
    ui.slotResult = msg;
    const el = $('slotResult');
    if (el) el.textContent = msg;
    if (res.kind === 'jackpot' || res.kind === 'triple') { sfx.win(); fx.burstCenter(res.kind === 'jackpot' ? 40 : 16); }
    else if (res.kind === 'pair') sfx.buy();
    else sfx.fail();
  }, 1400);
}

function rewardText(r) {
  const parts = [fmt(r.fk) + ' Finn Kumar'];

  if (r.rt > 0 && S.rebirths >= 1) parts.push(r.rt + ' Rebirth Token' + (r.rt > 1 ? 's' : ''));
  if (r.egg > 0) parts.push(Math.round(r.egg * 100) + '% free egg');
  return parts.join(', ');

      h += '<div class="quest' + (done ? ' done' : '') + '"><div><div class="quest-title">' + m.icon + ' ' + esc(m.name) + ' with ' + esc(k.name) + '</div>'

      + '<div class="shop-desc">' + esc(m.desc) + '</div>'
      + '<div class="shop-cost">About ' + esc(fmt(calc.cps * m.fkSec + 100 * m.mins)) + ' Finn Kumar' + (m.rp ? ', ' + m.rp + ' RP' : '') + (m.rt ? ', ' + m.rt + ' token' + (m.rt > 1 ? 's' : '') : '') + ', ' + Math.round(m.egg * 100) + '% egg</div>'

function openMissionPicker(mid) {
  const m = MISSION_BY_ID[mid];
  const list = eligibleKumars();
  if (!list.length) { toast('No Kumar free', 'Unlock more Kumars or wait for one to return.', 'bad'); return; }
  if (S.missions.length >= calc.missionSlots) { toast('All slots busy', 'Collect a finished mission or buy a Mission Slot in Research.', 'bad'); return; }
  const body = '<p>' + esc(m.name) + ' takes ' + fmtTime(missionDur(m)) + '. Who should go?</p><ul>'
    + list.map(k => '<li><b>' + esc(k.name) + '</b>: ' + esc(rewardText(missionReward(m, k.id))) + '</li>').join('') + '</ul>';
  const actions = [{ label: 'Cancel', cls: '' }].concat(list.map(k => ({
    label: k.icon + ' ' + k.name,
    cls: 'btn-sun',
    fn: () => {
      const r = startMission(mid, k.id);
      if (r === 'ok') { toast('Mission started', k.name + ' is off on ' + m.name + '.', 'good'); sfx.buy(); }
      else toast('Could not start', 'Try again.', 'bad');
      ui.dirty = true;
    }
  })));
  showModal('Send a Kumar', body, actions);
}
