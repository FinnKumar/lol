   ===================================================================== */
const TABS = [
  { id: 'shop', label: 'Shop', render: renderShop, sig: shopSig, badge: () => 0 },
  { id: 'upgrades', label: 'Upgrades', render: renderUpgrades, sig: upgradesSig, badge: () => availableUpgrades().filter(u => S.fk >= upgradeCost(u)).length },
  { id: 'kumars', label: 'Kumars', render: renderKumars, sig: kumarsSig, badge: () => 0 },
  { id: 'research', label: 'Research', render: renderResearch, sig: researchSig, badge: () => RP_UPGRADES.filter(d => rl(d.id) < d.max && S.rp >= rpCost(d, rl(d.id))).length },
  { id: 'missions', label: 'Missions', render: renderMissions, sig: missionsSig, badge: () => S.missions.filter(missionDone).length },
  { id: 'pets', label: 'Pets', render: renderPets, sig: petsSig, badge: () => 0 },
  { id: 'prestige', label: 'Prestige', render: renderPrestige, sig: prestigeSig, badge: () => (rebirthGain() >= 1 ? 1 : 0) + (transcendGain() >= 1 ? 1 : 0) + (ascendGain() >= 1 ? 1 : 0) + (megaReady() ? 1 : 0) },
  { id: 'quests', label: 'Quests', render: renderQuests, sig: questsSig, badge: () => S.quests.filter(q => q.done).length },
  { id: 'arcade', label: 'Arcade', render: renderArcade, sig: () => '', badge: () => (wheelReady() ? 1 : 0) + (catcherReady() ? 1 : 0) },
  { id: 'board', label: 'Board', render: renderBoardTab, sig: boardSig, badge: () => 0 },
  { id: 'stats', label: 'Stats', render: renderStats, sig: statsSig, badge: () => 0 },
  { id: 'settings', label: 'Settings', render: renderSettings, sig: settingsSig, badge: () => 0 }
];
const TAB_BY_ID = {};
TABS.forEach(t => { TAB_BY_ID[t.id] = t; });

function renderNav() {
  const sig = ui.tab + '|' + TABS.map(t => t.badge()).join(',');
  if (sig === ui.navSig) return;
  ui.navSig = sig;
  $('tabs').innerHTML = TABS.map(t => {
    const b = t.badge();
    return '<button class="tab-btn' + (t.id === ui.tab ? ' active' : '') + '" type="button" data-act="tab" data-id="' + t.id + '">' + t.label
      + (b > 0 ? '<span class="tab-badge">' + (b > 99 ? '99+' : b) + '</span>' : '') + '</button>';
  }).join('');
}

function renderTab() {
  const t = TAB_BY_ID[ui.tab];
  $('tabBody').innerHTML = t.render();
  ui.sigs[t.id] = t.sig();
  ui.dirty = false;
  patchLive($('tabBody'));
}

function switchTab(id) {
  if (!TAB_BY_ID[id] || id === ui.tab) return;
  if (ui.tab === 'arcade') endCatcher(true);
  ui.tab = id;
  ui.dirty = true;
  ui.navSig = '';
  renderNav();
  renderTab();
}

function updateTabs() {
  const t = TAB_BY_ID[ui.tab];
  const s = t.sig();
  if (ui.dirty || s !== ui.sigs[t.id]) {
    if (!(ui.tab === 'arcade' && ui.busy > 0)) renderTab();
  } else {
    patchLive($('tabBody'));
  }
  renderNav();
}

/* =====================================================================
   STAGE (left column + top bar)
   ===================================================================== */
function updateStage() {
  $('bankNum').textContent = fmtInt(S.fk);
  $('bankRate').textContent = fmt(calc.cps) + ' per second';
  $('infoClick').textContent = fmt(clickValueNow(true));
  $('infoCrit').textContent = fmtPct(calc.crit);
  $('infoPets').textContent = 'x' + (calc.petCpsMult < 1000 ? calc.petCpsMult.toFixed(2) : fmt(calc.petCpsMult));
  $('comboText').textContent = 'x' + comboFactor().toFixed(2);
  $('comboFill').style.width = T.combo.toFixed(0) + '%';
  $('finnTitle').textContent = currentTitle();
  $('qsMult').textContent = 'x' + fmt(calc.globalMult);
  $('qsAch').textContent = achievementCount() + '/' + ACHIEVEMENTS.length;
  $('qsRt').textContent = fmtInt(S.rt);
  $('qsRp').textContent = fmtInt(S.rp);
  $('qsRank').textContent = T.rank ? '#' + T.rank : '-';
  $('qsKum').textContent = Object.keys(S.kumarsUnlocked).length + '/' + KUMARS.filter(k => !k.hidden || S.kumarsUnlocked[k.id]).length;

  const buffed = S.buffs.some(b => b.kind === 'cps' && b.mult >= 7);
  const mood = moodFor(T.combo, buffed);
  const kum = KUMAR_BY_ID[S.kumar] || KUMARS[0];
  const skinSig = S.kumar + '|' + kumarStar(S.kumar) + '|' + S.skin + '|' + mood + '|' + (S.ascensions > 0 ? 'a' : S.transcends > 0 ? 't' : S.rebirths > 0 ? 'r' : 'n');
  if (skinSig !== ui.skinSig) {
    ui.skinSig = skinSig;
    $('finnSvg').innerHTML = eggSvgMarkup(S.kumar, S.skin, mood, false, '');
    const skin = SKIN_BY_ID[S.skin] || SKINS[0];
    $('finnStage').style.setProperty('--aura-a', S.skin === 'classic' ? kum.aura : skin.aura);
    $('finnBtn').classList.toggle('hype', mood === 'hype' || mood === 'wild');
    $('finnName').textContent = kum.egg + (kumarStar(S.kumar) ? ' ' + starText(kumarStar(S.kumar)) : '');
    $('kumarBoost').textContent = kum.boost;
  }

  /* buff chips */
  const bsig = S.buffs.map(b => b.id).join(',');
  const box = $('buffs');
  if (bsig !== ui.buffSig) {
    ui.buffSig = bsig;
    box.innerHTML = S.buffs.map(b => '<span class="buff-chip ' + (b.tone || '') + '" data-bid="' + esc(b.id) + '">' + esc(b.name)
      + (b.kind === 'cps' || b.kind === 'click' || b.kind === 'gen' || b.kind === 'pet' ? ' x' + b.mult : b.kind === 'cost' ? ' -50%' : '')
      + '<span class="t"></span></span>').join('');
  }
  const now = Date.now();
  box.querySelectorAll('.buff-chip').forEach(el => {
    const b = S.buffs.find(x => x.id === el.getAttribute('data-bid'));
    if (b) el.lastChild.textContent = Math.max(0, Math.ceil((b.until - now) / 1000)) + 's';
  });

  /* ticker */
  if (now >= ui.newsAt) {
    ui.newsAt = now + 9000;
    let i;
    do { i = Math.floor(Math.random() * NEWS.length); } while (i === ui.newsLast && NEWS.length > 1);
    ui.newsLast = i;
    const el = $('tickerText');
    el.style.animation = 'none';
    void el.offsetWidth;
    el.style.animation = '';
    el.textContent = NEWS[i];
  }

  $('btnSound').classList.toggle('off', !S.settings.sound);
  $('btnFx').classList.toggle('off', !S.settings.particles);
}

/* =====================================================================
   GOLDEN FINNS (floating clickable bonuses)
   ===================================================================== */
function addGoldenEl(g) {
  const el = document.createElement('button');
  el.type = 'button';
  el.className = 'golden' + (g.mini ? ' mini' : '');
  el.textContent = g.mini ? 'Mini' : 'Golden Finn';
  el.setAttribute('aria-label', 'Golden Finn bonus, click it');
  el.style.left = (g.x * window.innerWidth).toFixed(0) + 'px';
  el.style.top = (g.y * window.innerHeight).toFixed(0) + 'px';
  el.addEventListener('click', ev => {
    ev.stopPropagation();
    const rect = el.getBoundingClientRect();
    const res = clickGolden(g.uid);
    if (res) {
      fx.confetti(rect.left + rect.width / 2, rect.top + rect.height / 2, g.mini ? 6 : 22);
      fx.floatText(rect.left + rect.width / 2, rect.top, res.name, 'crit');
    }
  });
  $('goldenRoot').appendChild(el);
  ui.goldenEls[g.uid] = el;
}

/* =====================================================================
   EVENT WIRING
   ===================================================================== */
function onFinnPress(ev) {
  sfx.unlock();
  const r = doClick(false);
  const btn = $('finnBtn');

function wireEvents() {
  const finnBtn = $('finnBtn');
  finnBtn.addEventListener('pointerdown', ev => {
    if (ev.button !== undefined && ev.button > 0) return;
    onFinnPress(ev);
  });
  finnBtn.addEventListener('click', ev => { if (ev.detail === 0) onFinnPress(ev); });
  finnBtn.addEventListener('contextmenu', ev => ev.preventDefault());

  const onAct = ev => {
    const el = ev.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.getAttribute('data-act')];
    if (fn) fn(el.dataset, el);
  };
  $('tabBody').addEventListener('click', ev => {
    if (ev.target.closest('#arena')) { onArenaClick(ev); return; }
    onAct(ev);
  });
  $('tabs').addEventListener('click', onAct);

  $('tabBody').addEventListener('change', ev => {
    const nameEl = ev.target.closest('[data-name]');
    if (nameEl) {
      S.playerName = (nameEl.value || '').trim().slice(0, 16) || 'You';
      T.boardCache = {};
      ui.dirty = true;
      return;
    }
    const el = ev.target.closest('[data-set]');
    if (!el) return;
    const key = el.getAttribute('data-set');
    let v;
    if (el.type === 'checkbox') v = el.checked;
    else if (el.type === 'number') v = Math.max(1, Math.floor(+el.value) || 1);
    else if (key === 'autosave') v = +el.value;
    else v = el.value;
    S.settings[key] = v;
    if (key === 'notation') ui.dirty = true;
  });

  $('tabBody').addEventListener('keydown', ev => {
    if (ev.key === 'Enter' && ev.target && ev.target.id === 'codeInput') ACTIONS.redeem();
  });

  $('modalRoot').addEventListener('click', ev => {
    const btn = ev.target.closest('[data-ma]');
    if (btn) {
      const a = ui.modalActions[+btn.getAttribute('data-ma')];
      closeModal();
      if (a && a.fn) a.fn();
      return;
    }
    if (ev.target.classList.contains('modal-back')) closeModal();
  });
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

  $('btnSound').addEventListener('click', () => { S.settings.sound = !S.settings.sound; sfx.unlock(); if (S.settings.sound) sfx.buy(); ui.dirty = ui.tab === 'settings'; });
  $('btnFx').addEventListener('click', () => { S.settings.particles = !S.settings.particles; ui.dirty = ui.tab === 'settings'; });
  $('btnSave').addEventListener('click', () => ACTIONS.savenow());

  window.addEventListener('beforeunload', () => saveGame());
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
}

}

/* =====================================================================
   FINN KUMAR INCREMENTAL - boot
   ===================================================================== */
(function boot() {
  const saved = readSave();
  const offline = initGame(saved);
  fx.init();
  wireEvents();
  wireBus();

  ui.skinSig = '';
  updateStage();
  renderNav();
  renderTab();

  /* the arena delegate lives on tabBody; make sure Finn art is present immediately */
  if (offline && offline.gain > 0) showOfflineModal(offline);
  if (!saved) {
    toast('Welcome to Finn Kumar Incremental', 'Click Finn to earn Finn Kumar. Buy generators to earn it while you are away.', 'gold');
  }

  /* simulation runs 10 times a second */
  setInterval(function () {
    try { tick(); } catch (err) { console.error('tick failed', err); }
  }, 100);

  /* the screen refreshes a little slower than the simulation */
  setInterval(function () {
    try {
      updateStage();
      updateTabs();
    } catch (err) {
      console.error('render failed', err);
    }
  }, 150);

  /* periodic checks that do not need to run every frame */
  setInterval(function () {
    try { recalc(); } catch (err) { console.error(err); }
  }, 1000);
})();

function step(name, fn) { try { fn(); } catch (err) { console.error('[finn-patch:' + name + ']', err); } }

function wrap(name, make) {
  const orig = window[name];
  if (typeof orig !== 'function') { console.warn('[finn-patch] missing function ' + name); return null; }
  window[name] = make(orig);

const hasOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function safeNum(x) { return typeof x === 'number' && isFinite(x) ? x : 0; }
function cleanName(s) { return String(s || '').replace(/[\u0000-\u001f<>&"'`\\]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16); }

function ensureFields(st) {
  GENS.forEach(g => { if (typeof st.gens[g.id] !== 'number' || st.gens[g.id] < 0) st.gens[g.id] = 0; });

/* =====================================================================
   1. BUG FIXES
   ===================================================================== */
step('fixes', () => {
  /* Importing a hand-edited save could poison Object.prototype through "__proto__". */
  window.mergeState = function safeMerge(base, saved) {
    for (const key in saved) {
      if (!hasOwn(saved, key) || key === '__proto__' || key === 'constructor' || key === 'prototype') continue;
      const sv = saved[key];
      if (isPlainObject(sv) && hasOwn(base, key) && isPlainObject(base[key])) window.mergeState(base[key], sv);
      else if (sv !== undefined && sv !== null) base[key] = sv;
    }
    return base;
  };

  /* Typing "constructor" or "toString" used to count as a redeemed code. */
  window.redeemCode = function (raw) {
    const code = String(raw || '').trim().toLowerCase();
    if (!code) return { ok: false, msg: 'Type a code first.' };
    if (!hasOwn(CODES, code)) return { ok: false, msg: 'That code is not valid.' };
    if (hasOwn(S.codes, code)) return { ok: false, msg: 'You already used that code.' };
    const def = CODES[code];
    S.codes[code] = Date.now();
    recalc();
    def.apply();
    recalc();
    saveGame();
    return { ok: true, title: def.title, msg: def.msg };
  };

  /* Corrupt or edited saves could leave NaN in counters and break the UI. */
  wrap('stateFromSaved', orig => function (obj) {
    const st = orig(obj);
    ['counters', 'stats'].forEach(k => {
      for (const key in st[k]) if (typeof st[k][key] !== 'number' || !isFinite(st[k][key])) st[k][key] = 0;
    });
    const now = Date.now();
    if (!(st.playtime >= 0) || !isFinite(st.playtime)) st.playtime = 0;
    ['created', 'lastSave', 'runStart'].forEach(k => { if (typeof st[k] !== 'number' || !isFinite(st[k]) || st[k] > now) st[k] = now; });
    ['wheelNext', 'catcherNext'].forEach(k => { if (typeof st[k] !== 'number' || !isFinite(st[k])) st[k] = 0; });
    ensureFields(st);
    try { localStorage.setItem('fk-player-id', st.pid); } catch (e) { /* ignore */ }
    return st;
  });

  wrap('defaultState', orig => function () { const st = orig(); ensureFields(st); return st; });

  /* "Save Now" used to save three times. */
  ACTIONS.savenow = () => {
    const ok = saveGame();
    toast(ok ? 'Game saved' : 'Could not save', ok ? 'Stored in this browser.' : 'Browser storage is blocked here. Use Export to keep your progress.', ok ? 'good' : 'bad');
    if (typeof submitScore === 'function') submitScore();
  };
});

function boostText(b) {
  const parts = [];
  if (b.prod) parts.push('Production x' + fmt(b.prod));
  if (b.click) parts.push('Click power x' + fmt(b.click));
  if (b.gold) parts.push('Golden Finns x' + fmt(b.gold) + ' more often');
  if (b.pet) parts.push('Pets x' + fmt(b.pet));
  if (b.rp) parts.push('Research x' + fmt(b.rp) + ' faster');
  return parts.length ? parts.join(', ') : 'No boost, just a name.';
}

function titleFx() {
  const out = { prod: 1, click: 1, gold: 1, pet: 1, rp: 1 };
  if (!S || !S.titlesOwned) return out;
  const n = Object.keys(S.titlesOwned).length;
  out.prod *= 1 + 0.01 * Math.max(0, n - 1);
  const t = TITLE_BY_ID[S.titleSel];
  if (t && S.titlesOwned[t.id]) for (const k in t.boost) out[k] *= t.boost[k];
  return out;
}

function grantTitle(id, equip) {
  if (!TITLE_BY_ID[id]) return;
  if (!S.titlesOwned[id]) S.titlesOwned[id] = Date.now();
  if (equip) S.titleSel = id;
  recalc();
  ui.dirty = true;
}

let titleFirst = true;
function checkTitles() {
  const fresh = [];
  MY_TITLES.forEach(t => {
    if (S.titlesOwned[t.id]) return;
    let ok = false;
    try { ok = !!t.check(); } catch (e) { ok = false; }
    if (ok) { S.titlesOwned[t.id] = Date.now(); fresh.push(t); }
  });
  if (!fresh.length) return;
  recalc();
  ui.dirty = ui.dirty || ui.tab === 'profile';
  if (titleFirst) return;
  if (fresh.length <= 2) fresh.forEach(t => toast('New title: ' + t.name, boostText(t.boost), 'gold'));
  else toast(fresh.length + ' new titles!', 'Open the Profile tab to equip one.', 'gold');
  sfx.achievement();
}

/* =====================================================================
   6. RESTORE THINGS THE ORIGINAL LOADER DROPPED, THEN BACKFILL
   (the game booted before this file ran, so new Kumars/pets in an
   existing save were filtered out as "unknown")
   ===================================================================== */
step('restore', () => {
  ensureFields(S);
  const raw = readSave();
  if (raw) {
    if (isPlainObject(raw.kumarsUnlocked)) {
      Object.keys(raw.kumarsUnlocked).forEach(id => { if (KUMAR_BY_ID[id] && !S.kumarsUnlocked[id]) S.kumarsUnlocked[id] = raw.kumarsUnlocked[id]; });
    }
    if (typeof raw.kumar === 'string' && KUMAR_BY_ID[raw.kumar] && S.kumarsUnlocked[raw.kumar]) S.kumar = raw.kumar;
    if (Array.isArray(raw.pets)) {
      raw.pets.forEach(p => {
        if (p && PET_BY_ID[p.id] && typeof p.u === 'number' && !findPet(p.u)) S.pets.push({ u: p.u, id: p.id, lvl: clamp(p.lvl | 0, 0, PET_MAX_LEVEL), star: clamp(p.star | 0, 0, MEGA_MAX_STARS) });
      });
      S.pets.forEach(p => { S.petDex[p.id] = S.petDex[p.id] || 1; });
    }
    if (Array.isArray(raw.equipped)) {
      raw.equipped.forEach(u => { if (findPet(u) && S.equipped.indexOf(u) < 0 && S.equipped.length < calc.slots + 4) S.equipped.push(u); });
    }
    if (raw.titlesOwned && isPlainObject(raw.titlesOwned)) {
      Object.keys(raw.titlesOwned).forEach(id => { if (TITLE_BY_ID[id]) S.titlesOwned[id] = raw.titlesOwned[id]; });
    }
  }
  /* codes redeemed in earlier versions */
  if (hasOwn(S.codes, '666')) S.titlesOwned.code666 = S.titlesOwned.code666 || Date.now();
  if (hasOwn(S.codes, '123')) {
    S.titlesOwned.code123 = S.titlesOwned.code123 || Date.now();
    S.kumarsUnlocked.kasi = S.kumarsUnlocked.kasi || Date.now();
  }
  if (S.titleSel && !S.titlesOwned[S.titleSel]) S.titleSel = '';
  checkTitles();
  titleFirst = false;
  recalc();
});

const net = { rows: [], loaded: false, err: '', at: 0, cache: null, cacheAt: 0 };
let origGetBoard = null;

function online() { return !!DB; }

function myRecord() {
  const rec = { name: cleanName(S.playerName) || 'You', title: currentTitle(), kumar: S.kumar, t: Date.now() };
  const cap = x => Math.min(1e300, safeNum(x));
  rec.life = cap(S.lifeEarned);
  rec.cps = cap(S.stats.bestCps);
  rec.clicks = cap(S.counters.clicks);
  EXTRA_BOARDS.forEach(b => { rec[b.id] = cap(b.get()); });
  return rec;
}

function submitScore() {
  if (!online() || !S) return Promise.resolve();
  return fetch(DB + '/scores/' + encodeURIComponent(S.pid) + '.json', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(myRecord())
  }).then(r => { net.err = r.ok ? '' : 'HTTP ' + r.status; }).catch(() => { net.err = 'offline'; });
}

function refreshBoard() {
  if (!online()) return Promise.resolve();
  return fetch(DB + '/scores.json').then(r => r.json()).then(data => {
    const rows = [];
    const now = Date.now();
    if (data && typeof data === 'object') {
      Object.keys(data).forEach(id => {
        const d = data[id];
        if (!d || typeof d !== 'object' || id === S.pid || typeof d.life !== 'number') return;
        if (now - safeNum(d.t) > 30 * 864e5) return;
        const vals = { life: safeNum(d.life), cps: safeNum(d.cps), clicks: safeNum(d.clicks) };
        EXTRA_BOARDS.forEach(b => { vals[b.id] = safeNum(d[b.id]); });
        const kum = KUMAR_BY_ID[d.kumar];
        rows.push({ id: 'p' + id.replace(/[^A-Za-z0-9_-]/g, '').slice(0, 24), name: cleanName(d.name) || 'Player', title: String(d.title || '').slice(0, 30), icon: kum ? kum.icon : '🥚', vals: vals });
      });
    }
    rows.sort((a, b) => b.vals.life - a.vals.life);
    net.rows = rows.slice(0, 300);
    net.loaded = true;
    net.err = '';
    net.at = now;
    net.cache = null;
    ui.dirty = ui.dirty || ui.tab === 'board';
  }).catch(() => { net.err = 'offline'; });
}

step('boards', () => {
  EXTRA_BOARDS.forEach(b => { if (!BOARDS.some(x => x.id === b.id)) BOARDS.push({ id: b.id, name: b.name }); });

  wrap('playerValue', orig => board => (hasOwn(EXTRA_BY_ID, board) ? EXTRA_BY_ID[board].get() : orig(board)));
  wrap('rivalValue', orig => (r, board) => (hasOwn(EXTRA_BY_ID, board) ? EXTRA_BY_ID[board].rival(RIVALS.indexOf(r) + 1, rivalHours()) : orig(r, board)));

  origGetBoard = wrap('getBoard', orig => function (board) {
    const k = KUMAR_BY_ID[S.kumar] || KUMARS[0];
    if (!online() || !net.loaded) {
      const rows = orig(board);
      rows.forEach(r => { if (r.you) r.title = currentTitle(); });
      return rows;
    }
    const now = Date.now();
    if (net.cache && net.cache.board === board && now - net.cacheAt < 500) return net.cache.rows;
    const rows = net.rows.map(r => ({ id: r.id, name: r.name, icon: r.icon, title: r.title, value: safeNum(r.vals[board]), you: false }));
    rows.push({ id: 'you', name: S.playerName || 'You', icon: k.icon, title: currentTitle(), value: playerValue(board), you: true });
    rows.sort((a, b) => b.value - a.value);
    rows.forEach((r, i) => { r.rank = i + 1; });
    net.cache = { board: board, rows: rows };
    net.cacheAt = now;
    return rows;
  });

  /* The rank production bonus always uses the local computer rivals, so an empty real board cannot hand out #1 for free. */
  window.updateRank = function () {
    T.boardCache = {};
    const rows = origGetBoard('life');
    const me = rows.find(r => r.you);
    const rank = me ? me.rank : RIVALS.length + 1;
    const bonus = 1 + rankBonusFor(rank);
    const changed = bonus !== T.rankMult;
    if (T.lastRank && rank < T.lastRank) bus.emit('rankUp', rank, rows[rank] ? rows[rank].name : '');
    T.lastRank = rank;
    T.rank = rank;
    T.rankMult = bonus;
    if (changed) recalc();
  };

  wrap('liveText', orig => function (key) {
    const p = key.split(':');
    if (p[0] === 'rankinfo') {
      const rows = origGetBoard('life');
      const me = rows.find(r => r.you);
      const b = rankBonusFor(me.rank);
      return 'Rank bonus (vs the computer Kumars): #' + me.rank + ' of ' + rows.length + '. ' + (b > 0 ? '+' + Math.round(b * 100) + '% production.' : 'None yet (reach the top 8).');
    }
    if (p[0] === 'daily') {
      const left = 20 * 3600 - (Date.now() - S.daily.last) / 1000;
      return left <= 0 ? 'Claim gift' : 'Ready in ' + fmtTime(left);
    }
    return orig(key);
  });
  wrap('liveAff', orig => function (key) {
    if (key.indexOf('daily:') === 0) return dailyReady();
    return orig(key);
  });

  const t = TAB_BY_ID.board;
  const origSig = t.sig;
  t.sig = () => origSig() + '|' + currentTitle() + '|' + net.at + '|' + net.loaded;
  t.render = renderBoard;
});

function dailyReady() {
  if (S.daily.last > Date.now()) S.daily.last = 0;
  return Date.now() - S.daily.last >= 20 * 3600 * 1000;
}

function claimDaily() {
  if (!dailyReady()) return null;
  const now = Date.now();
  const gap = now - S.daily.last;
  S.daily.streak = (S.daily.last && gap < 48 * 3600 * 1000) ? S.daily.streak + 1 : 1;
  S.daily.last = now;
  const s = S.daily.streak;
  const fk = calc.cps * 1800 * (1 + 0.25 * Math.min(s, 20)) + 5000 * s;
  addFk(fk, 'daily');
  const rp = Math.min(s, 10);
  addResearch(rp);
  addBuff({ id: 'frenzy', name: 'Finn Frenzy', kind: 'cps', mult: 7, tone: 'sunny' }, 60);
  const parts = ['+' + fmt(fk) + ' Finn Kumar', '+' + rp + ' RP', 'a 60 second Frenzy'];
  if (s % 7 === 0 && S.rebirths >= 1) { S.rt += 1; S.rtTotal += 1; S.rtRun += 1; parts.push('+1 Rebirth Token'); }
  recalc();
  return 'Day ' + s + ': ' + parts.join(', ');
}

/* =====================================================================
   8. REAL ACCOUNTS: Firebase email/password auth + cloud saves
   Configure window.FK_CONFIG with your Firebase Web API key and RTDB URL.
   Username is used as a private synthetic email; passwords are handled by
   Firebase Authentication and are never stored in this HTML/localStorage.
   ===================================================================== */
const AUTH_KEY = 'fk-auth-session-v1';
const USER_EMAIL_DOMAIN = '@kumar.game';
let authUser = null;
let authBusy = false;
let authMessage = '';
let authMode = 'login';
let cloudSaveBusy = false;
let lastCloudSave = 0;
let profileOpen = false;
const FRAME_STYLES = [
  ['Gold', 'linear-gradient(135deg,#ffe27a,#b87918,#fff0a8)'],
  ['Neon', 'linear-gradient(135deg,#50eaff,#8d4dff,#ff4cba)'],
  ['Emerald', 'linear-gradient(135deg,#9dffca,#079b70,#d7ffe9)'],
  ['Crimson', 'linear-gradient(135deg,#ff9b9b,#a41438,#ffd0d0)']
];

function authConfigured() { return !!(CFG.apiKey && !String(CFG.apiKey).includes('PASTE_') && DB && !DB.includes('YOUR-PROJECT')); }
function authEmail(username) { return cleanName(username).toLowerCase() + USER_EMAIL_DOMAIN; }
function authErrorMessage(raw) {
  const code = String(raw || 'UNKNOWN');
  const map = {
    EMAIL_EXISTS: 'That username is already taken.',
    EMAIL_NOT_FOUND: 'Username or password is incorrect.',
    INVALID_PASSWORD: 'Username or password is incorrect.',
    INVALID_LOGIN_CREDENTIALS: 'Username or password is incorrect.',
    WEAK_PASSWORD: 'Password must be at least 6 characters.',
    TOO_MANY_ATTEMPTS_TRY_LATER: 'Too many attempts. Try again later.',
    OPERATION_NOT_ALLOWED: 'Enable Email/Password sign-in in Firebase Authentication.',
    API_KEY_INVALID: 'Firebase API key is incorrect.',
    USER_DISABLED: 'This account has been disabled.'
  };
  return map[code] || ('Account error: ' + code.replace(/_/g, ' ').toLowerCase());
}
async function authRequest(method, payload) {
  const url = 'https://identitytoolkit.googleapis.com/v1/accounts:' + method + '?key=' + encodeURIComponent(CFG.apiKey);
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(authErrorMessage(data.error && data.error.message));
  return data;
}
function persistAuth(data, username) {
  authUser = { uid: data.localId, username: username, idToken: data.idToken, refreshToken: data.refreshToken, expiresAt: Date.now() + Math.max(60, Number(data.expiresIn || 3600) - 60) * 1000 };
  try { localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: authUser.uid, username: username, refreshToken: authUser.refreshToken })); } catch (e) {}
}
async function refreshAuth() {
  if (!authUser || !authUser.refreshToken) throw new Error('Please log in again.');
  const res = await fetch('https://securetoken.googleapis.com/v1/token?key=' + encodeURIComponent(CFG.apiKey), {
    method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(authUser.refreshToken)
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) { authUser = null; try { localStorage.removeItem(AUTH_KEY); } catch (e) {} throw new Error('Your session expired. Please log in again.'); }
  authUser.idToken = data.id_token;
  authUser.refreshToken = data.refresh_token;
  authUser.expiresAt = Date.now() + Math.max(60, Number(data.expires_in || 3600) - 60) * 1000;
  try { localStorage.setItem(AUTH_KEY, JSON.stringify({ uid: authUser.uid, username: authUser.username, refreshToken: authUser.refreshToken })); } catch (e) {}
}
async function token() { if (!authUser) throw new Error('Not logged in.'); if (Date.now() >= authUser.expiresAt) await refreshAuth(); return authUser.idToken; }
async function dbRequest(path, options) {
  const idToken = await token();
  const opts = Object.assign({}, options || {});
  opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
  let url = DB + path + (path.includes('?') ? '&' : '?') + 'auth=' + encodeURIComponent(idToken);
  let res = await fetch(url, opts);
  if (res.status === 401 || res.status === 403) {
    await refreshAuth();
    url = DB + path + (path.includes('?') ? '&' : '?') + 'auth=' + encodeURIComponent(authUser.idToken);
    res = await fetch(url, opts);
  }
  if (!res.ok) throw new Error('Database request failed (' + res.status + '). Check Firebase Realtime Database rules.');
  return res.status === 204 ? null : res.json().catch(() => null);
}
function profileFrameIndex() { return Math.max(0, Math.min(FRAME_STYLES.length - 1, Number(S.profileFrame || 0) | 0)); }
function profileAvatar() { const k = KUMAR_BY_ID[S.kumar] || KUMARS[0]; return k.icon || '🥚'; }
function profileName() { return authUser ? authUser.username : 'Guest'; }
function authOverlayHtml() {
  const configured = authConfigured();
  return '<div id="fkAuthGate" class="fk-auth-gate"><div class="fk-auth-card">'
    + '<div class="fk-auth-logo">🥚</div><h1>' + (authMode === 'signup' ? 'Create your account' : 'Welcome back') + '</h1>'
    + '<p class="fk-auth-sub">' + (authMode === 'signup' ? 'Choose a username and password. Your progress will be saved online.' : 'Log in to load your account and continue your progress.') + '</p>'
    + (!configured ? '<div class="fk-auth-warning"><b>Firebase setup required</b><br>Open the HTML file and add your Firebase Web API key and Realtime Database URL in <code>window.FK_CONFIG</code>. Follow the setup steps below the download link.</div>' : '')
    + '<form id="fkAuthForm"><label>Username</label><input id="fkAuthUsername" autocomplete="username" maxlength="16" minlength="3" required placeholder="3–16 characters">'
    + '<label>Password</label><input id="fkAuthPassword" type="password" autocomplete="' + (authMode === 'signup' ? 'new-password' : 'current-password') + '" minlength="6" required placeholder="At least 6 characters">'
    + (authMode === 'signup' ? '<label>Confirm password</label><input id="fkAuthConfirm" type="password" autocomplete="new-password" minlength="6" required placeholder="Enter password again">' : '')
    + '<div class="fk-auth-error" id="fkAuthError">' + esc(authMessage) + '</div>'
    + '<button class="fk-auth-submit" type="submit" ' + (!configured || authBusy ? 'disabled' : '') + '>' + (authBusy ? 'Please wait…' : authMode === 'signup' ? 'Sign up' : 'Log in') + '</button></form>'
    + '<button class="fk-auth-switch" id="fkAuthSwitch" type="button">' + (authMode === 'signup' ? 'Already have an account? Log in' : 'New here? Create an account') + '</button>'
    + '<p class="fk-auth-note">Same browser: automatic login. Different devices: log in with the same username and password.</p>'
    + '</div></div>';
}
function ensureAuthUI() {
  if (!document.getElementById('fkAuthGate')) document.body.insertAdjacentHTML('beforeend', authOverlayHtml());
  if (!document.getElementById('fkTopProfile')) document.body.insertAdjacentHTML('beforeend', '<div id="fkTopProfile" class="fk-top-profile" style="display:none"></div>');
  renderAuthUI();
}
function renderAuthUI() {
  const gate = document.getElementById('fkAuthGate');
  const top = document.getElementById('fkTopProfile');
  if (gate) {
    if (authUser) gate.remove();
    else if (!document.getElementById('fkAuthForm')) gate.outerHTML = authOverlayHtml();
  }
  if (top) {
    if (!authUser) { top.style.display = 'none'; top.innerHTML = ''; }
    else {
      const fi = profileFrameIndex();
      top.style.display = 'block';
      top.innerHTML = '<button class="fk-profile-trigger" id="fkProfileToggle" type="button"><span class="fk-avatar-frame" style="background:' + FRAME_STYLES[fi][1] + '"><span>' + esc(profileAvatar()) + '</span></span><span class="fk-profile-name">' + esc(profileName()) + '</span><span class="fk-profile-caret">⌄</span></button>'
        + (profileOpen ? '<div class="fk-profile-menu"><div class="fk-profile-menu-head"><span class="fk-avatar-frame big" style="background:' + FRAME_STYLES[fi][1] + '"><span>' + esc(profileAvatar()) + '</span></span><span><b>' + esc(profileName()) + '</b><small>Real player account</small></span></div>'
          + '<label class="fk-frame-label">Profile frame</label><select id="fkFrameSelect">' + FRAME_STYLES.map((f,i) => '<option value="' + i + '" ' + (fi === i ? 'selected' : '') + '>' + f[0] + '</option>').join('') + '</select>'
          + '<div class="fk-profile-meta">Progress sync: ' + (authUser ? 'Online account' : 'Offline') + '</div><button id="fkLogout" class="fk-logout" type="button">Log out</button></div>' : '');
    }
  }
}
function showAuthGate(message) {
  authMessage = message || '';
  profileOpen = false;
  const old = document.getElementById('fkAuthGate');
  if (old) old.remove();
  document.body.insertAdjacentHTML('beforeend', authOverlayHtml());
  renderAuthUI();
}
async function loadCloudSave() {
  const cloud = await dbRequest('/users/' + encodeURIComponent(authUser.uid) + '/save.json', { method: 'GET' });
  if (cloud && typeof cloud === 'object' && cloud.v) {
    S = stateFromSaved(cloud);
    recalc(); updateRank(); updateStage(); ui.dirty = true;
    toast('Progress loaded', 'Your cloud save has been restored.', 'good');
  } else {
    /* First login on this account: migrate this browser's existing progress. */
    S.playerName = S.playerName && S.playerName !== 'You' ? S.playerName : authUser.username;
    saveGame();
    await cloudSave(true);
  }
}
async function cloudSave(force) {
  if (!authUser || cloudSaveBusy || !S) return;
  if (!force && Date.now() - lastCloudSave < 12000) return;
  cloudSaveBusy = true;
  try {
    const snapshot = JSON.parse(JSON.stringify(S));
    await dbRequest('/users/' + encodeURIComponent(authUser.uid) + '/save.json', { method: 'PUT', body: JSON.stringify(snapshot) });
    lastCloudSave = Date.now();
    await submitScore();
  } catch (e) { console.warn('[account] cloud save failed', e); }
  finally { cloudSaveBusy = false; }
}
async function doAuth(mode, username, password) {
  if (!authConfigured()) throw new Error('Firebase is not configured yet.');
  const name = cleanName(username);
  if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) throw new Error('Username must be 3–16 letters, numbers or underscores.');
  const data = await authRequest(mode === 'signup' ? 'signUp' : 'signInWithPassword', { email: authEmail(name), password: password, returnSecureToken: true });
  persistAuth(data, name);
  await loadCloudSave();
  authMessage = '';
  ensureAuthUI();
  renderAuthUI();
  ui.dirty = true;
  await cloudSave(true);
}
async function restoreSession() {
  if (!authConfigured()) { ensureAuthUI(); return; }
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) {}
  if (!saved || !saved.refreshToken || !saved.uid || !saved.username) { ensureAuthUI(); return; }
  authUser = { uid: saved.uid, username: saved.username, refreshToken: saved.refreshToken, idToken: '', expiresAt: 0 };
  try {
    await refreshAuth();
    await loadCloudSave();
    ensureAuthUI();
    renderAuthUI();
    await submitScore();
    await refreshBoard();
  } catch (e) {
    authUser = null;
    try { localStorage.removeItem(AUTH_KEY); } catch (x) {}
    showAuthGate('Your saved login expired. Please log in again.');
  }
}
async function logoutAccount() {
  if (authUser) await cloudSave(true);
  authUser = null; profileOpen = false;
  try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
  showAuthGate('You have been logged out.');
}

/* No computer-generated names are allowed in any leaderboard. */
RIVALS.length = 0;
RANK_BONUSES.length = 0; /* No artificial bot ranks or rewards. */
function realBoardRows(board) {
  const rows = [];
  const k = KUMAR_BY_ID[S.kumar] || KUMARS[0];
  rows.push({ id: 'you', name: authUser ? authUser.username : (S.playerName || 'You'), title: currentTitle(), icon: k.icon, value: playerValue(board), you: true });
  if (authUser && net.loaded) net.rows.forEach(r => rows.push({ id: r.id, name: r.name, title: r.title, icon: r.icon, value: safeNum(r.vals[board]), you: false }));
  rows.sort((a,b) => b.value - a.value);
  rows.forEach((r,i) => r.rank = i + 1);
  return rows;
}
function renderRealBoard() {
  const rows = realBoardRows(ui.board);
  const live = !!(authUser && net.loaded);
  let h = '<div class="panel"><div class="row"><span class="panel-title" style="margin:0">Real Player Leaderboard</span><span class="grow"></span><span class="pill ' + (live ? 'mint' : '') + '">' + (live ? rows.length + ' players' : authUser ? 'Connecting…' : 'Log in required') + '</span></div>'
    + '<div class="row" style="margin-top:10px">';
  BOARDS.forEach(b => { h += '<button class="mode-btn' + (ui.board === b.id ? ' active' : '') + '" type="button" data-act="board" data-id="' + b.id + '">' + esc(b.name) + '</button>'; });
  h += '</div><p class="panel-sub" style="margin-top:8px">Only accounts that sign up and play are shown. No bots or computer rivals.</p></div><div class="panel"><div class="lb">';
  rows.slice(0,50).forEach(r => { h += '<div class="lb-row' + (r.you ? ' you' : '') + (r.rank <= 3 ? ' top' + r.rank : '') + '"><span class="lb-rank">' + (r.rank === 1 ? '🥇' : r.rank === 2 ? '🥈' : r.rank === 3 ? '🥉' : '#' + r.rank) + '</span><span class="lb-name"><span class="lb-icon">' + esc(r.icon) + '</span>' + esc(r.name) + (r.you ? ' (you)' : '') + (r.title ? '<span class="hint-line" style="display:block;font-weight:700">' + esc(r.title) + '</span>' : '') + '</span><span class="lb-val mono">' + esc(fmt(r.value)) + '</span></div>'; });
  if (!rows.length) h += '<p class="panel-sub">No players yet.</p>';
  h += '</div></div>';
  h += '<div class="panel"><h3 class="panel-title">Your Records</h3><div class="stats-scroll"><table class="stats-table"><tbody>' + statRow('Lifetime Finn Kumar', fmt(S.lifeEarned)) + statRow('Best production', fmt(S.stats.bestCps) + ' / s') + statRow('Total clicks', fmt(S.counters.clicks)) + '</tbody></table></div></div>';
  return h;
}
TAB_BY_ID.board.render = renderRealBoard;
const originalProfileRender = TAB_BY_ID.profile.render;
TAB_BY_ID.profile.render = function () {
  const fi = profileFrameIndex();
  const accountCard = '<div class="panel pcard"><div class="pcard-head"><h3 class="pcard-title">Online Account</h3><span class="grow"></span><span class="pill mint">Signed in</span></div>'
    + '<div class="row" style="align-items:center;gap:12px"><span class="fk-avatar-frame big" style="background:' + FRAME_STYLES[fi][1] + '"><span>' + esc(profileAvatar()) + '</span></span><span><b>' + esc(profileName()) + '</b><small style="display:block;color:var(--muted)">' + esc(authUser.uid.slice(0, 12)) + '…</small></span></div>'
    + '<p class="panel-sub">Your game progress is saved to this account and can be restored on another device.</p>'
    + '<div class="row"><label class="setting-name" for="fkFrameSelectProfile">Avatar frame</label><select id="fkFrameSelectProfile" class="input">' + FRAME_STYLES.map((f,i) => '<option value="' + i + '" ' + (fi === i ? 'selected' : '') + '>' + f[0] + '</option>').join('') + '</select><button class="btn btn-sm" type="button" id="fkLogoutProfile">Log out</button></div></div>';
  return accountCard + originalProfileRender();
};
TAB_BY_ID.board.sig = () => [ui.board, net.at, net.loaded, authUser ? authUser.uid : ''].join('|');

/* Replace unauthenticated public writes with account-owned records. */
submitScore = async function () {
  if (!authUser) return;
  const rec = myRecord();
  rec.name = authUser.username;
  rec.uid = authUser.uid;
  try { await dbRequest('/scores/' + encodeURIComponent(authUser.uid) + '.json', { method: 'PUT', body: JSON.stringify(rec) }); }
  catch (e) { net.err = e.message || 'offline'; }
};
refreshBoard = async function () {
  if (!authUser) { net.rows = []; net.loaded = false; return; }
  try {
    const data = await fetch(DB + '/scores.json').then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); });
    const rows = [];
    if (data && typeof data === 'object') Object.keys(data).forEach(id => {
      const d = data[id];
      if (!d || typeof d !== 'object' || id === authUser.uid || typeof d.life !== 'number' || !d.uid) return;
      const vals = { life: safeNum(d.life), cps: safeNum(d.cps), clicks: safeNum(d.clicks) };
      EXTRA_BOARDS.forEach(b => { vals[b.id] = safeNum(d[b.id]); });
      const kum = KUMAR_BY_ID[d.kumar];
      rows.push({ id: 'p' + id.replace(/[^A-Za-z0-9_-]/g, '').slice(0,24), name: cleanName(d.name) || 'Player', title: String(d.title || '').slice(0,30), icon: kum ? kum.icon : '🥚', vals });
    });
    net.rows = rows; net.loaded = true; net.err = ''; net.at = Date.now(); ui.dirty = ui.dirty || ui.tab === 'board';
  } catch (e) { net.err = e.message || 'offline'; }
};

step('account-ui', () => {
  const css = document.createElement('style');
  css.textContent = `
  .fk-auth-gate{position:fixed;inset:0;z-index:1000000;display:grid;place-items:center;padding:20px;background:rgba(5,7,18,.94);backdrop-filter:blur(14px);font-family:inherit;color:#fff}
  .fk-auth-card{width:min(430px,100%);padding:30px;border:1px solid rgba(255,255,255,.14);border-radius:22px;background:linear-gradient(155deg,#1c2040,#101326);box-shadow:0 24px 90px #0009}
  .fk-auth-logo{font-size:42px;text-align:center}.fk-auth-card h1{text-align:center;margin:8px 0;font-size:25px}.fk-auth-sub,.fk-auth-note{color:#aab2d0;text-align:center;font-size:13px;line-height:1.55}.fk-auth-card label{display:block;margin:16px 0 6px;color:#cbd2ed;font-size:12px;font-weight:800}.fk-auth-card input,.fk-profile-menu select{box-sizing:border-box;width:100%;padding:13px 14px;border-radius:10px;border:1px solid #424968;background:#0b1023;color:white;outline:none}.fk-auth-card input:focus{border-color:#8d79ff}.fk-auth-submit{width:100%;margin-top:20px;padding:13px;border:0;border-radius:10px;background:linear-gradient(90deg,#8066ff,#bd55ef);color:white;font-weight:900;cursor:pointer}.fk-auth-submit:disabled{opacity:.45;cursor:not-allowed}.fk-auth-switch{display:block;margin:15px auto 0;border:0;background:none;color:#a99bff;cursor:pointer}.fk-auth-error{min-height:18px;margin-top:10px;color:#ff929e;font-size:12px}.fk-auth-warning{padding:12px;margin:16px 0;border:1px solid #98743a;border-radius:10px;background:#46371e;color:#ffe2a4;font-size:12px;line-height:1.5}.fk-auth-warning code{color:#fff}.fk-top-profile{position:fixed;z-index:99990;top:14px;right:16px;font-family:inherit}.fk-profile-trigger{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 6px;border:1px solid #ffffff30;border-radius:30px;background:#10152beF;color:#fff;box-shadow:0 6px 24px #0006;cursor:pointer}.fk-avatar-frame{width:38px;height:38px;border-radius:50%;padding:3px;display:grid;place-items:center;box-sizing:border-box}.fk-avatar-frame>span{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;background:#11172b;border:2px solid #11172b;font-size:20px}.fk-avatar-frame.big{width:52px;height:52px}.fk-profile-name{font-size:13px;font-weight:900;max-width:125px;overflow:hidden;text-overflow:ellipsis}.fk-profile-caret{color:#bfc5df}.fk-profile-menu{position:absolute;right:0;top:54px;width:245px;padding:15px;border:1px solid #ffffff22;border-radius:15px;background:#11172b;color:#fff;box-shadow:0 16px 45px #0009}.fk-profile-menu-head{display:flex;align-items:center;gap:11px;margin-bottom:14px}.fk-profile-menu-head b{display:block}.fk-profile-menu-head small{display:block;color:#9ca7c9;margin-top:3px}.fk-frame-label{display:block;margin:12px 0 6px;color:#b9c3e4;font-size:11px;font-weight:800}.fk-profile-meta{margin:10px 0;color:#8ee4bd;font-size:11px}.fk-logout{width:100%;padding:10px;border:1px solid #ff7e8b66;border-radius:9px;background:#7d2636;color:#fff;font-weight:800;cursor:pointer}
  `;
  document.head.appendChild(css);
  ensureAuthUI();
  document.addEventListener('submit', async ev => {
    if (ev.target.id !== 'fkAuthForm') return;
    ev.preventDefault(); if (authBusy) return;
    const username = document.getElementById('fkAuthUsername').value;
    const password = document.getElementById('fkAuthPassword').value;
    const confirm = document.getElementById('fkAuthConfirm');
    if (authMode === 'signup' && confirm && confirm.value !== password) { showAuthGate('Passwords do not match.'); authMode = 'signup'; return; }
    authBusy = true; authMessage = ''; showAuthGate('');
    const submit = document.querySelector('.fk-auth-submit'); if (submit) { submit.disabled = true; submit.textContent = 'Please wait…'; }
    try { await doAuth(authMode, username, password); }
    catch (e) { authBusy = false; showAuthGate(e.message || 'Could not log in.'); }
    finally { authBusy = false; }
  });
  document.addEventListener('click', ev => {
    const id = ev.target && ev.target.id;
    if (id === 'fkAuthSwitch') { authMode = authMode === 'login' ? 'signup' : 'login'; authMessage = ''; showAuthGate(''); }
    if (id === 'fkProfileToggle') { profileOpen = !profileOpen; renderAuthUI(); }
    if (id === 'fkLogout' || id === 'fkLogoutProfile') logoutAccount();
    if (id !== 'fkProfileToggle' && !ev.target.closest('.fk-profile-menu') && !ev.target.closest('.fk-top-profile')) { if (profileOpen) { profileOpen = false; renderAuthUI(); } }
  });
  document.addEventListener('change', ev => {
    if (ev.target.id === 'fkFrameSelect' || ev.target.id === 'fkFrameSelectProfile') { S.profileFrame = Number(ev.target.value) || 0; saveGame(); renderAuthUI(); ui.dirty = true; }
  });
  const originalSaveGame = saveGame;
  saveGame = function () { const ok = originalSaveGame(); if (authUser) cloudSave(false); return ok; };
  window.addEventListener('beforeunload', () => { if (authUser) cloudSave(true); });
  setInterval(() => { if (authUser) { cloudSave(false); refreshBoard(); } }, 15000);
  restoreSession();
});

/* ---------- finish ---------- */
step('finish', () => {
  recalc();
  updateRank();
  ui.skinSig = '';
  ui.buffSig = '';
  ui.navSig = '';
  ui.dirty = true;
  console.log('[finn-patch] loaded' + (online() ? ' (online leaderboard on)' : ' (offline leaderboard)'));
});

})();
